- name: Test that we have an ACI MultiSite host, username and password
  ansible.builtin.fail:
    msg: "Please define the following variables: mso_hostname, mso_username and mso_password."
  when: mso_hostname is not defined or mso_username is not defined or mso_password is not defined

- name: Set test connection and fixture variables
  ansible.builtin.set_fact:
    mso_info: &mso_info
      host: "{{ mso_hostname }}"
      username: "{{ mso_username }}"
      password: "{{ mso_password }}"
      validate_certs: "{{ mso_validate_certs | default(false) }}"
      use_ssl: "{{ mso_use_ssl | default(true) }}"
      use_proxy: "{{ mso_use_proxy | default(true) }}"
      output_level: '{{ mso_output_level | default("info") }}'
    mso_test:
      tenant: '{{ mso_tenant_route_map_policy_route_control | default(mso_tenant | default("ansible_test")) }}'
      template: '{{ mso_template_route_map_policy_route_control | default(mso_template | default("ansible_tenant_template")) }}'
      route_map_policy:
        first: route_map_policy_1
        first_updated: route_map_policy_1_updated
        second: route_map_policy_2
      description:
        initial: ""
        second: test
        updated: updated
        updated_again: updated_again
      match_type:
        combinable: prefix_and_routing_policy
        global: routing_policy_only
      route_map_type:
        combinable: combinable
        global: global

# QUERY VERSION
- name: Query MSO version
  cisco.mso.mso_version:
    <<: *mso_info
    state: query
  register: version

# NDO 4.4 accepts route map policies but omits routeMapType from responses, even
# when match_type is sent. Exercise CRUD on every version; check this field on 5.1+.
- name: Set Route Map Type support
  ansible.builtin.set_fact:
    route_map_type_supported: "{{ version.current.version is version('5.1', '>=') }}"

- name: Exercise ndo_route_map_policy_route_control
  block:
    # CLEAN TEST ENVIRONMENT
    - name: Ensure templates do not exist
      cisco.mso.ndo_template: &template_absent
        <<: *mso_info
        name: "{{ mso_test.template }}"
        template_type: tenant
        tenant: "{{ mso_test.tenant }}"
        state: absent
      ignore_errors: true

    - name: Ensure templates exist
      cisco.mso.ndo_template:
        <<: *template_absent
        state: present
      register: add_ansible_tenant_template

    # CREATE
    - name: Add Route Map Policy for Route Control 1 (check_mode)
      cisco.mso.ndo_route_map_policy_route_control: &cm_add_route_map_policy
        <<: *mso_info
        template: "{{ mso_test.template }}"
        name: "{{ mso_test.route_map_policy.first }}"
        state: present
        output_level: debug
      check_mode: true
      register: cm_add_route_map_policy

    - name: Add Route Map Policy for Route Control 1
      cisco.mso.ndo_route_map_policy_route_control:
        <<: *cm_add_route_map_policy
      register: nm_add_route_map_policy

    - name: Add Route Map Policy for Route Control 1 again
      cisco.mso.ndo_route_map_policy_route_control:
        <<: *cm_add_route_map_policy
      register: nm_add_route_map_policy_again

    - name: Add Route Map Policy for Route Control 2
      cisco.mso.ndo_route_map_policy_route_control:
        <<: *mso_info
        template_id: "{{ add_ansible_tenant_template.current.templateId }}"
        name: "{{ mso_test.route_map_policy.second }}"
        description: "{{ mso_test.description.second }}"
        match_type: "{{ mso_test.match_type.combinable if (route_map_type_supported | bool) else omit }}"
        state: present
      register: add_route_map_policy_2

    - name: Assertion check for add Route Map Policy for Route Controls
      ansible.builtin.assert:
        that:
          - cm_add_route_map_policy is changed
          - cm_add_route_map_policy.current.name == mso_test.route_map_policy.first
          - cm_add_route_map_policy.current.templateId is defined
          - cm_add_route_map_policy.current.templateName == mso_test.template
          - cm_add_route_map_policy.previous == {}
          - cm_add_route_map_policy.proposed.name == mso_test.route_map_policy.first
          - cm_add_route_map_policy.proposed.templateId is defined
          - cm_add_route_map_policy.proposed.templateName == mso_test.template
          - nm_add_route_map_policy is changed
          - nm_add_route_map_policy.current.description == mso_test.description.initial
          - nm_add_route_map_policy.current.name == mso_test.route_map_policy.first
          - not (route_map_type_supported | bool) or nm_add_route_map_policy.current.routeMapType == mso_test.route_map_type.global
          - nm_add_route_map_policy.current.templateId is defined
          - nm_add_route_map_policy.current.templateName == mso_test.template
          - nm_add_route_map_policy.current.uuid is defined
          - nm_add_route_map_policy.previous == {}
          - nm_add_route_map_policy.proposed.name == mso_test.route_map_policy.first
          - nm_add_route_map_policy.proposed.templateId is defined
          - nm_add_route_map_policy.proposed.templateName == mso_test.template
          - nm_add_route_map_policy_again is not changed
          - nm_add_route_map_policy_again.current.description == mso_test.description.initial
          - nm_add_route_map_policy_again.current.name == mso_test.route_map_policy.first
          - not (route_map_type_supported | bool) or nm_add_route_map_policy_again.current.routeMapType == mso_test.route_map_type.global
          - nm_add_route_map_policy_again.current.templateId is defined
          - nm_add_route_map_policy_again.current.templateName == mso_test.template
          - nm_add_route_map_policy_again.current.uuid is defined
          - nm_add_route_map_policy_again.previous.description == mso_test.description.initial
          - nm_add_route_map_policy_again.previous.name == mso_test.route_map_policy.first
          - not (route_map_type_supported | bool) or nm_add_route_map_policy_again.previous.routeMapType == mso_test.route_map_type.global
          - nm_add_route_map_policy_again.previous.templateId is defined
          - nm_add_route_map_policy_again.previous.templateName == mso_test.template
          - nm_add_route_map_policy_again.previous.uuid is defined
          - add_route_map_policy_2 is changed
          - add_route_map_policy_2.current.description == mso_test.description.second
          - add_route_map_policy_2.current.name == mso_test.route_map_policy.second
          - not (route_map_type_supported | bool) or add_route_map_policy_2.current.routeMapType == mso_test.route_map_type.combinable
          - add_route_map_policy_2.current.templateId is defined
          - add_route_map_policy_2.current.templateName == mso_test.template
          - add_route_map_policy_2.current.uuid is defined
          - add_route_map_policy_2.previous == {}

    # UPDATE
    - name: Update Route Map Policy for Route Control 1 (check_mode)
      cisco.mso.ndo_route_map_policy_route_control: &cm_update_route_map_policy
        <<: *mso_info
        template: "{{ mso_test.template }}"
        uuid: "{{ nm_add_route_map_policy.current.uuid }}"
        name: "{{ mso_test.route_map_policy.first_updated }}"
        description: "{{ mso_test.description.updated }}"
        match_type: "{{ mso_test.match_type.combinable if (route_map_type_supported | bool) else omit }}"
        state: present
        output_level: debug
      check_mode: true
      register: cm_update_route_map_policy

    - name: Update Route Map Policy for Route Control 1
      cisco.mso.ndo_route_map_policy_route_control:
        <<: *cm_update_route_map_policy
      register: nm_update_route_map_policy

    - name: Update Route Map Policy for Route Control 1 again
      cisco.mso.ndo_route_map_policy_route_control:
        <<: *cm_update_route_map_policy
      register: nm_update_route_map_policy_again

    - name: Update Route Map Policy for Route Control 1 using name
      cisco.mso.ndo_route_map_policy_route_control:
        <<: *mso_info
        template: "{{ mso_test.template }}"
        name: "{{ mso_test.route_map_policy.first_updated }}"
        description: "{{ mso_test.description.updated_again }}"
        match_type: "{{ mso_test.match_type.global if (route_map_type_supported | bool) else omit }}"
        state: present
      register: update_route_map_policy_with_name

    - name: Assertion check for update Route Map Policy for Route Controls
      ansible.builtin.assert:
        that:
          - cm_update_route_map_policy is changed
          - cm_update_route_map_policy.current.description == mso_test.description.updated
          - cm_update_route_map_policy.current.name == mso_test.route_map_policy.first_updated
          - not (route_map_type_supported | bool) or cm_update_route_map_policy.current.routeMapType == mso_test.route_map_type.combinable
          - cm_update_route_map_policy.current.templateId is defined
          - cm_update_route_map_policy.current.templateName == mso_test.template
          - cm_update_route_map_policy.current.uuid is defined
          - cm_update_route_map_policy.previous.description == mso_test.description.initial
          - cm_update_route_map_policy.previous.name == mso_test.route_map_policy.first
          - not (route_map_type_supported | bool) or cm_update_route_map_policy.previous.routeMapType == mso_test.route_map_type.global
          - cm_update_route_map_policy.previous.templateId is defined
          - cm_update_route_map_policy.previous.templateName == mso_test.template
          - cm_update_route_map_policy.previous.uuid is defined
          - cm_update_route_map_policy.proposed.description == mso_test.description.updated
          - cm_update_route_map_policy.proposed.name == mso_test.route_map_policy.first_updated
          - not (route_map_type_supported | bool) or cm_update_route_map_policy.proposed.routeMapType == mso_test.route_map_type.combinable
          - cm_update_route_map_policy.proposed.templateId is defined
          - cm_update_route_map_policy.proposed.templateName == mso_test.template
          - cm_update_route_map_policy.proposed.uuid is defined
          - nm_update_route_map_policy is changed
          - nm_update_route_map_policy.current.description == mso_test.description.updated
          - nm_update_route_map_policy.current.name == mso_test.route_map_policy.first_updated
          - not (route_map_type_supported | bool) or nm_update_route_map_policy.current.routeMapType == mso_test.route_map_type.combinable
          - nm_update_route_map_policy.current.templateId is defined
          - nm_update_route_map_policy.current.templateName == mso_test.template
          - nm_update_route_map_policy.current.uuid is defined
          - nm_update_route_map_policy.previous.description == mso_test.description.initial
          - nm_update_route_map_policy.previous.name == mso_test.route_map_policy.first
          - not (route_map_type_supported | bool) or nm_update_route_map_policy.previous.routeMapType == mso_test.route_map_type.global
          - nm_update_route_map_policy.previous.templateId is defined
          - nm_update_route_map_policy.previous.templateName == mso_test.template
          - nm_update_route_map_policy.previous.uuid is defined
          - nm_update_route_map_policy_again is not changed
          - nm_update_route_map_policy_again.current.description == mso_test.description.updated
          - nm_update_route_map_policy_again.current.name == mso_test.route_map_policy.first_updated
          - not (route_map_type_supported | bool) or nm_update_route_map_policy_again.current.routeMapType == mso_test.route_map_type.combinable
          - nm_update_route_map_policy_again.current.templateId is defined
          - nm_update_route_map_policy_again.current.templateName == mso_test.template
          - nm_update_route_map_policy_again.current.uuid is defined
          - nm_update_route_map_policy_again.previous.description == mso_test.description.updated
          - nm_update_route_map_policy_again.previous.name == mso_test.route_map_policy.first_updated
          - not (route_map_type_supported | bool) or nm_update_route_map_policy_again.previous.routeMapType == mso_test.route_map_type.combinable
          - nm_update_route_map_policy_again.previous.templateId is defined
          - nm_update_route_map_policy_again.previous.templateName == mso_test.template
          - nm_update_route_map_policy_again.previous.uuid is defined
          - update_route_map_policy_with_name is changed
          - update_route_map_policy_with_name.current.description == mso_test.description.updated_again
          - update_route_map_policy_with_name.current.name == mso_test.route_map_policy.first_updated
          - not (route_map_type_supported | bool) or update_route_map_policy_with_name.current.routeMapType == mso_test.route_map_type.global
          - update_route_map_policy_with_name.current.templateId is defined
          - update_route_map_policy_with_name.current.templateName == mso_test.template
          - update_route_map_policy_with_name.current.uuid is defined
          - update_route_map_policy_with_name.previous.description == mso_test.description.updated
          - update_route_map_policy_with_name.previous.name == mso_test.route_map_policy.first_updated
          - not (route_map_type_supported | bool) or update_route_map_policy_with_name.previous.routeMapType == mso_test.route_map_type.combinable
          - update_route_map_policy_with_name.previous.templateId is defined
          - update_route_map_policy_with_name.previous.templateName == mso_test.template
          - update_route_map_policy_with_name.previous.uuid is defined

    # QUERY
    - name: Query Route Map Policy for Route Control 1 using UUID
      cisco.mso.ndo_route_map_policy_route_control:
        <<: *mso_info
        template: "{{ mso_test.template }}"
        uuid: "{{ nm_add_route_map_policy.current.uuid }}"
        state: query
      register: query_route_map_policy_1_uuid

    - name: Query Route Map Policy for Route Control 1 using name
      cisco.mso.ndo_route_map_policy_route_control:
        <<: *mso_info
        template: "{{ mso_test.template }}"
        name: "{{ mso_test.route_map_policy.first_updated }}"
        state: query
      register: query_route_map_policy_1_name

    - name: Query all Route Map Policy for Route Control
      cisco.mso.ndo_route_map_policy_route_control:
        <<: *mso_info
        template: "{{ mso_test.template }}"
        state: query
      register: query_all

    - name: Assertion check for query all Route Map Policy for Route Controls
      ansible.builtin.assert:
        that:
          - query_route_map_policy_1_uuid is not changed
          - query_route_map_policy_1_uuid.current.description == mso_test.description.updated_again
          - query_route_map_policy_1_uuid.current.name == mso_test.route_map_policy.first_updated
          - not (route_map_type_supported | bool) or query_route_map_policy_1_uuid.current.routeMapType == mso_test.route_map_type.global
          - query_route_map_policy_1_uuid.current.templateId is defined
          - query_route_map_policy_1_uuid.current.templateName == mso_test.template
          - query_route_map_policy_1_uuid.current.uuid is defined
          - query_route_map_policy_1_name is not changed
          - query_route_map_policy_1_uuid.current == query_route_map_policy_1_name.current
          - query_all is not changed
          - query_all.current.0.description == mso_test.description.updated_again
          - query_all.current.0.name == mso_test.route_map_policy.first_updated
          - not (route_map_type_supported | bool) or query_all.current.0.routeMapType == mso_test.route_map_type.global
          - query_all.current.0.templateId is defined
          - query_all.current.0.templateName == mso_test.template
          - query_all.current.0.uuid is defined
          - query_all.current.1.description == mso_test.description.second
          - query_all.current.1.name == mso_test.route_map_policy.second
          - not (route_map_type_supported | bool) or query_all.current.1.routeMapType == mso_test.route_map_type.combinable
          - query_all.current.1.templateId is defined
          - query_all.current.1.templateName == mso_test.template
          - query_all.current.1.uuid is defined

    # DELETE
    - name: Delete Route Map Policy for Route Control 1 using UUID (check_mode)
      cisco.mso.ndo_route_map_policy_route_control: &cm_rm_route_map_policy_1_uuid
        <<: *mso_info
        template: "{{ mso_test.template }}"
        uuid: "{{ nm_add_route_map_policy.current.uuid }}"
        state: absent
        output_level: debug
      check_mode: true
      register: cm_rm_route_map_policy_1_uuid

    - name: Delete Route Map Policy for Route Control 1 using UUID
      cisco.mso.ndo_route_map_policy_route_control:
        <<: *cm_rm_route_map_policy_1_uuid
      register: nm_rm_route_map_policy_1_uuid

    - name: Delete Route Map Policy for Route Control 1 using UUID again
      cisco.mso.ndo_route_map_policy_route_control:
        <<: *cm_rm_route_map_policy_1_uuid
      register: nm_rm_route_map_policy_1_uuid_again

    - name: Delete Route Map Policy for Route Control 2 using name (check_mode)
      cisco.mso.ndo_route_map_policy_route_control: &cm_rm_route_map_policy_2_name
        <<: *mso_info
        template: "{{ mso_test.template }}"
        name: "{{ mso_test.route_map_policy.second }}"
        state: absent
        output_level: debug
      check_mode: true
      register: cm_rm_route_map_policy_2_name

    - name: Delete Route Map Policy for Route Control 2 using name
      cisco.mso.ndo_route_map_policy_route_control:
        <<: *cm_rm_route_map_policy_2_name
        state: absent
      register: nm_rm_route_map_policy_2_name

    - name: Delete Route Map Policy for Route Control 2 using name again
      cisco.mso.ndo_route_map_policy_route_control:
        <<: *cm_rm_route_map_policy_2_name
        state: absent
      register: nm_rm_route_map_policy_2_name_again

    - name: Assertion check for delete Route Map Policy for Route Controls
      ansible.builtin.assert:
        that:
          - cm_rm_route_map_policy_1_uuid is changed
          - cm_rm_route_map_policy_1_uuid.current == {}
          - cm_rm_route_map_policy_1_uuid.proposed == {}
          - nm_rm_route_map_policy_1_uuid is changed
          - nm_rm_route_map_policy_1_uuid.current == {}
          - nm_rm_route_map_policy_1_uuid.previous == cm_rm_route_map_policy_1_uuid.previous
          - nm_rm_route_map_policy_1_uuid.previous.description == mso_test.description.updated_again
          - nm_rm_route_map_policy_1_uuid.previous.name == mso_test.route_map_policy.first_updated
          - not (route_map_type_supported | bool) or nm_rm_route_map_policy_1_uuid.previous.routeMapType == mso_test.route_map_type.global
          - nm_rm_route_map_policy_1_uuid.previous.templateId is defined
          - nm_rm_route_map_policy_1_uuid.previous.templateName == mso_test.template
          - nm_rm_route_map_policy_1_uuid.previous.uuid is defined
          - nm_rm_route_map_policy_1_uuid_again is not changed
          - nm_rm_route_map_policy_1_uuid_again.current == {}
          - nm_rm_route_map_policy_1_uuid_again.previous == {}
          - cm_rm_route_map_policy_2_name is changed
          - cm_rm_route_map_policy_2_name.current == {}
          - cm_rm_route_map_policy_2_name.proposed == {}
          - nm_rm_route_map_policy_2_name is changed
          - nm_rm_route_map_policy_2_name.current == {}
          - cm_rm_route_map_policy_2_name.previous == nm_rm_route_map_policy_2_name.previous
          - nm_rm_route_map_policy_2_name.previous.description == mso_test.description.second
          - nm_rm_route_map_policy_2_name.previous.name == mso_test.route_map_policy.second
          - not (route_map_type_supported | bool) or nm_rm_route_map_policy_2_name.previous.routeMapType == mso_test.route_map_type.combinable
          - nm_rm_route_map_policy_2_name.previous.templateId is defined
          - nm_rm_route_map_policy_2_name.previous.templateName == mso_test.template
          - nm_rm_route_map_policy_2_name.previous.uuid is defined
          - nm_rm_route_map_policy_2_name_again is not changed
          - nm_rm_route_map_policy_2_name_again.current == {}
          - nm_rm_route_map_policy_2_name_again.previous == {}

    # ERROR
    - name: Negative test add Route Map Policy for Route Control without template
      cisco.mso.ndo_route_map_policy_route_control:
        <<: *mso_info
        name: "{{ mso_test.route_map_policy.first }}"
        state: present
      register: nt_add_route_map_policy_without_template
      ignore_errors: true

    - name: Negative test add Route Map Policy for Route Control without name and uuid
      cisco.mso.ndo_route_map_policy_route_control:
        <<: *mso_info
        template: "{{ mso_test.template }}"
        state: present
      register: nt_add_route_map_policy_without_name_uuid
      ignore_errors: true

    - name: Assertion check for negative test add Route Map Policy for Route Controls
      ansible.builtin.assert:
        that:
          - nt_add_route_map_policy_without_template is not changed
          - 'nt_add_route_map_policy_without_template.msg == "one of the following is required: template, template_id"'
          - nt_add_route_map_policy_without_name_uuid is not changed
          - 'nt_add_route_map_policy_without_name_uuid.msg == "state is present but any of the following are missing: name, uuid"'

  always:
    # CLEANUP
    - name: Remove test tenant template even when a test fails
      cisco.mso.ndo_template:
        <<: *template_absent
      ignore_errors: true
