  - name: Set error message for ans_test_uSeg_8_nt
    ansible.builtin.set_fact:
      error_message_ans_test_uSeg_8_nt: "Failed due to invalid 'value' or 'operator' and the attribute_type is: vm_operating_system."

  - name: Assertions check for add ans_test_uSeg_8 object
