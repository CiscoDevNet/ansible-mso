- name: Test that we have an ACI MultiSite host, username and password
  ansible.builtin.fail:
    msg: "Please define the following variables: mso_hostname, mso_username and mso_password."
  when: mso_hostname is not defined or mso_username is not defined or mso_password is not defined

- name: Set test connection and fixture variables
  ansible.builtin.set_fact:
    mso_info: &mso_info
      host: "{{ mso_hostname }}"
      username: "{{ mso_username }}"
      password: "{{ mso_password }}"
      validate_certs: "{{ mso_validate_certs | default(false) }}"
      use_ssl: "{{ mso_use_ssl | default(true) }}"
      use_proxy: "{{ mso_use_proxy | default(true) }}"
      output_level: '{{ mso_output_level | default("debug") }}'
    ignore_errors: true
    mso_test:
      schema: '{{ mso_schema_site_anp_epg_useg_attribute | default(mso_schema | default("ansible_test")) }}'
      schema_2: '{{ mso_schema_site_anp_epg_useg_attribute | default(mso_schema | default("ansible_test")) }}_2'
      tenant: '{{ mso_tenant_site_anp_epg_useg_attribute | default(mso_tenant | default("ansible_test")) }}'
      site: '{{ mso_site_site_anp_epg_useg_attribute | default(mso_site | default("ansible_test")) }}'
      template: 'ans_test_template'
      anp: 'ans_test_anp'
      epg: 'ans_test_epg'
      epg_2: 'ans_test_epg_2'
      bd: 'ans_test_bd'
      vrf: 'ans_test_vrf'
      attribute_1: 'ans_test_uSeg_1'
      attribute_2: 'ans_test_uSeg_2'
      attribute_3: 'ans_test_uSeg_3'
      attribute_4: 'ans_test_uSeg_4'
      attribute_6: 'ans_test_uSeg_6'
      attribute_7: 'ans_test_uSeg_7'
      attribute_8: 'ans_test_uSeg_8'
      attribute_9: 'ans_test_uSeg_9'
      attribute_10: 'ans_test_uSeg_10'
      attribute_11: 'ans_test_uSeg_11'
      attribute_12: 'ans_test_uSeg_12'
      attribute_13: 'ans_test_uSeg_13'
      ip_value: '1.2.3.4'
      ip_value_2: '11.22.33.44'
      mac_value: 'aa:bb:cc:dd:ee:ff'
      mac_value_upper: 'AA:BB:CC:DD:EE:FF'
      dns_value: 'test_dns_value'
      vm_datacenter_value: 'test_vm_datacenter_value'
      vm_hypervisor_value: 'test_vm_hypervisor_identifier_value'
      vm_os_value: 'test_vm_operating_system_value'
      vm_tag_value: 'test_vm_tag_value'
      vm_identifier_value: 'test_vm_identifier_value'
      vmm_domain_value: 'test_vmm_domain_value'
      vm_name_value: 'test_vm_value'
      vnic_dn_value: 'test_vnic_dn_value'
      vnic_dn_updated_value: 'test_vnic_dn_value_updated'

# Setup Part
- name: Exercise mso_schema_site_anp_epg_useg_attribute
  block:
  - name: Remove schemas
    cisco.mso.mso_schema:
      <<: *mso_info
      schema: '{{ item }}'
      state: absent
    loop:
    - '{{ mso_test.schema_2 }}'
    - '{{ mso_test.schema }}'

  - name: Ensure ansible_test schema with ans_test_template exist
    cisco.mso.mso_schema_template:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      tenant: '{{ mso_test.tenant }}'
      template: '{{ mso_test.template }}'
      state: present

  - name: Ensure ans_test_anp exist
    cisco.mso.mso_schema_template_anp:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      state: present

  - name: Add a new VRF
    cisco.mso.mso_schema_template_vrf:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      vrf: '{{ mso_test.vrf }}'
      state: present

  - name: Add a new BD
    cisco.mso.mso_schema_template_bd:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      bd: '{{ mso_test.bd }}'
      vrf:
        name: '{{ mso_test.vrf }}'
      state: present

  - name: Ensure ans_test_epg exist
    cisco.mso.mso_schema_template_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg }}'
      useg_epg: true
      bd:
       name: '{{ mso_test.bd }}'
      vrf:
       name: '{{ mso_test.vrf }}'
      state: present

  - name: Ensure ans_test_epg_2 exist without useg_epg
    cisco.mso.mso_schema_template_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg_2 }}'
      bd:
       name: '{{ mso_test.bd }}'
      vrf:
       name: '{{ mso_test.vrf }}'
      state: present

  - name: Associate a ansible_test site with a ansible_test tenant
    cisco.mso.mso_tenant_site:
      <<: *mso_info
      tenant: '{{ mso_test.tenant }}'
      site: '{{ mso_test.site }}'
      state: present

  - name: Ensure ansible_test site associated with ansible_test schema
    cisco.mso.mso_schema_site:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      state: present

  - name: Add ans_test_epg to the ansible_test site
    cisco.mso.mso_schema_site_anp_epg:
      <<: *mso_info
      site: '{{ mso_test.site }}'
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg }}'
      state: present

  # Test Part
  # Note: Ignore the below task, which is used to reference the attributes to other tasks
  - name: Invalid test - check for missing required attributes error message
    cisco.mso.mso_schema_site_anp_epg_useg_attribute: &useg_attribute_present
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg }}'
      description: "uSeg Attr object created using Ansible"
      site: '{{ mso_test.site }}'
      state: present
    ignore_errors: true
    register: ans_test_uSeg_1_nt

  - name: ans_test_uSeg_1 present - attribute_type - ip, useg_subnet - true, without value
    cisco.mso.mso_schema_site_anp_epg_useg_attribute:
      <<: *mso_info
      site: '{{ mso_test.site }}'
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg }}'
      name: '{{ mso_test.attribute_1 }}'
      attribute_type: ip
      useg_subnet: true
    register: ans_test_uSeg_1

  - name: Invalid test - ans_test_uSeg_2 present - attribute_type - ip, useg_subnet - false, without value
    cisco.mso.mso_schema_site_anp_epg_useg_attribute:
      <<: *useg_attribute_present
      name: '{{ mso_test.attribute_2 }}'
      attribute_type: ip
      useg_subnet: false
    ignore_errors: true
    register: ans_test_uSeg_2_nt

  - name: Invalid test - ans_test_uSeg_2 present - attribute_type - ip, useg_subnet - true, with value
    cisco.mso.mso_schema_site_anp_epg_useg_attribute:
      <<: *useg_attribute_present
      name: '{{ mso_test.attribute_2 }}'
      attribute_type: ip
      useg_subnet: true
      value: '{{ mso_test.ip_value }}'
    ignore_errors: true
    register: ans_test_uSeg_2_nt1

  - name: ans_test_uSeg_2 present - attribute_type - ip, useg_subnet - false, with value - check mode
    cisco.mso.mso_schema_site_anp_epg_useg_attribute: &ans_test_uSeg_2_cm_present
      <<: *useg_attribute_present
      name: '{{ mso_test.attribute_2 }}'
      attribute_type: ip
      useg_subnet: false
      value: '{{ mso_test.ip_value_2 }}'
    check_mode: true
    register: ans_test_uSeg_2_cm_present

  - name: ans_test_uSeg_2 present - attribute_type - ip, useg_subnet - false, with value - normal mode
    cisco.mso.mso_schema_site_anp_epg_useg_attribute: &ans_test_uSeg_2_nm_present
      <<: *ans_test_uSeg_2_cm_present
      output_level: debug
    register: ans_test_uSeg_2_nm_present

  - name: ans_test_uSeg_2 present - attribute_type - ip, useg_subnet - false, with value - normal mode again
    cisco.mso.mso_schema_site_anp_epg_useg_attribute:
      <<: *ans_test_uSeg_2_nm_present
      output_level: debug
    register: ans_test_uSeg_2_nm_present_again

  - name: Assertions check for add ans_test_uSeg_1 and ans_test_uSeg_2 object
    ansible.builtin.assert:
      that:
        - ans_test_uSeg_1 is changed
        - ans_test_uSeg_1.current != {}
        - ans_test_uSeg_1.current.name == "{{ mso_test.attribute_1 }}"
        - ans_test_uSeg_1.current.type == "ip"
        - ans_test_uSeg_1.current.value == "0.0.0.0"
        - ans_test_uSeg_1.current.fvSubnet == true
        - ans_test_uSeg_1.current.description == "{{ mso_test.attribute_1 }}"
        - ans_test_uSeg_2_nt is not changed
        - 'ans_test_uSeg_2_nt.msg == "useg_subnet is False but all of the following are missing: value"'
        - ans_test_uSeg_2_nt1 is not changed
        - ans_test_uSeg_2_nt1.msg == "The value of uSeg subnet IP should be an empty string or 0.0.0.0, when the useg_subnet is set to true."
        - ans_test_uSeg_2_cm_present is changed
        - ans_test_uSeg_2_cm_present.current != {}
        - ans_test_uSeg_2_cm_present.previous == {}
        - ans_test_uSeg_2_cm_present.current.name == "{{ mso_test.attribute_2 }}"
        - ans_test_uSeg_2_cm_present.current.type == "ip"
        - ans_test_uSeg_2_cm_present.current.value == "{{ mso_test.ip_value_2 }}"
        - ans_test_uSeg_2_cm_present.current.fvSubnet == false
        - ans_test_uSeg_2_cm_present.current.description == "uSeg Attr object created using Ansible"
        - ans_test_uSeg_2_nm_present is changed
        - ans_test_uSeg_2_nm_present.current != {}
        - ans_test_uSeg_2_nm_present.previous == {}
        - ans_test_uSeg_2_nm_present.current.name == "{{ mso_test.attribute_2 }}"
        - ans_test_uSeg_2_nm_present.current.type == "ip"
        - ans_test_uSeg_2_nm_present.current.value == "{{ mso_test.ip_value_2 }}"
        - ans_test_uSeg_2_nm_present.sent.fvSubnet == false
        - ans_test_uSeg_2_nm_present.current.description == "uSeg Attr object created using Ansible"
        - ans_test_uSeg_2_nm_present_again is not changed
        - ans_test_uSeg_2_nm_present_again.current != {}
        - ans_test_uSeg_2_nm_present_again.previous != {}
        - ans_test_uSeg_2_nm_present_again.current.name == "{{ mso_test.attribute_2 }}"
        - ans_test_uSeg_2_nm_present_again.current.type == "ip"
        - ans_test_uSeg_2_nm_present_again.current.value == "{{ mso_test.ip_value_2 }}"
        - ans_test_uSeg_2_nm_present_again.sent.fvSubnet == false
        - ans_test_uSeg_2_nm_present_again.current.description == "uSeg Attr object created using Ansible"
        - ans_test_uSeg_2_nm_present_again.previous.name == "{{ mso_test.attribute_2 }}"
        - ans_test_uSeg_2_nm_present_again.previous.type == "ip"
        - ans_test_uSeg_2_nm_present_again.previous.value == "{{ mso_test.ip_value_2 }}"
        - ans_test_uSeg_2_nm_present_again.previous.description == "uSeg Attr object created using Ansible"

  - name: Invalid test - ans_test_uSeg_3 present - attribute_type - mac and without value
    cisco.mso.mso_schema_site_anp_epg_useg_attribute:
      <<: *useg_attribute_present
      name: '{{ mso_test.attribute_3 }}'
      attribute_type: mac
    ignore_errors: true
    register: ans_test_uSeg_3_nt

  - name: ans_test_uSeg_3 present - attribute_type - mac and with value
    cisco.mso.mso_schema_site_anp_epg_useg_attribute:
      <<: *useg_attribute_present
      name: '{{ mso_test.attribute_3 }}'
      attribute_type: mac
      value: '{{ mso_test.mac_value }}'
    register: ans_test_uSeg_3

  - name: Set error message for ans_test_uSeg_3
    ansible.builtin.set_fact:
      error_message_ans_test_uSeg_3_nt: "Failed due to invalid 'value' and the attribute_type is: mac."

  - name: Assertions check for add ans_test_uSeg_3 object
    ansible.builtin.assert:
      that:
        - ans_test_uSeg_3_nt is not changed
        - ans_test_uSeg_3_nt.msg == error_message_ans_test_uSeg_3_nt
        - ans_test_uSeg_3 is changed
        - ans_test_uSeg_3.current != {}
        - ans_test_uSeg_3.previous == {}
        - ans_test_uSeg_3.current.description == "uSeg Attr object created using Ansible"
        - ans_test_uSeg_3.current.name == "{{ mso_test.attribute_3 }}"
        - ans_test_uSeg_3.current.type == "mac"
        - ans_test_uSeg_3.current.value == "{{ mso_test.mac_value }}"

  - name: Invalid test - ans_test_uSeg_4 present - attribute_type - dns and without value
    cisco.mso.mso_schema_site_anp_epg_useg_attribute:
      <<: *useg_attribute_present
      name: '{{ mso_test.attribute_4 }}'
      attribute_type: dns
    ignore_errors: true
    register: ans_test_uSeg_4_nt

  - name: ans_test_uSeg_4 present - attribute_type - dns and with value
    cisco.mso.mso_schema_site_anp_epg_useg_attribute:
      <<: *useg_attribute_present
      name: '{{ mso_test.attribute_4 }}'
      attribute_type: dns
      value: '{{ mso_test.dns_value }}'
    register: ans_test_uSeg_4

  - name: Set error message for ans_test_uSeg_4_nt
    ansible.builtin.set_fact:
      error_message_ans_test_uSeg_4_nt: "Failed due to invalid 'value' and the attribute_type is: dns."

  - name: Assertions check for add ans_test_uSeg_4 object
    ansible.builtin.assert:
      that:
        - ans_test_uSeg_4_nt is not changed
        - ans_test_uSeg_4_nt.msg == error_message_ans_test_uSeg_4_nt
        - ans_test_uSeg_4 is changed
        - ans_test_uSeg_4.current != {}
        - ans_test_uSeg_4.previous == {}
        - ans_test_uSeg_4.current.description == "uSeg Attr object created using Ansible"
        - ans_test_uSeg_4.current.name == "{{ mso_test.attribute_4 }}"
        - ans_test_uSeg_4.current.type == "dns"
        - ans_test_uSeg_4.current.value == "{{ mso_test.dns_value }}"

  - name: Invalid test - ans_test_uSeg_6 present - attribute_type - vm_datacenter and without operator
    cisco.mso.mso_schema_site_anp_epg_useg_attribute:
      <<: *useg_attribute_present
      name: '{{ mso_test.attribute_6 }}'
      attribute_type: vm_datacenter
      value: '{{ mso_test.vm_datacenter_value }}'
    ignore_errors: true
    register: ans_test_uSeg_6_nt

  - name: Invalid test - ans_test_uSeg_6 present - attribute_type - vm_datacenter, operator - equals and without value
    cisco.mso.mso_schema_site_anp_epg_useg_attribute:
      <<: *useg_attribute_present
      name: '{{ mso_test.attribute_6 }}'
      attribute_type: vm_datacenter
      operator: equals
    ignore_errors: true
    register: ans_test_uSeg_6_nt1

  - name: ans_test_uSeg_6 present - attribute_type - vm_datacenter, operator - equals and value
    cisco.mso.mso_schema_site_anp_epg_useg_attribute:
      <<: *useg_attribute_present
      name: '{{ mso_test.attribute_6 }}'
      attribute_type: vm_datacenter
      operator: equals
      value: '{{ mso_test.vm_datacenter_value }}'
    register: ans_test_uSeg_6

  - name: Set error message for ans_test_uSeg_6_nt
    ansible.builtin.set_fact:
      error_message_ans_test_uSeg_6_nt: "Failed due to invalid 'value' or 'operator' and the attribute_type is: vm_datacenter."

  - name: Assertions check for add ans_test_uSeg_6 object
    ansible.builtin.assert:
      that:
        - ans_test_uSeg_6_nt is not changed
        - ans_test_uSeg_6_nt.msg == error_message_ans_test_uSeg_6_nt
        - ans_test_uSeg_6_nt1 is not changed
        - ans_test_uSeg_6_nt1.msg == error_message_ans_test_uSeg_6_nt
        - ans_test_uSeg_6 is changed
        - ans_test_uSeg_6.current != {}
        - ans_test_uSeg_6.previous == {}
        - ans_test_uSeg_6.current.description == "uSeg Attr object created using Ansible"
        - ans_test_uSeg_6.current.name == "{{ mso_test.attribute_6 }}"
        - ans_test_uSeg_6.current.type == "rootContName"
        - ans_test_uSeg_6.current.value == "{{ mso_test.vm_datacenter_value }}"

  - name: Invalid test - ans_test_uSeg_7 present - attribute_type - vm_hypervisor_identifier and without operator
    cisco.mso.mso_schema_site_anp_epg_useg_attribute:
      <<: *useg_attribute_present
      name: '{{ mso_test.attribute_7 }}'
      attribute_type: vm_hypervisor_identifier
      value: '{{ mso_test.vm_hypervisor_value }}'
    ignore_errors: true
    register: ans_test_uSeg_7_nt

  - name: Invalid test - ans_test_uSeg_7 present - attribute_type - vm_hypervisor_identifier, operator - equals and without value
    cisco.mso.mso_schema_site_anp_epg_useg_attribute:
      <<: *useg_attribute_present
      name: '{{ mso_test.attribute_7 }}'
      attribute_type: vm_hypervisor_identifier
      operator: equals
    ignore_errors: true
    register: ans_test_uSeg_7_nt1

  - name: ans_test_uSeg_7 present - attribute_type - vm_hypervisor_identifier, operator - equals and value
    cisco.mso.mso_schema_site_anp_epg_useg_attribute:
      <<: *useg_attribute_present
      name: '{{ mso_test.attribute_7 }}'
      attribute_type: vm_hypervisor_identifier
      operator: equals
      value: '{{ mso_test.vm_hypervisor_value }}'
    register: ans_test_uSeg_7

  - name: Set error message for ans_test_uSeg_7_nt
    ansible.builtin.set_fact:
      error_message_ans_test_uSeg_7_nt: "Failed due to invalid 'value' or 'operator' and the attribute_type is: vm_hypervisor_identifier."

  - name: Assertions check for add ans_test_uSeg_7 object
    ansible.builtin.assert:
      that:
        - ans_test_uSeg_7_nt is not changed
        - ans_test_uSeg_7_nt.msg == error_message_ans_test_uSeg_7_nt
        - ans_test_uSeg_7_nt1 is not changed
        - ans_test_uSeg_7_nt1.msg == error_message_ans_test_uSeg_7_nt
        - ans_test_uSeg_7 is changed
        - ans_test_uSeg_7.current != {}
        - ans_test_uSeg_7.previous == {}
        - ans_test_uSeg_7.current.description == "uSeg Attr object created using Ansible"
        - ans_test_uSeg_7.current.name == "{{ mso_test.attribute_7 }}"
        - ans_test_uSeg_7.current.type == "hv"
        - ans_test_uSeg_7.current.value == "{{ mso_test.vm_hypervisor_value }}"

  - name: Invalid test - ans_test_uSeg_8 present - attribute_type - vm_operating_system and without operator
    cisco.mso.mso_schema_site_anp_epg_useg_attribute:
      <<: *useg_attribute_present
      name: '{{ mso_test.attribute_8 }}'
      attribute_type: vm_operating_system
