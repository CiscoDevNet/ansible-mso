- name: Test that required ACI MultiSite variables are defined
  ansible.builtin.fail:
    msg: 'Please define mso_hostname, mso_username and mso_password.'
  when: mso_hostname is not defined or mso_username is not defined or mso_password is not defined

- name: Set test connection and fixture variables
  ansible.builtin.set_fact:
    mso_info: &mso_info
      host: '{{ mso_hostname }}'
      username: '{{ mso_username }}'
      password: '{{ mso_password }}'
      validate_certs: '{{ mso_validate_certs | default(false) }}'
      use_ssl: '{{ mso_use_ssl | default(true) }}'
      use_proxy: '{{ mso_use_proxy | default(true) }}'
      output_level: debug
    mso_test:
      schema: '{{ mso_schema_template_external_epg | default(mso_schema | default("ansible_test")) }}'
      tenant: '{{ mso_tenant_template_external_epg | default(mso_tenant | default("ansible_test")) }}'
      template: Template1
      vrf: VRF1
      vrf_2: VRF2
      l3out: L3out1
      l3out_2: L3out2
      filter: Filter1
      filter_2: Filter2
      contract: Contract1
      contract_2: Contract2
      preferred_group: true
      external_epg:
        name: ExternalEPG1
        display_name: External EPG1 Display Name
        description: Template external EPG parent update
        qos_level: level5
        subnet:
          subnet: 10.20.40.0/24
          name: child-preservation-subnet
          scope:
          - shared-rtctrl
          aggregate:
          - shared-rtctrl
      external_epg_2: ExternalEPG2

- name: Exercise mso_schema_template_external_epg
  block:

  # CLEAN ENVIRONMENT
  - name: Remove test schema before testing
    cisco.mso.mso_schema:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      state: absent

  - name: Ensure tenant exists
    cisco.mso.mso_tenant:
      <<: *mso_info
      tenant: '{{ mso_test.tenant }}'
      users:
      - '{{ mso_username }}'
      state: present

  - name: Ensure schema and template exist
    cisco.mso.mso_schema_template:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      tenant: '{{ mso_test.tenant }}'
      template: '{{ mso_test.template }}'
      state: present

  # VRF2 enables preferred group so the corresponding external EPG
  # attribute can be exercised during the update.
  - name: Ensure template VRFs exist
    cisco.mso.mso_schema_template_vrf:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      vrf: '{{ item.vrf }}'
      preferred_group: '{{ item.preferred_group }}'
      state: present
    loop:
    - vrf: '{{ mso_test.vrf }}'
      preferred_group: false
    - vrf: '{{ mso_test.vrf_2 }}'
      preferred_group: '{{ mso_test.preferred_group }}'

  - name: Ensure template L3Outs exist
    cisco.mso.mso_schema_template_l3out:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      l3out: '{{ item.l3out }}'
      vrf:
        name: '{{ item.vrf }}'
      state: present
    loop:
    - l3out: '{{ mso_test.l3out }}'
      vrf: '{{ mso_test.vrf }}'
    - l3out: '{{ mso_test.l3out_2 }}'
      vrf: '{{ mso_test.vrf_2 }}'

  - name: Ensure template filters exist
    cisco.mso.mso_schema_template_filter_entry:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      filter: '{{ item.filter }}'
      entry: '{{ item.entry }}'
      state: present
    loop:
    - filter: '{{ mso_test.filter }}'
      entry: Filter1Entry
    - filter: '{{ mso_test.filter_2 }}'
      entry: Filter2Entry

  - name: Ensure template contracts exist
    cisco.mso.mso_schema_template_contract_filter:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      contract: '{{ item.contract }}'
      filter: '{{ item.filter }}'
      state: present
    loop:
    - contract: '{{ mso_test.contract }}'
      filter: '{{ mso_test.filter }}'
    - contract: '{{ mso_test.contract_2 }}'
      filter: '{{ mso_test.filter_2 }}'

  # CREATE
  - name: Create template external EPG1 in check mode
    cisco.mso.mso_schema_template_external_epg: &external_epg_1_present
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      external_epg: '{{ mso_test.external_epg.name }}'
      vrf:
        name: '{{ mso_test.vrf }}'
      l3out:
        name: '{{ mso_test.l3out }}'
      state: present
    check_mode: true
    register: cm_create_external_epg_1

  - name: Create template external EPG1
    cisco.mso.mso_schema_template_external_epg:
      <<: *external_epg_1_present
    register: nm_create_external_epg_1

  - name: Create template external EPG1 again
    cisco.mso.mso_schema_template_external_epg:
      <<: *external_epg_1_present
    register: nm_create_external_epg_1_again

  - name: Create template external EPG2
    cisco.mso.mso_schema_template_external_epg: &external_epg_2_present
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      external_epg: '{{ mso_test.external_epg_2 }}'
      vrf:
        name: '{{ mso_test.vrf }}'
      l3out:
        name: '{{ mso_test.l3out }}'
      state: present
    register: nm_create_external_epg_2

  - name: Verify template external EPG creation and idempotency
    ansible.builtin.assert:
      that:
      - cm_create_external_epg_1 is changed
      - cm_create_external_epg_1.previous == {}
      - nm_create_external_epg_1 is changed
      - nm_create_external_epg_1.previous == {}
      - cm_create_external_epg_1.current == nm_create_external_epg_1.current
      - nm_create_external_epg_1.current.name == mso_test.external_epg.name
      - nm_create_external_epg_1.current.displayName == mso_test.external_epg.name
      - nm_create_external_epg_1.current.vrfRef.vrfName == mso_test.vrf
      - nm_create_external_epg_1.current.l3outRef.l3outName == mso_test.l3out
      - nm_create_external_epg_1_again is not changed
      - nm_create_external_epg_1_again.previous == nm_create_external_epg_1_again.current
      - nm_create_external_epg_1_again.current.name == mso_test.external_epg.name
      - nm_create_external_epg_1_again.current.displayName == mso_test.external_epg.name
      - nm_create_external_epg_1_again.current.description == ''
      - nm_create_external_epg_1_again.current.extEpgType == 'on-premise'
      - not nm_create_external_epg_1_again.current.preferredGroup
      - nm_create_external_epg_1_again.current.qosPriority == 'unspecified'
      - nm_create_external_epg_1_again.current.vrfRef is mapping
      - nm_create_external_epg_1_again.current.vrfRef.templateName == mso_test.template
      - nm_create_external_epg_1_again.current.vrfRef.vrfName == mso_test.vrf
      - nm_create_external_epg_1_again.current.l3outRef is mapping
      - nm_create_external_epg_1_again.current.l3outRef.templateName == mso_test.template
      - nm_create_external_epg_1_again.current.l3outRef.l3outName == mso_test.l3out
      - nm_create_external_epg_1_again.current.contractRelationships | length == 0
      - nm_create_external_epg_1_again.current.subnets | length == 0
      - nm_create_external_epg_1_again.current.selectors | length == 0
      - nm_create_external_epg_1_again.current.tagAnnotations | length == 0
      - nm_create_external_epg_1_again.current.uuid is defined
      - nm_create_external_epg_2 is changed
      - nm_create_external_epg_2.current.name == mso_test.external_epg_2
      - nm_create_external_epg_2.current.vrfRef.vrfName == mso_test.vrf
      - nm_create_external_epg_2.current.l3outRef.l3outName == mso_test.l3out

  # UPDATE
  # External EPG1 is created above. Add both supported child collections and
  # update real parent attributes without supplying child attributes. This
  # exercises the original child-preservation failure path.
  - name: Add contract relationships to template external EPG1
    cisco.mso.mso_schema_template_external_epg_contract:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      external_epg: '{{ mso_test.external_epg.name }}'
      contract:
        name: '{{ item.name }}'
        type: '{{ item.type }}'
      state: present
    loop:
    - name: '{{ mso_test.contract }}'
      type: consumer
    - name: '{{ mso_test.contract }}'
      type: provider
    - name: '{{ mso_test.contract_2 }}'
      type: consumer
    - name: '{{ mso_test.contract_2 }}'
      type: provider
    register: nm_add_contract_relationships

  - name: Add subnet child to template external EPG1
    cisco.mso.mso_schema_template_external_epg_subnet: &external_epg_1_subnet
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      external_epg: '{{ mso_test.external_epg.name }}'
      subnet: '{{ mso_test.external_epg.subnet.subnet }}'
      name: '{{ mso_test.external_epg.subnet.name }}'
      scope: '{{ mso_test.external_epg.subnet.scope }}'
      aggregate: '{{ mso_test.external_epg.subnet.aggregate }}'
      state: present
    register: nm_add_subnet

  - name: Verify template external EPG child objects were created
    ansible.builtin.assert:
      that:
      - nm_add_contract_relationships.results | selectattr('changed', 'equalto', true) | list | length == 4
      - nm_add_subnet is changed

  - name: Update template external EPG1 in check mode
    cisco.mso.mso_schema_template_external_epg: &external_epg_1_update
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      external_epg: '{{ mso_test.external_epg.name }}'
      display_name: '{{ mso_test.external_epg.display_name }}'
      description: '{{ mso_test.external_epg.description }}'
      vrf:
        name: '{{ mso_test.vrf_2 }}'
      l3out:
        name: '{{ mso_test.l3out_2 }}'
      preferred_group: '{{ mso_test.preferred_group }}'
      qos_level: '{{ mso_test.external_epg.qos_level }}'
      state: present
    check_mode: true
    register: cm_update_external_epg_1

  - name: Update template external EPG1
    cisco.mso.mso_schema_template_external_epg:
      <<: *external_epg_1_update
    register: nm_update_external_epg_1

  - name: Update template external EPG1 again
    cisco.mso.mso_schema_template_external_epg:
      <<: *external_epg_1_update
    register: nm_update_external_epg_1_again

  - name: Query preserved contract relationships
    cisco.mso.mso_schema_template_external_epg_contract:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      external_epg: '{{ mso_test.external_epg.name }}'
      contract:
        name: '{{ item.name }}'
        type: '{{ item.type }}'
      state: query
    loop:
    - name: '{{ mso_test.contract }}'
      type: consumer
    - name: '{{ mso_test.contract }}'
      type: provider
    - name: '{{ mso_test.contract_2 }}'
      type: consumer
    - name: '{{ mso_test.contract_2 }}'
      type: provider
    register: nm_query_external_epg_contracts

  - name: Query preserved subnet child
    cisco.mso.mso_schema_template_external_epg_subnet:
      <<: *external_epg_1_subnet
      state: query
    register: nm_query_external_epg_subnet

  - name: Verify template external EPG update and child preservation
    ansible.builtin.assert:
      that:
      - cm_update_external_epg_1 is changed
      - nm_update_external_epg_1 is changed
      - nm_update_external_epg_1_again is not changed
      - cm_update_external_epg_1.current == nm_update_external_epg_1.current
      - nm_update_external_epg_1_again.previous == nm_update_external_epg_1_again.current
      - nm_update_external_epg_1_again.current == nm_update_external_epg_1.current
      - cm_update_external_epg_1.current.name == nm_update_external_epg_1.current.name == mso_test.external_epg.name
      - cm_update_external_epg_1.current.displayName == nm_update_external_epg_1.current.displayName == mso_test.external_epg.display_name
      - cm_update_external_epg_1.current.description == nm_update_external_epg_1.current.description == mso_test.external_epg.description
      - cm_update_external_epg_1.current.vrfRef.vrfName == nm_update_external_epg_1.current.vrfRef.vrfName == mso_test.vrf_2
      - cm_update_external_epg_1.current.l3outRef.l3outName == nm_update_external_epg_1.current.l3outRef.l3outName == mso_test.l3out_2
      - nm_update_external_epg_1.current.preferredGroup == mso_test.preferred_group
      - nm_update_external_epg_1.current.qosPriority == mso_test.external_epg.qos_level
      - nm_update_external_epg_1.current.extEpgType == 'on-premise'
      - nm_update_external_epg_1.current.contractRelationships | length == 4
      - nm_update_external_epg_1.current.subnets | length == 1
      - nm_update_external_epg_1_again.current.contractRelationships == nm_update_external_epg_1.current.contractRelationships
      - nm_update_external_epg_1_again.current.subnets == nm_update_external_epg_1.current.subnets
      - nm_query_external_epg_contracts.results | selectattr('changed', 'equalto', false) | list | length == 4
      - nm_query_external_epg_contracts.results | selectattr('current.contractRef.contractName', 'equalto', mso_test.contract) | selectattr('current.relationshipType', 'equalto', 'consumer') | list | length == 1
      - nm_query_external_epg_contracts.results | selectattr('current.contractRef.contractName', 'equalto', mso_test.contract) | selectattr('current.relationshipType', 'equalto', 'provider') | list | length == 1
      - nm_query_external_epg_contracts.results | selectattr('current.contractRef.contractName', 'equalto', mso_test.contract_2) | selectattr('current.relationshipType', 'equalto', 'consumer') | list | length == 1
      - nm_query_external_epg_contracts.results | selectattr('current.contractRef.contractName', 'equalto', mso_test.contract_2) | selectattr('current.relationshipType', 'equalto', 'provider') | list | length == 1
      - nm_query_external_epg_subnet is not changed
      - nm_query_external_epg_subnet.current.ip == mso_test.external_epg.subnet.subnet
      - nm_query_external_epg_subnet.current.name == mso_test.external_epg.subnet.name
      - nm_query_external_epg_subnet.current.scope == mso_test.external_epg.subnet.scope
      - nm_query_external_epg_subnet.current.aggregate == mso_test.external_epg.subnet.aggregate

  # QUERY
  - name: Query template external EPG1 in check mode
    cisco.mso.mso_schema_template_external_epg: &external_epg_1_query
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      external_epg: '{{ mso_test.external_epg.name }}'
      state: query
    check_mode: true
    register: cm_query_external_epg_1

  - name: Query template external EPG1
    cisco.mso.mso_schema_template_external_epg:
      <<: *external_epg_1_query
    register: nm_query_external_epg_1

  - name: Query all template external EPGs in check mode
    cisco.mso.mso_schema_template_external_epg: &all_external_epgs_query
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      state: query
    check_mode: true
    register: cm_query_all_external_epgs

  - name: Query all template external EPGs
    cisco.mso.mso_schema_template_external_epg:
      <<: *all_external_epgs_query
    register: nm_query_all_external_epgs

  - name: Verify specific template external EPG query
    ansible.builtin.assert:
      that:
      - cm_query_external_epg_1 is not changed
      - nm_query_external_epg_1 is not changed
      - cm_query_external_epg_1.current == nm_query_external_epg_1.current
      - nm_query_external_epg_1.current.name == mso_test.external_epg.name
      - nm_query_external_epg_1.current.displayName == mso_test.external_epg.display_name
      - nm_query_external_epg_1.current.description == mso_test.external_epg.description
      - nm_query_external_epg_1.current.extEpgType == 'on-premise'
      - nm_query_external_epg_1.current.preferredGroup == mso_test.preferred_group
      - nm_query_external_epg_1.current.qosPriority == mso_test.external_epg.qos_level
      - nm_query_external_epg_1.current.vrfRef is mapping
      - nm_query_external_epg_1.current.vrfRef.templateName == mso_test.template
      - nm_query_external_epg_1.current.vrfRef.vrfName == mso_test.vrf_2
      - nm_query_external_epg_1.current.l3outRef is mapping
      - nm_query_external_epg_1.current.l3outRef.templateName == mso_test.template
      - nm_query_external_epg_1.current.l3outRef.l3outName == mso_test.l3out_2
      - nm_query_external_epg_1.current.contractRelationships | length == 4
      - nm_query_external_epg_1.current.subnets | length == 1

  - name: Verify template external EPG collection query
    ansible.builtin.assert:
      that:
      - cm_query_all_external_epgs is not changed
      - nm_query_all_external_epgs is not changed
      - cm_query_all_external_epgs.current == nm_query_all_external_epgs.current
      - cm_query_all_external_epgs.current | length == nm_query_all_external_epgs.current | length == 2
      - nm_query_all_external_epgs.current | selectattr('name', 'equalto', mso_test.external_epg.name) | list | length == 1
      - nm_query_all_external_epgs.current | selectattr('name', 'equalto', mso_test.external_epg_2) | list | length == 1
      - (nm_query_all_external_epgs.current | selectattr('name', 'equalto', mso_test.external_epg.name) | first).vrfRef is mapping
      - (nm_query_all_external_epgs.current | selectattr('name', 'equalto', mso_test.external_epg.name) | first).vrfRef.vrfName == mso_test.vrf_2
      - (nm_query_all_external_epgs.current | selectattr('name', 'equalto', mso_test.external_epg.name) | first).l3outRef is mapping
      - (nm_query_all_external_epgs.current | selectattr('name', 'equalto', mso_test.external_epg.name) | first).l3outRef.l3outName == mso_test.l3out_2
      - (nm_query_all_external_epgs.current | selectattr('name', 'equalto', mso_test.external_epg_2) | first).vrfRef is mapping
      - (nm_query_all_external_epgs.current | selectattr('name', 'equalto', mso_test.external_epg_2) | first).vrfRef.vrfName == mso_test.vrf
      - (nm_query_all_external_epgs.current | selectattr('name', 'equalto', mso_test.external_epg_2) | first).l3outRef is mapping
      - (nm_query_all_external_epgs.current | selectattr('name', 'equalto', mso_test.external_epg_2) | first).l3outRef.l3outName == mso_test.l3out

  # DELETE
  # Delete the child-populated external EPG1 to verify that removing the
  # parent also removes its template-level descendants.
  - name: Delete template external EPG1 in check mode
    cisco.mso.mso_schema_template_external_epg: &external_epg_1_absent
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      external_epg: '{{ mso_test.external_epg.name }}'
      state: absent
    check_mode: true
    register: cm_delete_external_epg_1

  - name: Delete template external EPG1
    cisco.mso.mso_schema_template_external_epg:
      <<: *external_epg_1_absent
    register: nm_delete_external_epg_1

  - name: Delete template external EPG1 again
    cisco.mso.mso_schema_template_external_epg:
      <<: *external_epg_1_absent
    register: nm_delete_external_epg_1_again

  - name: Verify template external EPG deletion and idempotency
    ansible.builtin.assert:
      that:
      - cm_delete_external_epg_1 is changed
      - cm_delete_external_epg_1.previous.contractRelationships | length == 4
      - cm_delete_external_epg_1.previous.subnets | length == 1
      - cm_delete_external_epg_1.previous == nm_delete_external_epg_1.previous
      - cm_delete_external_epg_1.proposed == cm_delete_external_epg_1.current == {}
      - nm_delete_external_epg_1 is changed
      - nm_delete_external_epg_1.previous.contractRelationships | length == 4
      - nm_delete_external_epg_1.previous.subnets | length == 1
      - nm_delete_external_epg_1.proposed == nm_delete_external_epg_1.current == {}
      - nm_delete_external_epg_1_again is not changed
      - nm_delete_external_epg_1_again.previous == nm_delete_external_epg_1_again.current == {}
      - nm_delete_external_epg_1_again.proposed == nm_delete_external_epg_1_again.current == {}

  # ERROR HANDLING
  - name: Query a missing external EPG in check mode
    cisco.mso.mso_schema_template_external_epg:
      <<: *all_external_epgs_query
      external_epg: MissingExternalEPG
    check_mode: true
    register: cm_missing_external_epg
    ignore_errors: true

  - name: Query a missing schema in check mode
    cisco.mso.mso_schema_template_external_epg:
      <<: *mso_info
      schema: MissingSchema
      template: '{{ mso_test.template }}'
      external_epg: '{{ mso_test.external_epg_2 }}'
      state: query
    check_mode: true
    register: cm_missing_schema
    ignore_errors: true

  - name: Query a missing template in check mode
    cisco.mso.mso_schema_template_external_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: MissingTemplate
      external_epg: '{{ mso_test.external_epg_2 }}'
      state: query
    check_mode: true
    register: cm_missing_template
    ignore_errors: true

  - name: Reject an invalid state in check mode
    cisco.mso.mso_schema_template_external_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      external_epg: '{{ mso_test.external_epg_2 }}'
      state: invalid
    check_mode: true
    register: cm_invalid_state
    ignore_errors: true

  - name: Reject a missing external EPG for state present in check mode
    cisco.mso.mso_schema_template_external_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      vrf:
        name: '{{ mso_test.vrf }}'
      state: present
    check_mode: true
    register: cm_missing_external_epg_present
    ignore_errors: true

  - name: Reject a missing external EPG for state absent in check mode
    cisco.mso.mso_schema_template_external_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      state: absent
    check_mode: true
    register: cm_missing_external_epg_absent
    ignore_errors: true

  - name: Reject a missing VRF for state present in check mode
    cisco.mso.mso_schema_template_external_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      external_epg: '{{ mso_test.external_epg_2 }}'
      state: present
    check_mode: true
    register: cm_missing_vrf_present
    ignore_errors: true

  - name: Reject a missing referenced VRF schema in check mode
    cisco.mso.mso_schema_template_external_epg:
      <<: *external_epg_2_present
      vrf:
        name: '{{ mso_test.vrf }}'
        schema: MissingSchema
        template: '{{ mso_test.template }}'
    check_mode: true
    register: cm_missing_vrf_schema
    ignore_errors: true

  - name: Reject a missing referenced L3Out schema in check mode
    cisco.mso.mso_schema_template_external_epg:
      <<: *external_epg_2_present
      l3out:
        name: '{{ mso_test.l3out }}'
        schema: MissingSchema
        template: '{{ mso_test.template }}'
    check_mode: true
    register: cm_missing_l3out_schema
    ignore_errors: true

  - name: Verify error-handling scenarios
    ansible.builtin.assert:
      that:
      - cm_missing_external_epg is failed
      - cm_missing_external_epg.msg == "External EPG 'MissingExternalEPG' not found"
      - cm_missing_schema is failed
      - cm_missing_schema.msg == "Provided schema 'MissingSchema' does not exist."
      - cm_missing_template is failed
      - "cm_missing_template.msg == \"Provided template 'MissingTemplate' does not exist. Existing templates: \" ~ mso_test.template"
      - cm_invalid_state is failed
      - 'cm_invalid_state.msg == "value of state must be one of: absent, present, query, got: invalid"'
      - cm_missing_external_epg_present is failed
      - "cm_missing_external_epg_present.msg == 'state is present but all of the following are missing: external_epg'"
      - cm_missing_external_epg_absent is failed
      - "cm_missing_external_epg_absent.msg == 'state is absent but all of the following are missing: external_epg'"
      - cm_missing_vrf_present is failed
      - "cm_missing_vrf_present.msg == 'state is present but all of the following are missing: vrf'"
      - cm_missing_vrf_schema is failed
      - cm_missing_vrf_schema.msg == "Referenced schema 'MissingSchema' in vrfref does not exist"
      - cm_missing_l3out_schema is failed
      - cm_missing_l3out_schema.msg == "Referenced schema 'MissingSchema' in l3outref does not exist"

  always:
  # CLEANUP
  - name: Remove test schema even when a test fails
    cisco.mso.mso_schema:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      state: absent
