- name: Test that we have an ACI MultiSite host, username and password
  ansible.builtin.fail:
    msg: 'Please define the following variables: mso_hostname, mso_username and mso_password.'
  when: mso_hostname is not defined or mso_username is not defined or mso_password is not defined


# CLEAN ENVIRONMENT
- name: Set test connection and fixture variables
  ansible.builtin.set_fact:
    mso_info: &mso_info
      host: '{{ mso_hostname }}'
      username: '{{ mso_username }}'
      password: '{{ mso_password }}'
      validate_certs: '{{ mso_validate_certs | default(false) }}'
      use_ssl: '{{ mso_use_ssl | default(true) }}'
      use_proxy: '{{ mso_use_proxy | default(false) }}'
      output_level: '{{ mso_output_level | default("debug") }}'
    mso_test:
      schema: '{{ mso_schema_template_contract_service_graph | default(mso_schema | default("ansible_test")) }}'
      schema_2: '{{ mso_schema_template_contract_service_graph_2 | default((mso_schema | default("ansible_test")) ~ "_2") }}'
      tenant: '{{ mso_tenant_template_contract_service_graph | default(mso_tenant | default("ansible_test")) }}'
      template: Template 1
      template_api: Template1
      template_2: Template 2
      filter:
        one:
          name: Filter1
          entry: Filter1Entry
        two:
          name: Filter2
          entry: Filter2Entry
        three:
          name: Filter3
          entry: Filter3Entry
      contract:
        one: Contract1
        two: Contract2
      service_graph:
        one:
          name: SG1
          display_name: sg1
        two:
          name: SG2
          display_name: sg2
      vrf: VRF1
      bd:
        one: BD1
        two: BD2
        three: BD3
      anp:
        one: AP1
        two: AP2
      epg:
        one: EPG1
        two: EPG2

- name: Exercise mso_schema_template_contract_service_graph
  block:
    - name: Remove schema 2
      cisco.mso.mso_schema:
        <<: *mso_info
        schema: "{{ mso_test.schema_2 }}"
        state: absent

    - name: Remove schema 1
      cisco.mso.mso_schema:
        <<: *mso_info
        schema: "{{ mso_test.schema }}"
        state: absent

    - name: Ensure tenant ansible_test exist
      cisco.mso.mso_tenant:
        <<: *mso_info
        tenant: "{{ mso_test.tenant }}"
        users:
        - '{{ mso_username }}'
        state: present

    - name: Ensure schema 1 with Template 1 exist
      cisco.mso.mso_schema_template: &schema_present
        <<: *mso_info
        schema: "{{ mso_test.schema }}"
        tenant: "{{ mso_test.tenant }}"
        template: "{{ mso_test.template }}"
        state: present

    - name: Ensure schema 1 with Template 2 exist
      cisco.mso.mso_schema_template:
        <<: *schema_present
        template: "{{ mso_test.template_2 }}"
        state: present

    - name: Ensure schema 2 with Template 1 exist
      cisco.mso.mso_schema_template:
        <<: *mso_info
        schema: "{{ mso_test.schema_2 }}"
        tenant: "{{ mso_test.tenant }}"
        template: "{{ mso_test.template }}"
        state: present

    - name: Ensure Filter1 exist
      cisco.mso.mso_schema_template_filter_entry: &filter_present
        <<: *mso_info
        schema: "{{ mso_test.schema }}"
        template: "{{ mso_test.template }}"
        filter: "{{ mso_test.filter.one.name }}"
        entry: "{{ mso_test.filter.one.entry }}"
        ethertype: ip
        state: present

    - name: Ensure Filter2 exist
      cisco.mso.mso_schema_template_filter_entry:
        <<: *filter_present
        filter: "{{ mso_test.filter.two.name }}"
        entry: "{{ mso_test.filter.two.entry }}"
        ethertype: ip
        state: present

    - name: Ensure Filter3 exist
      cisco.mso.mso_schema_template_filter_entry:
        <<: *mso_info
        schema: "{{ mso_test.schema_2 }}"
        template: "{{ mso_test.template }}"
        filter: "{{ mso_test.filter.three.name }}"
        entry: "{{ mso_test.filter.three.entry }}"
        ethertype: ip
        state: present

    - name: Ensure Contract_1 contract exist
      cisco.mso.mso_schema_template_contract_filter: &contract_present
        <<: *mso_info
        schema: "{{ mso_test.schema }}"
        template: "{{ mso_test.template }}"
        contract: "{{ mso_test.contract.one }}"
        filter: "{{ mso_test.filter.one.name }}"
        state: present

    - name: Ensure Contract_2 contract exist
      cisco.mso.mso_schema_template_contract_filter:
        <<: *mso_info
        schema: "{{ mso_test.schema_2 }}"
        template: "{{ mso_test.template }}"
        contract: "{{ mso_test.contract.two }}"
        filter: "{{ mso_test.filter.three.name }}"
        state: present

    - name: Ensure SG_1 service graph exist
      cisco.mso.mso_schema_template_service_graph:
        <<: *mso_info
        schema: "{{ mso_test.schema }}"
        template: "{{ mso_test.template }}"
        service_graph: "{{ mso_test.service_graph.one.name }}"
        display_name: "{{ mso_test.service_graph.one.display_name }}"
        service_nodes:
          - type: firewall
          - type: load-balancer
        state: present

    - name: Ensure SG_2 service graph exist
      cisco.mso.mso_schema_template_service_graph:
        <<: *mso_info
        schema: "{{ mso_test.schema_2 }}"
        template: "{{ mso_test.template }}"
        service_graph: "{{ mso_test.service_graph.two.name }}"
        display_name: "{{ mso_test.service_graph.two.display_name }}"
        service_nodes:
          - type: firewall
          - type: load-balancer
        state: present

    - name: Ensure VRF_1 vrf exist
      cisco.mso.mso_schema_template_vrf:
        <<: *mso_info
        schema: "{{ mso_test.schema }}"
        template: "{{ mso_test.template }}"
        vrf: "{{ mso_test.vrf }}"
        layer3_multicast: true
        state: present

    - name: Ensure BD_1 bd exist
      cisco.mso.mso_schema_template_bd: &bd_present
        <<: *mso_info
        schema: "{{ mso_test.schema }}"
        template: "{{ mso_test.template }}"
        bd: "{{ mso_test.bd.one }}"
        vrf:
          name: "{{ mso_test.vrf }}"
        state: present

    - name: Ensure BD_2 bd exist
      cisco.mso.mso_schema_template_bd:
        <<: *bd_present
        bd: "{{ mso_test.bd.two }}"
        state: present

    - name: Ensure BD_3 bd exist
      cisco.mso.mso_schema_template_bd:
        <<: *mso_info
        schema: "{{ mso_test.schema_2 }}"
        template: "{{ mso_test.template }}"
        bd: "{{ mso_test.bd.three }}"
        vrf:
          name: "{{ mso_test.vrf }}"
          schema: "{{ mso_test.schema }}"
        state: present

    - name: Ensure AP1 in Template 1 exists
      cisco.mso.mso_schema_template_anp:
        <<: *mso_info
        schema: "{{ mso_test.schema }}"
        template: "{{ mso_test.template }}"
        anp: "{{ mso_test.anp.one }}"
        state: present

    - name: Ensure AP1 in Template 1 exists
      cisco.mso.mso_schema_template_anp:
        <<: *mso_info
        schema: "{{ mso_test.schema_2 }}"
        template: "{{ mso_test.template }}"
        anp: "{{ mso_test.anp.two }}"
        state: present

    - name: Ensure EPG1 in AP1 in Template 1 exists
      cisco.mso.mso_schema_template_anp_epg:
        <<: *mso_info
        schema: "{{ mso_test.schema }}"
        template: "{{ mso_test.template }}"
        anp: "{{ mso_test.anp.one }}"
        epg: "{{ mso_test.epg.one }}"
        bd:
          name: "{{ mso_test.bd.one }}"
        state: present

    - name: Ensure EPG2 in AP1 in Template 1 exists
      cisco.mso.mso_schema_template_anp_epg:
        <<: *mso_info
        schema: "{{ mso_test.schema_2 }}"
        template: "{{ mso_test.template }}"
        anp: "{{ mso_test.anp.two }}"
        epg: "{{ mso_test.epg.two }}"
        bd:
          name: "{{ mso_test.bd.three }}"
        state: present

    - name: Add Contract1 to EPG1 provider
      cisco.mso.mso_schema_template_anp_epg_contract:
        <<: *mso_info
        schema: "{{ mso_test.schema }}"
        template: "{{ mso_test.template }}"
        anp: "{{ mso_test.anp.one }}"
        epg: "{{ mso_test.epg.one }}"
        contract:
          name: "{{ mso_test.contract.one }}"
          type: provider
        state: present

    - name: Add Contract1 to EPG1 consumer
      cisco.mso.mso_schema_template_anp_epg_contract:
        <<: *mso_info
        schema: "{{ mso_test.schema }}"
        template: "{{ mso_test.template }}"
        anp: "{{ mso_test.anp.one }}"
        epg: "{{ mso_test.epg.one }}"
        contract:
          name: "{{ mso_test.contract.one }}"
          type: consumer
        state: present

    - name: Add Contract2 to EPG2 provider
      cisco.mso.mso_schema_template_anp_epg_contract:
        <<: *mso_info
        schema: "{{ mso_test.schema_2 }}"
        template: "{{ mso_test.template }}"
        anp: "{{ mso_test.anp.two }}"
        epg: "{{ mso_test.epg.two }}"
        contract:
          name: "{{ mso_test.contract.two }}"
          type: provider
        state: present

    - name: Add Contract2 to EPG2 consumer
      cisco.mso.mso_schema_template_anp_epg_contract:
        <<: *mso_info
        schema: "{{ mso_test.schema_2 }}"
        template: "{{ mso_test.template }}"
        anp: "{{ mso_test.anp.two }}"
        epg: "{{ mso_test.epg.two }}"
        contract:
          name: "{{ mso_test.contract.two }}"
          type: consumer
        state: present

    # TESTS

    - name: Add service graph 1 to Contract1 (check_mode)
      cisco.mso.mso_schema_template_contract_service_graph:
        <<: *mso_info
        schema: "{{ mso_test.schema }}"
        template: "{{ mso_test.template }}"
        contract: "{{ mso_test.contract.one }}"
        service_graph: "{{ mso_test.service_graph.one.name }}"
        service_nodes:
          - consumer: "{{ mso_test.bd.one }}"
            provider: "{{ mso_test.bd.two }}"
          - consumer: "{{ mso_test.bd.one }}"
            provider: "{{ mso_test.bd.two }}"
        state: present
      check_mode: true
      register: cm_add_sg1_to_c1

    - name: Add service graph 1 to Contract1
      cisco.mso.mso_schema_template_contract_service_graph:
        <<: *mso_info
        schema: "{{ mso_test.schema }}"
        template: "{{ mso_test.template }}"
        contract: "{{ mso_test.contract.one }}"
        service_graph: "{{ mso_test.service_graph.one.name }}"
        service_nodes:
          - consumer: "{{ mso_test.bd.one }}"
            provider: "{{ mso_test.bd.two }}"
          - consumer: "{{ mso_test.bd.one }}"
            provider: "{{ mso_test.bd.two }}"
        state: present
      register: nm_add_sg1_to_c1

    - name: Verify service graph 1 is added to Contract1
      ansible.builtin.assert:
        that:
        - cm_add_sg1_to_c1 is changed
        - cm_add_sg1_to_c1.previous == {}
        - cm_add_sg1_to_c1.current.serviceGraphRef.serviceGraphName == mso_test.service_graph.one.name
        - cm_add_sg1_to_c1.current.serviceGraphRef.templateName == mso_test.template_api
        - cm_add_sg1_to_c1.current.serviceNodesRelationship.0.consumerConnector.bdRef.bdName == mso_test.bd.one
        - cm_add_sg1_to_c1.current.serviceNodesRelationship.0.consumerConnector.connectorType == "general"
        - cm_add_sg1_to_c1.current.serviceNodesRelationship.0.providerConnector.bdRef.bdName == mso_test.bd.two
        - cm_add_sg1_to_c1.current.serviceNodesRelationship.0.providerConnector.connectorType == "general"
        - cm_add_sg1_to_c1.current.serviceNodesRelationship.0.serviceNodeRef.serviceGraphName == mso_test.service_graph.one.name
        - cm_add_sg1_to_c1.current.serviceNodesRelationship.0.serviceNodeRef.serviceNodeName == "node1"
        - cm_add_sg1_to_c1.current.serviceNodesRelationship.1.serviceNodeRef.serviceNodeName == "node2"
        - nm_add_sg1_to_c1 is changed
        - nm_add_sg1_to_c1.previous == {}
        - nm_add_sg1_to_c1.current.serviceGraphRef.serviceGraphName == mso_test.service_graph.one.name
        - nm_add_sg1_to_c1.current.serviceGraphRef.templateName == mso_test.template_api
        - nm_add_sg1_to_c1.current.serviceNodesRelationship.0.consumerConnector.bdRef.bdName == mso_test.bd.one
        - nm_add_sg1_to_c1.current.serviceNodesRelationship.0.consumerConnector.connectorType == "general"
        - nm_add_sg1_to_c1.current.serviceNodesRelationship.0.providerConnector.bdRef.bdName == mso_test.bd.two
        - nm_add_sg1_to_c1.current.serviceNodesRelationship.0.providerConnector.connectorType == "general"
        - nm_add_sg1_to_c1.current.serviceNodesRelationship.0.serviceNodeRef.serviceGraphName == mso_test.service_graph.one.name
        - nm_add_sg1_to_c1.current.serviceNodesRelationship.0.serviceNodeRef.serviceNodeName == "node1"
        - nm_add_sg1_to_c1.current.serviceNodesRelationship.1.serviceNodeRef.serviceNodeName == "node2"

    - name: Add service graph 1 to Contract1 again (check_mode)
      cisco.mso.mso_schema_template_contract_service_graph:
        <<: *mso_info
        schema: "{{ mso_test.schema }}"
        template: "{{ mso_test.template }}"
        contract: "{{ mso_test.contract.one }}"
        service_graph: "{{ mso_test.service_graph.one.name }}"
        service_nodes:
          - consumer: "{{ mso_test.bd.one }}"
            provider: "{{ mso_test.bd.two }}"
          - consumer: "{{ mso_test.bd.one }}"
            provider: "{{ mso_test.bd.two }}"
        state: present
      check_mode: true
      register: cm_add_sg1_to_c1_again

    - name: Add service graph 1 to Contract1 again
      cisco.mso.mso_schema_template_contract_service_graph:
        <<: *mso_info
        schema: "{{ mso_test.schema }}"
        template: "{{ mso_test.template }}"
        contract: "{{ mso_test.contract.one }}"
        service_graph: "{{ mso_test.service_graph.one.name }}"
        service_nodes:
          - consumer: "{{ mso_test.bd.one }}"
            provider: "{{ mso_test.bd.two }}"
          - consumer: "{{ mso_test.bd.one }}"
            provider: "{{ mso_test.bd.two }}"
        state: present
      register: nm_add_sg1_to_c1_again

    - name: Verify service graph 1 is added to Contract1 again
      ansible.builtin.assert:
        that:
        - cm_add_sg1_to_c1_again is not changed
        - cm_add_sg1_to_c1_again.previous.serviceGraphRef.serviceGraphName == mso_test.service_graph.one.name
        - cm_add_sg1_to_c1_again.previous.serviceGraphRef.templateName == mso_test.template_api
        - cm_add_sg1_to_c1_again.previous.serviceNodesRelationship.0.consumerConnector.bdRef.bdName == mso_test.bd.one
        - cm_add_sg1_to_c1_again.previous.serviceNodesRelationship.0.consumerConnector.connectorType == "general"
        - cm_add_sg1_to_c1_again.previous.serviceNodesRelationship.0.providerConnector.bdRef.bdName == mso_test.bd.two
        - cm_add_sg1_to_c1_again.previous.serviceNodesRelationship.0.providerConnector.connectorType == "general"
        - cm_add_sg1_to_c1_again.previous.serviceNodesRelationship.0.serviceNodeRef.serviceGraphName == mso_test.service_graph.one.name
        - cm_add_sg1_to_c1_again.previous.serviceNodesRelationship.0.serviceNodeRef.serviceNodeName == "node1"
        - cm_add_sg1_to_c1_again.previous.serviceNodesRelationship.1.serviceNodeRef.serviceNodeName == "node2"
        - nm_add_sg1_to_c1_again is not changed
        - nm_add_sg1_to_c1_again.previous.serviceGraphRef.serviceGraphName == mso_test.service_graph.one.name
        - nm_add_sg1_to_c1_again.previous.serviceGraphRef.templateName == mso_test.template_api
        - nm_add_sg1_to_c1_again.previous.serviceNodesRelationship.0.consumerConnector.bdRef.bdName == mso_test.bd.one
        - nm_add_sg1_to_c1_again.previous.serviceNodesRelationship.0.consumerConnector.connectorType == "general"
        - nm_add_sg1_to_c1_again.previous.serviceNodesRelationship.0.providerConnector.bdRef.bdName == mso_test.bd.two
        - nm_add_sg1_to_c1_again.previous.serviceNodesRelationship.0.providerConnector.connectorType == "general"
        - nm_add_sg1_to_c1_again.previous.serviceNodesRelationship.0.serviceNodeRef.serviceGraphName == mso_test.service_graph.one.name
        - nm_add_sg1_to_c1_again.previous.serviceNodesRelationship.0.serviceNodeRef.serviceNodeName == "node1"
        - nm_add_sg1_to_c1_again.previous.serviceNodesRelationship.1.serviceNodeRef.serviceNodeName == "node2"

    - name: Change service graph 1 node to Contract1 (check_mode)
      cisco.mso.mso_schema_template_contract_service_graph:
        <<: *mso_info
        schema: "{{ mso_test.schema }}"
        template: "{{ mso_test.template }}"
        contract: "{{ mso_test.contract.one }}"
        service_graph: "{{ mso_test.service_graph.one.name }}"
        service_nodes:
          - consumer: "{{ mso_test.bd.two }}"
            provider: "{{ mso_test.bd.one }}"
          - consumer: "{{ mso_test.bd.two }}"
            provider: "{{ mso_test.bd.one }}"
        state: present
      check_mode: true
      register: cm_change_sg1_to_c1

    - name: Change service graph 1 node to Contract1
      cisco.mso.mso_schema_template_contract_service_graph:
        <<: *mso_info
        schema: "{{ mso_test.schema }}"
        template: "{{ mso_test.template }}"
        contract: "{{ mso_test.contract.one }}"
        service_graph: "{{ mso_test.service_graph.one.name }}"
        service_nodes:
          - consumer: "{{ mso_test.bd.two }}"
            provider: "{{ mso_test.bd.one }}"
          - consumer: "{{ mso_test.bd.two }}"
            provider: "{{ mso_test.bd.one }}"
        state: present
      register: nm_change_sg1_to_c1

    - name: Verify service graph 1 is added to Contract1 again
      ansible.builtin.assert:
        that:
        - cm_change_sg1_to_c1 is changed
        - cm_change_sg1_to_c1.current.serviceNodesRelationship.0.consumerConnector.bdRef.bdName == mso_test.bd.two
        - cm_change_sg1_to_c1.current.serviceNodesRelationship.0.consumerConnector.connectorType == "general"
        - cm_change_sg1_to_c1.current.serviceNodesRelationship.0.providerConnector.bdRef.bdName == mso_test.bd.one
        - cm_change_sg1_to_c1.current.serviceNodesRelationship.0.providerConnector.connectorType == "general"
        - cm_change_sg1_to_c1.previous.serviceNodesRelationship.0.consumerConnector.bdRef.bdName == mso_test.bd.one
        - cm_change_sg1_to_c1.previous.serviceNodesRelationship.0.consumerConnector.connectorType == "general"
        - cm_change_sg1_to_c1.previous.serviceNodesRelationship.0.providerConnector.bdRef.bdName == mso_test.bd.two
        - cm_change_sg1_to_c1.previous.serviceNodesRelationship.0.providerConnector.connectorType == "general"
        - cm_change_sg1_to_c1 is changed
        - nm_change_sg1_to_c1.current.serviceNodesRelationship.0.consumerConnector.bdRef.bdName == mso_test.bd.two
        - nm_change_sg1_to_c1.current.serviceNodesRelationship.0.consumerConnector.connectorType == "general"
        - nm_change_sg1_to_c1.current.serviceNodesRelationship.0.providerConnector.bdRef.bdName == mso_test.bd.one
        - nm_change_sg1_to_c1.current.serviceNodesRelationship.0.providerConnector.connectorType == "general"
        - nm_change_sg1_to_c1.previous.serviceNodesRelationship.0.consumerConnector.bdRef.bdName == mso_test.bd.one
        - nm_change_sg1_to_c1.previous.serviceNodesRelationship.0.consumerConnector.connectorType == "general"
        - nm_change_sg1_to_c1.previous.serviceNodesRelationship.0.providerConnector.bdRef.bdName == mso_test.bd.two
        - nm_change_sg1_to_c1.previous.serviceNodesRelationship.0.providerConnector.connectorType == "general"

    - name: Query service graph 1 to Contract1 (check_mode)
      cisco.mso.mso_schema_template_contract_service_graph:
        <<: *mso_info
        schema: "{{ mso_test.schema }}"
        template: "{{ mso_test.template }}"
        contract: "{{ mso_test.contract.one }}"
        service_graph: "{{ mso_test.service_graph.one.name }}"
        state: query
      register: cm_query_sg1_to_c1

    - name: Query service graph 1 to Contract1
      cisco.mso.mso_schema_template_contract_service_graph:
        <<: *mso_info
        schema: "{{ mso_test.schema }}"
        template: "{{ mso_test.template }}"
        contract: "{{ mso_test.contract.one }}"
        service_graph: "{{ mso_test.service_graph.one.name }}"
        state: query
      register: nm_query_sg1_to_c1

    - name: Verify queried service graph 1
      ansible.builtin.assert:
        that:
        - cm_query_sg1_to_c1 is not changed
        - cm_query_sg1_to_c1.current.serviceNodesRelationship.0.consumerConnector.bdRef.bdName == mso_test.bd.two
        - cm_query_sg1_to_c1.current.serviceNodesRelationship.0.consumerConnector.bdRef.templateName == mso_test.template_api
        - cm_query_sg1_to_c1.current.serviceNodesRelationship.0.consumerConnector.connectorType == "general"
        - cm_query_sg1_to_c1.current.serviceNodesRelationship.0.providerConnector.bdRef.bdName == mso_test.bd.one
        - cm_query_sg1_to_c1.current.serviceNodesRelationship.0.consumerConnector.bdRef.templateName == mso_test.template_api
        - cm_query_sg1_to_c1.current.serviceNodesRelationship.0.providerConnector.connectorType == "general"
        - cm_query_sg1_to_c1 is not changed
        - nm_query_sg1_to_c1.current.serviceNodesRelationship.0.consumerConnector.bdRef.bdName == mso_test.bd.two
        - cm_query_sg1_to_c1.current.serviceNodesRelationship.0.consumerConnector.bdRef.templateName == mso_test.template_api
        - nm_query_sg1_to_c1.current.serviceNodesRelationship.0.consumerConnector.connectorType == "general"
        - nm_query_sg1_to_c1.current.serviceNodesRelationship.0.providerConnector.bdRef.bdName == mso_test.bd.one
        - cm_query_sg1_to_c1.current.serviceNodesRelationship.0.consumerConnector.bdRef.templateName == mso_test.template_api
        - nm_query_sg1_to_c1.current.serviceNodesRelationship.0.providerConnector.connectorType == "general"

    - name: Remove service graph 1 from Contract1 (check_mode)
      cisco.mso.mso_schema_template_contract_service_graph:
        <<: *mso_info
        schema: "{{ mso_test.schema }}"
        template: "{{ mso_test.template }}"
        contract: "{{ mso_test.contract.one }}"
        service_graph: "{{ mso_test.service_graph.one.name }}"
        state: absent
      check_mode: true
      register: cm_remove_sg1_from_c1

    - name: Remove service graph 1 from Contract1
