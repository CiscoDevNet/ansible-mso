- name: Test that we have an ACI MultiSite host, username and password
  ansible.builtin.fail:
    msg: "Please define the following variables: mso_hostname, mso_username and mso_password."
  when: mso_hostname is not defined or mso_username is not defined or mso_password is not defined

- name: Set test connection and fixture variables
  ansible.builtin.set_fact:
    mso_info: &mso_info
      host: "{{ mso_hostname }}"
      username: "{{ mso_username }}"
      password: "{{ mso_password }}"
      validate_certs: "{{ mso_validate_certs | default(false) }}"
      use_ssl: "{{ mso_use_ssl | default(true) }}"
      use_proxy: "{{ mso_use_proxy | default(false) }}"
      output_level: '{{ mso_output_level | default("debug") }}'
    aci_info: &aci_info
      host: "{{ apic_hostname }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: "{{ apic_validate_certs | default(false) }}"
      use_ssl: "{{ apic_use_ssl | default(true) }}"
      use_proxy: "{{ apic_use_proxy | default(true) }}"
      output_level: '{{ mso_output_level | default("debug") }}'
    mso_test:
      schema: '{{ mso_schema_site_contract_service_graph | default(mso_schema | default("ansible_test")) }}'
      tenant: '{{ mso_tenant_site_contract_service_graph | default(mso_tenant | default("ansible_test")) }}'
      site: '{{ mso_site_site_contract_service_graph | default(mso_site | default("ansible_test")) }}'
      template_1: 'ansible_template1'
      template_2: 'ansible_template2'
      anp_1: 'AP1'
      epg_1: 'EPG1'
      bd_1: 'BD1'
      bd_2: 'BD2'
      vrf_1: 'VRF1'
      vrf_2: 'VRF2'
      contract_1: 'Contract1'
      contract_2: 'Contract2'
      contract_3: 'Contract3'
      contract_4: 'Contract4'
      filter_1: 'Filter1'
      filter_2: 'Filter2'
      filter_entry_1: 'Filter1Entry'
      filter_entry_2: 'Filter2Entry'
      service_node_1: 'node1'
      service_node_3: 'node3'
      service_graph: 'ansible_service_graph'
      firewall_device: 'ansible_tenant_firewall1'
      adc_device: 'ansible_tenant_adc'
      other_device: 'ansible_tenant_other'
      redirect_policy_1: 'redirect_policy1'
      redirect_policy_2: 'redirect_policy2'
      cluster_interface_1: 'clu_if1'
      cluster_interface_2: 'clu_if3'
      cluster_interface_3: 'clu_if4'
      concrete_interface_1: 'cn_if1'
      concrete_interface_2: 'cn_if3'
      concrete_interface_3: 'cn_if4'

- name: Execute tasks
  block:
  # Setup part begins
    - name: Set ansible_network_os to cisco.aci.aci and ansible_connection to ansible.netcommon.httpapi
      ansible.builtin.set_fact:
        ansible_connection: ansible.netcommon.httpapi
        ansible_network_os: cisco.aci.aci

    - name: Reset the ansible_connection to access the APIC
      ansible.builtin.meta: reset_connection

    - name: Include tasks for L4-L7 devices
      ansible.builtin.include_tasks: l4_l7_devices.yml

    - name: Set ansible_network_os to cisco.nd.nd and ansible_connection to ansible.netcommon.httpapi
      ansible.builtin.set_fact:
        ansible_connection: ansible.netcommon.httpapi
        ansible_network_os: cisco.nd.nd

    - name: Reset the ansible_connection to access the MSO/NDO
      ansible.builtin.meta: reset_connection

    - name: Remove schemas
      cisco.mso.mso_schema:
        <<: *mso_info
        schema: '{{ item }}'
        state: absent
      loop:
      - '{{ mso_test.schema }}_2'
      - '{{ mso_test.schema }}'

    - name: Ensure ansible_schema with ansible_template1 and ansible_template2 exist
      cisco.mso.mso_schema_template:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        tenant: '{{ mso_test.tenant }}'
        template: "{{ item }}"
        state: present
      loop:
        - '{{ mso_test.template_1 }}'
        - '{{ mso_test.template_2 }}'

    - name: Create ansible_service_graph schema template service graph
      cisco.mso.mso_schema_template_service_graph:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        service_graph: '{{ mso_test.service_graph }}'
        display_name: '{{ mso_test.service_graph }}'
        service_nodes:
          - type: firewall
          - type: load-balancer
          - type: other
        filter_after_first_node: allow_all
        state: present

    - name: Bind ansible_test site with ansible_template1 and ansible_template2
      cisco.mso.mso_schema_site:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: "{{ item }}"
        site: '{{ mso_test.site }}'
        state: present
      loop:
        - '{{ mso_test.template_1 }}'
        - '{{ mso_test.template_2 }}'

    - name: Configure the site service graph ansible_service_graph
      cisco.mso.mso_schema_site_service_graph:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        service_graph: '{{ mso_test.service_graph }}'
        site: '{{ mso_test.site }}'
        tenant: '{{ mso_test.tenant }}'
        devices:
          - name: 'ansible_tenant_firewall1'
          - name: 'ansible_tenant_adc'
          - name: 'ansible_tenant_other'
        state: present

    - name: Add Filter1 to ansible_template1
      cisco.mso.mso_schema_template_filter_entry: &filter_present
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        filter: '{{ mso_test.filter_1 }}'
        entry: '{{ mso_test.filter_entry_1 }}'
        ethertype: ip
        state: present

    - name: Add Filter2 to ansible_template1
      cisco.mso.mso_schema_template_filter_entry:
        <<: *filter_present
        filter: '{{ mso_test.filter_2 }}'
        entry: '{{ mso_test.filter_entry_2 }}'
        state: present

    - name: Add Contracts to the ansible_template1
      cisco.mso.mso_schema_template_contract_filter:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        contract: "{{ item }}"
        filter: '{{ mso_test.filter_1 }}'
        state: present
      loop:
        - '{{ mso_test.contract_1 }}'
        - '{{ mso_test.contract_2 }}'
        - '{{ mso_test.contract_3 }}'

    - name: Add a VRF1 to ansible_template1
      cisco.mso.mso_schema_template_vrf:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        vrf: '{{ mso_test.vrf_1 }}'
        state: present

    - name: Add a VRF2 to ansible_template1
      cisco.mso.mso_schema_template_vrf:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        vrf: '{{ mso_test.vrf_2 }}'
        state: present

    - name: Add BD1 to ansible_template1
      cisco.mso.mso_schema_template_bd:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        bd: '{{ mso_test.bd_1 }}'
        vrf:
          name: '{{ mso_test.vrf_1 }}'
        state: present

    - name: Add BD2 to ansible_template1
      cisco.mso.mso_schema_template_bd:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        bd: '{{ mso_test.bd_2 }}'
        vrf:
          name: '{{ mso_test.vrf_2 }}'
        state: present

    - name: Add AP1 to ansible_template1
      cisco.mso.mso_schema_template_anp:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        anp: '{{ mso_test.anp_1 }}'
        state: present

    - name: Add EPG1 to AP1 in ansible_template1
      cisco.mso.mso_schema_template_anp_epg:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        anp: '{{ mso_test.anp_1 }}'
        epg: '{{ mso_test.epg_1 }}'
        bd:
          name: '{{ mso_test.bd_1 }}'
        vrf:
          name: '{{ mso_test.vrf_1 }}'
        state: present

    - name: Bind Contract1 and 2 with EPG1 provider
      cisco.mso.mso_schema_template_anp_epg_contract:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        anp: '{{ mso_test.anp_1 }}'
        epg: '{{ mso_test.epg_1 }}'
        contract:
          name: "{{ item }}"
          type: provider
        state: present
      loop:
        - '{{ mso_test.contract_1 }}'
        - '{{ mso_test.contract_2 }}'

    - name: Bind Contract1 with EPG1 consumer
      cisco.mso.mso_schema_template_anp_epg_contract:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        anp: '{{ mso_test.anp_1 }}'
        epg: '{{ mso_test.epg_1 }}'
        contract:
          name: "{{  item }}"
          type: consumer
        state: present
      loop:
        - '{{ mso_test.contract_1 }}'
        - '{{ mso_test.contract_2 }}'

    - name: Bind Contract1 and 2 with template service graph - ansible_service_graph
      cisco.mso.mso_schema_template_contract_service_graph:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        contract: "{{ item }}"
        service_graph: '{{ mso_test.service_graph }}'
        service_nodes:
          - provider: '{{ mso_test.bd_1 }}'
            consumer: '{{ mso_test.bd_2 }}'
          - provider: '{{ mso_test.bd_1 }}'
            consumer: '{{ mso_test.bd_2 }}'
          - provider: '{{ mso_test.bd_1 }}'
            consumer: '{{ mso_test.bd_2 }}'
        state: present
      loop:
        - '{{ mso_test.contract_1 }}'
        - '{{ mso_test.contract_2 }}'

    - name: Bind the Contract1 with site service graph - ansible_service_graph - check_mode
      cisco.mso.mso_schema_site_contract_service_graph: &add_site_con_sg_cm
        <<: *mso_info
        tenant: '{{ mso_test.tenant }}'
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        site: '{{ mso_test.site }}'
        contract: '{{ mso_test.contract_1 }}'
        service_graph_schema: '{{ mso_test.schema }}'
        service_graph_template: '{{ mso_test.template_1 }}'
        service_graph: '{{ mso_test.service_graph }}'
        node_relationship:
          - cluster_interface_device: '{{ mso_test.firewall_device }}'
            provider_connector_cluster_interface: '{{ mso_test.cluster_interface_1 }}'
            provider_connector_redirect_policy: '{{ mso_test.redirect_policy_1 }}'
            consumer_connector_cluster_interface: '{{ mso_test.cluster_interface_1 }}'
            consumer_connector_redirect_policy: '{{ mso_test.redirect_policy_1 }}'
          - cluster_interface_device: '{{ mso_test.adc_device }}'
            provider_connector_cluster_interface: '{{ mso_test.cluster_interface_2 }}'
            provider_connector_redirect_policy: '{{ mso_test.redirect_policy_1 }}'
            consumer_connector_cluster_interface: '{{ mso_test.cluster_interface_2 }}'
            consumer_connector_redirect_policy: '{{ mso_test.redirect_policy_1 }}'
            consumer_subnet_ips: ["1.1.1.1/24", "4.4.4.4/24"]
          - cluster_interface_device: '{{ mso_test.other_device }}'
            provider_connector_cluster_interface: '{{ mso_test.cluster_interface_3 }}'
            provider_connector_redirect_policy: '{{ mso_test.redirect_policy_1 }}'
            consumer_connector_cluster_interface: '{{ mso_test.cluster_interface_3 }}'
            consumer_connector_redirect_policy: '{{ mso_test.redirect_policy_1 }}'
        state: present
        output_level: debug
      check_mode: true
      register: add_sg_cm

    - name: Bind the Contract1 with site service graph - ansible_service_graph - normal_mode
      cisco.mso.mso_schema_site_contract_service_graph:
        <<: *add_site_con_sg_cm
        contract: '{{ mso_test.contract_1 }}'
      register: add_sg_nm

    - name: Bind the Contract2 with site service graph - ansible_service_graph - normal_mode
      cisco.mso.mso_schema_site_contract_service_graph:
        <<: *add_site_con_sg_cm
        contract: '{{ mso_test.contract_2 }}'
      register: add_sg_nm_c2

    - name: Bind the Contract1 with site service graph - ansible_service_graph - normal_mode - again
      cisco.mso.mso_schema_site_contract_service_graph:
        <<: *add_site_con_sg_cm
        contract: '{{ mso_test.contract_1 }}'
      register: add_sg_nm_again

    - name: Set assert variables for cluster interface and redirect policy DNs
      ansible.builtin.set_fact:
        mso_tenant_cluster_interface_dn: 'uni/tn-{{ mso_test.tenant }}/lDevVip-{{ mso_test.other_device }}/lIf-{{ mso_test.cluster_interface_3 }}'
        mso_tenant_cluster_interface_dn_fw: 'uni/tn-{{ mso_test.tenant }}/lDevVip-{{ mso_test.firewall_device }}/lIf-{{ mso_test.cluster_interface_1 }}'
        mso_tenant_redirect_policy_1: 'uni/tn-{{ mso_test.tenant }}/svcCont/svcRedirectPol-{{ mso_test.redirect_policy_1 }}'

    - name: Assertions check for the bind site contract service graph
      ansible.builtin.assert:
        that:
          - add_sg_cm is changed
          - add_sg_cm.current != {}
          - add_sg_cm.previous == {}
          - add_sg_cm.current.serviceNodesRelationship.0.serviceNodeRef.serviceGraphName == "{{ mso_test.service_graph }}"
          - add_sg_cm.current.serviceNodesRelationship.0.serviceNodeRef.serviceNodeName == "{{ mso_test.service_node_1 }}"
          - add_sg_cm.current.serviceNodesRelationship.0.serviceNodeRef.templateName == "{{ mso_test.template_1 }}"
          - add_sg_cm.current.serviceGraphRef.serviceGraphName == "{{ mso_test.service_graph }}"
          - add_sg_cm.current.serviceGraphRef.templateName == "{{ mso_test.template_1 }}"
          - add_sg_cm.current.serviceNodesRelationship.1.consumerConnector.subnets | length == 2
          - add_sg_cm.current.serviceNodesRelationship.1.consumerConnector.subnets.0.ip == "1.1.1.1/24"
          - add_sg_cm.current.serviceNodesRelationship.1.consumerConnector.subnets.1.ip == "4.4.4.4/24"
          - add_sg_cm.current.serviceNodesRelationship.2.consumerConnector.clusterInterface.dn == mso_tenant_cluster_interface_dn
          - add_sg_cm.current.serviceNodesRelationship.2.consumerConnector.redirectPolicy.dn == mso_tenant_redirect_policy_1
          - add_sg_cm.current.serviceNodesRelationship.2.providerConnector.clusterInterface.dn == mso_tenant_cluster_interface_dn
          - add_sg_cm.current.serviceNodesRelationship.2.providerConnector.redirectPolicy.dn == mso_tenant_redirect_policy_1
          - add_sg_cm.proposed.serviceNodesRelationship.0.serviceNodeRef.serviceGraphName == "{{ mso_test.service_graph }}"
          - add_sg_cm.proposed.serviceNodesRelationship.0.serviceNodeRef.serviceNodeName == "{{ mso_test.service_node_1 }}"
          - add_sg_cm.proposed.serviceNodesRelationship.0.serviceNodeRef.templateName == "{{ mso_test.template_1 }}"
          - add_sg_cm.proposed.serviceGraphRef.serviceGraphName == "{{ mso_test.service_graph }}"
          - add_sg_cm.proposed.serviceGraphRef.templateName == "{{ mso_test.template_1 }}"
          - add_sg_cm.proposed.serviceNodesRelationship.1.consumerConnector.subnets | length == 2
          - add_sg_cm.proposed.serviceNodesRelationship.1.consumerConnector.subnets.0.ip == "1.1.1.1/24"
          - add_sg_cm.proposed.serviceNodesRelationship.1.consumerConnector.subnets.1.ip == "4.4.4.4/24"
          - add_sg_cm.proposed.serviceNodesRelationship.2.consumerConnector.clusterInterface.dn == mso_tenant_cluster_interface_dn
          - add_sg_cm.proposed.serviceNodesRelationship.2.consumerConnector.redirectPolicy.dn == mso_tenant_redirect_policy_1
          - add_sg_cm.proposed.serviceNodesRelationship.2.providerConnector.clusterInterface.dn == mso_tenant_cluster_interface_dn
          - add_sg_cm.proposed.serviceNodesRelationship.2.providerConnector.redirectPolicy.dn == mso_tenant_redirect_policy_1
          - add_sg_nm is changed
          - add_sg_nm.current != {}
          - add_sg_nm.current.serviceGraphRef.serviceGraphName == "{{ mso_test.service_graph }}"
          - add_sg_nm.current.serviceGraphRef.templateName == "{{ mso_test.template_1 }}"
          - add_sg_nm.current.serviceNodesRelationship.1.consumerConnector.subnets | length == 2
          - add_sg_nm.current.serviceNodesRelationship.1.consumerConnector.subnets.0.ip == "1.1.1.1/24"
          - add_sg_nm.current.serviceNodesRelationship.1.consumerConnector.subnets.1.ip == "4.4.4.4/24"
          - add_sg_nm.current.serviceNodesRelationship.2.consumerConnector.clusterInterface.dn == mso_tenant_cluster_interface_dn
          - add_sg_nm.current.serviceNodesRelationship.2.consumerConnector.redirectPolicy.dn == mso_tenant_redirect_policy_1
          - add_sg_nm.current.serviceNodesRelationship.2.providerConnector.clusterInterface.dn == mso_tenant_cluster_interface_dn
          - add_sg_nm.current.serviceNodesRelationship.2.providerConnector.redirectPolicy.dn == mso_tenant_redirect_policy_1
          - add_sg_nm.previous == {}
          - add_sg_nm_again is not changed
          - add_sg_nm_again.current != {}
          - add_sg_nm_again.previous != {}
          - add_sg_nm_again.previous.serviceNodesRelationship.1.consumerConnector.subnets | length == 2
          - add_sg_nm_again.previous.serviceNodesRelationship.1.consumerConnector.subnets.0.ip == "1.1.1.1/24"
          - add_sg_nm_again.previous.serviceNodesRelationship.1.consumerConnector.subnets.1.ip == "4.4.4.4/24"
          - add_sg_nm_again.current.serviceGraphRef.serviceGraphName == "{{ mso_test.service_graph }}"
          - add_sg_nm_again.current.serviceGraphRef.templateName == "{{ mso_test.template_1 }}"
          - add_sg_nm_again.current.serviceNodesRelationship.1.consumerConnector.subnets | length == 2

    - name: Update the Contract1 - site service graph - ansible_service_graph - node properties - check_mode
      cisco.mso.mso_schema_site_contract_service_graph: &update_site_con_sg_cm
        <<: *mso_info
        tenant: '{{ mso_test.tenant }}'
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        site: '{{ mso_test.site }}'
        contract: '{{ mso_test.contract_1 }}'
        service_graph_schema: '{{ mso_test.schema }}'
        service_graph_template: '{{ mso_test.template_1 }}'
        service_graph: '{{ mso_test.service_graph }}'
        node_relationship:
          - cluster_interface_device: '{{ mso_test.firewall_device }}'
            provider_connector_cluster_interface: '{{ mso_test.cluster_interface_1 }}'
            provider_connector_redirect_policy: '{{ mso_test.redirect_policy_1 }}'
            consumer_connector_cluster_interface: '{{ mso_test.cluster_interface_1 }}'
            consumer_connector_redirect_policy: '{{ mso_test.redirect_policy_1 }}'
          - cluster_interface_device: '{{ mso_test.adc_device }}'
            provider_connector_cluster_interface: '{{ mso_test.cluster_interface_2 }}'
            provider_connector_redirect_policy: '{{ mso_test.redirect_policy_1 }}'
            consumer_connector_cluster_interface: '{{ mso_test.cluster_interface_2 }}'
            consumer_connector_redirect_policy: '{{ mso_test.redirect_policy_1 }}'
            consumer_subnet_ips: ["1.1.1.1/24", "4.4.4.3/24"]
          - cluster_interface_device: '{{ mso_test.other_device }}'
            provider_connector_cluster_interface: '{{ mso_test.cluster_interface_3 }}'
            provider_connector_redirect_policy_tenant: common
            provider_connector_redirect_policy: '{{ mso_test.redirect_policy_2 }}'
            consumer_connector_cluster_interface: '{{ mso_test.cluster_interface_3 }}'
            consumer_connector_redirect_policy_tenant: common
            consumer_connector_redirect_policy: '{{ mso_test.redirect_policy_2 }}'
        state: present
        output_level: debug
      check_mode: true
      register: update_sg_cm

    - name: Update the Contract1 - site service graph - ansible_service_graph - node properties - normal_mode
      cisco.mso.mso_schema_site_contract_service_graph:
        <<: *update_site_con_sg_cm
      register: update_sg_nm

    - name: Update the Contract1 - site service graph - ansible_service_graph - node properties - normal_mode again
      cisco.mso.mso_schema_site_contract_service_graph:
        <<: *update_site_con_sg_cm
      register: update_sg_nm_again

    - name: Assertions check for the update site contract service graph
      ansible.builtin.assert:
        that:
          - update_sg_cm is changed
          - update_sg_cm.current != {}
          - update_sg_cm.previous != {}
          - update_sg_cm.current.serviceGraphRef.serviceGraphName == "{{ mso_test.service_graph }}"
          - update_sg_cm.current.serviceGraphRef.templateName ==  "{{ mso_test.template_1 }}"
          - update_sg_cm.current.serviceNodesRelationship.1.consumerConnector.subnets | length == 2
          - update_sg_cm.current.serviceNodesRelationship.1.consumerConnector.subnets.0.ip == "1.1.1.1/24"
          - update_sg_cm.current.serviceNodesRelationship.1.consumerConnector.subnets.1.ip == "4.4.4.3/24"
          - update_sg_cm.previous.serviceNodesRelationship.1.consumerConnector.subnets | length == 2
          - update_sg_cm.previous.serviceNodesRelationship.1.consumerConnector.subnets.0.ip == "1.1.1.1/24"
          - update_sg_cm.previous.serviceNodesRelationship.1.consumerConnector.subnets.1.ip == "4.4.4.4/24"
          - update_sg_cm.proposed.serviceNodesRelationship.1.consumerConnector.subnets | length == 2
          - update_sg_cm.proposed.serviceNodesRelationship.1.consumerConnector.subnets.0.ip == "1.1.1.1/24"
          - update_sg_cm.proposed.serviceNodesRelationship.1.consumerConnector.subnets.1.ip == "4.4.4.3/24"
          - update_sg_cm.current.serviceNodesRelationship.2.consumerConnector.clusterInterface.dn == mso_tenant_cluster_interface_dn
          - update_sg_cm.current.serviceNodesRelationship.2.consumerConnector.redirectPolicy.dn == "uni/tn-common/svcCont/svcRedirectPol-{{ mso_test.redirect_policy_2 }}"
          - update_sg_cm.current.serviceNodesRelationship.2.providerConnector.clusterInterface.dn == mso_tenant_cluster_interface_dn
          - update_sg_cm.current.serviceNodesRelationship.2.providerConnector.redirectPolicy.dn == "uni/tn-common/svcCont/svcRedirectPol-{{ mso_test.redirect_policy_2 }}"
          - update_sg_cm.proposed.serviceNodesRelationship.2.consumerConnector.clusterInterface.dn == mso_tenant_cluster_interface_dn
          - update_sg_cm.proposed.serviceNodesRelationship.2.consumerConnector.redirectPolicy.dn == "uni/tn-common/svcCont/svcRedirectPol-{{ mso_test.redirect_policy_2 }}"
          - update_sg_cm.proposed.serviceNodesRelationship.2.providerConnector.clusterInterface.dn == mso_tenant_cluster_interface_dn
          - update_sg_cm.proposed.serviceNodesRelationship.2.providerConnector.redirectPolicy.dn == "uni/tn-common/svcCont/svcRedirectPol-{{ mso_test.redirect_policy_2 }}"
