- name: Test that we have an ACI MultiSite host, username and password
  ansible.builtin.fail:
    msg: "Please define the following variables: mso_hostname, mso_username and mso_password."
  when: mso_hostname is not defined or mso_username is not defined or mso_password is not defined

# CLEAN ENVIRONMENT
- name: Set vars
  ansible.builtin.set_fact:
    aci_info: &aci_info
      host: "{{ apic_hostname }}"
      username: "{{ apic_username }}"
      password: "{{ apic_password }}"
      validate_certs: "{{ apic_validate_certs | default(false) }}"
      use_ssl: "{{ apic_use_ssl | default(true) }}"
      use_proxy: "{{ apic_use_proxy | default(true) }}"
      output_level: '{{ mso_output_level | default("debug") }}'

- name: Query system information
  cisco.aci.aci_system:
    <<: *aci_info
    id: 1
    state: query
  register: aci_version

- name: Remove an existing tenant on APIC
  cisco.aci.aci_tenant:
    <<: *aci_info
    name: '{{ mso_test.tenant }}'
    state: absent

- name: Add a tenant on APIC
  cisco.aci.aci_tenant:
    <<: *aci_info
    name: '{{ mso_test.tenant }}'

- name: Remove the redirect_policy2 from the common tenant - setup part
  cisco.aci.aci_rest:
    <<: *aci_info
    path: "/api/node/mo/uni/tn-common/svcCont.json"
    method: post
    content:
      vnsSvcRedirectPol:
        attributes:
          name: '{{ mso_test.redirect_policy_2 }}'
          status: deleted

- name: Remove ansible_tenant from the APIC - setup part
  cisco.aci.aci_tenant:
    <<: *aci_info
    tenant: '{{ mso_test.tenant }}'
    state: absent

- name: Add ansible_tenant to the APIC
  cisco.aci.aci_tenant:
    <<: *aci_info
    tenant: '{{ mso_test.tenant }}'
    state: present

- name: Add devices and cluster interfaces to the ansible_tenant
  cisco.aci.aci_rest:
    <<: *aci_info
    path: "/api/node/mo/uni/tn-{{ item.tenant }}.json"
    method: post
    content:
      vnsLDevVip:
        attributes:
          svcType: "{{ item.type }}"
          managed: "false"
          name: "{{ item.name }}"
        children:
          - vnsCDev:
              attributes:
                name: "{{ item.name }}"
              children:
                - vnsCIf:
                    attributes:
                      name: "{{ item.concrete_interface }}"
                    children:
                      - vnsRsCIfPathAtt:
                          attributes:
                            tDn: "topology/pod-1/paths-101/pathep-[eth1/1]"
          - vnsLIf:
              attributes:
                name: "{{ item.cluster_interface }}"
              children:
                - vnsRsCIfAttN:
                    attributes:
                      tDn: "uni/tn-{{ item.tenant }}/lDevVip-{{ item.name }}/cDev-{{ item.name }}/cIf-[{{ item.concrete_interface }}]"
          - vnsLIf:
              attributes:
                name: "{{ item.cluster_interface }}_2"
              children:
                - vnsRsCIfAttN:
                    attributes:
                      tDn: "uni/tn-{{ item.tenant }}/lDevVip-{{ item.name }}/cDev-{{ item.name }}/cIf-[{{ item.concrete_interface }}]"

  loop:
    - {
        tenant: '{{ mso_test.tenant }}',
        type: FW,
        name: '{{ mso_test.firewall_device }}',
        cluster_interface: '{{ mso_test.cluster_interface_1 }}',
        concrete_interface: '{{ mso_test.concrete_interface_1 }}',
      }
    - {
        tenant: '{{ mso_test.tenant }}',
        type: ADC,
        name: '{{ mso_test.adc_device }}',
        cluster_interface: '{{ mso_test.cluster_interface_2 }}',
        concrete_interface: '{{ mso_test.concrete_interface_2 }}',
      }
    - {
        tenant: '{{ mso_test.tenant }}',
        type: OTHERS,
        name: '{{ mso_test.other_device }}',
        cluster_interface: '{{ mso_test.cluster_interface_3 }}',
        concrete_interface: '{{ mso_test.concrete_interface_3 }}',
      }

- name: Add redirect policies to the common and ansible_tenant tenants
  cisco.aci.aci_rest:
    <<: *aci_info
    path: "/api/node/mo/uni/tn-{{ item.tenant }}/svcCont.json"
    method: post
    content:
      vnsSvcRedirectPol:
        attributes:
          name: "{{ item.name }}"
  loop:
    - {
        tenant: '{{ mso_test.tenant }}',
        name: '{{ mso_test.redirect_policy_1 }}',
      }
    - { tenant: common, name: '{{ mso_test.redirect_policy_2 }}' }
