  always:
    - name: Restore NDO connection for cleanup
      ansible.builtin.set_fact:
        ansible_connection: ansible.netcommon.httpapi
        ansible_network_os: cisco.nd.nd

    - name: Reset the connection to access NDO for cleanup
      ansible.builtin.meta: reset_connection

    - name: Remove the site association for the ansible_schema templates
      cisco.mso.mso_schema_site:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: "{{ item }}"
        site: '{{ mso_test.site }}'
        state: absent
      ignore_errors: true
      loop:
        - '{{ mso_test.template_1 }}'
        - '{{ mso_test.template_2 }}'

    - name: Remove test schemas even if the test fails
      cisco.mso.mso_schema:
        <<: *mso_info
        schema: '{{ item }}'
        state: absent
      loop:
        - '{{ mso_test.schema }}_2'
        - '{{ mso_test.schema }}'
      ignore_errors: true

    - name: Set ansible_network_os to cisco.aci.aci and ansible_connection to ansible.netcommon.httpapi
      ansible.builtin.set_fact:
        ansible_connection: ansible.netcommon.httpapi
        ansible_network_os: cisco.aci.aci

    - name: Reset the ansible_connection to access the APIC
      ansible.builtin.meta: reset_connection

    - name: Remove the common tenant redirect policy
      cisco.aci.aci_rest:
        host: "{{ apic_hostname }}"
        username: "{{ apic_username }}"
        password: "{{ apic_password }}"
        validate_certs: no
        path: "/api/node/mo/uni/tn-common/svcCont.json"
        method: post
        content:
          vnsSvcRedirectPol:
            attributes:
              name: '{{ mso_test.redirect_policy_2 }}'
              status: deleted
      delegate_to: localhost
      connection: local
      ignore_errors: true

    - name: Remove the {{ mso_test.tenant }} from the APIC
      cisco.aci.aci_tenant:
        <<: *aci_info
        tenant: '{{ mso_test.tenant }}'
        state: absent
      delegate_to: localhost
      connection: local
      ignore_errors: true

    - name: Restore NDO connection after cleanup
      ansible.builtin.set_fact:
        ansible_connection: ansible.netcommon.httpapi
        ansible_network_os: cisco.nd.nd

    - name: Reset the connection after cleanup
      ansible.builtin.meta: reset_connection
