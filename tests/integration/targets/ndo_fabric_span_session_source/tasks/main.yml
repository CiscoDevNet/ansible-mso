      register: nt_add_filter_epg_and_l3out
      ignore_errors: true

    - name: Negative test create SPAN Session source with filter_l3out and more than one access path
      cisco.mso.ndo_fabric_span_session_source:
        <<: *mso_info
        template: "{{ mso_test.monitoring_access_template }}"
        span_session_name: "{{ mso_test.span_session }}"
        name: "{{ mso_test.source_6 }}"
        direction: outgoing
        access_paths:
          - access_path_type: port
            node: 101
            interface: eth1/3
          - access_path_type: port_channel
            name: "{{ mso_test.port_channel_1 }}"
            template: "{{ mso_test.fabric_resource_template }}"
        filter_l3out:
          vlan_id: 13
          reference:
            name: "{{ mso_test.l3out }}"
            template: "{{ mso_test.l3out_template }}"
        state: present
      register: nt_l3out_with_multiple_access_paths
      ignore_errors: true

    # Expecting one port_channel access path in the response, as per the current behavior the task will not fail
    - name: Negative test add duplicate access paths
      cisco.mso.ndo_fabric_span_session_source:
        <<: *mso_info
        template: "{{ mso_test.monitoring_access_template }}"
        span_session_name: "{{ mso_test.span_session }}"
        name: "{{ mso_test.source_2 }}"
        direction: outgoing
        access_paths:
          - access_path_type: port
            node: 101
            interface: eth1/3
          - access_path_type: port_channel
            name: "{{ mso_test.port_channel_1 }}"
            template: "{{ mso_test.fabric_resource_template }}"
          - access_path_type: port_channel
            name: "{{ mso_test.port_channel_1 }}"
            template: "{{ mso_test.fabric_resource_template }}"
        state: present
      register: nt_duplicate_access_paths
      ignore_errors: true

    - name: Negative test add port access path with incomplete config
      cisco.mso.ndo_fabric_span_session_source:
        <<: *mso_info
        template: "{{ mso_test.monitoring_access_template }}"
        span_session_name: "{{ mso_test.span_session }}"
        name: "{{ mso_test.source_2 }}"
        direction: outgoing
        access_paths:
          - access_path_type: port
            interface: eth1/3
        state: present
      register: nt_incomplete_port
      ignore_errors: true

    - name: Negative test add port channel access path with incomplete config
      cisco.mso.ndo_fabric_span_session_source:
        <<: *mso_info
        template: "{{ mso_test.monitoring_access_template }}"
        span_session_name: "{{ mso_test.span_session }}"
        name: "{{ mso_test.source_2 }}"
        direction: outgoing
        access_paths:
          - access_path_type: port_channel
            name: "{{ mso_test.port_channel_1 }}"
        state: present
      register: nt_incomplete_pc
      ignore_errors: true

    - name: Negative test add virtual port channel access path with incomplete config
      cisco.mso.ndo_fabric_span_session_source:
        <<: *mso_info
        template: "{{ mso_test.monitoring_access_template }}"
        span_session_name: "{{ mso_test.span_session }}"
        name: "{{ mso_test.source_2 }}"
        direction: outgoing
        access_paths:
          - access_path_type: virtual_port_channel
            name: "{{ mso_test.vpc_1 }}"
        state: present
      register: nt_incomplete_vpc
      ignore_errors: true

    - name: Negative test add vpc_component_pc access path with incomplete config
      cisco.mso.ndo_fabric_span_session_source:
        <<: *mso_info
        template: "{{ mso_test.monitoring_access_template }}"
        span_session_name: "{{ mso_test.span_session }}"
        name: "{{ mso_test.source_2 }}"
        direction: outgoing
        access_paths:
          - access_path_type: vpc_component_pc
            uuid: vpc_uuid
        state: present
      register: nt_incomplete_vpc_pc
      ignore_errors: true

    - name: Negative test add filter l3out with incomplete config with only UUID
      cisco.mso.ndo_fabric_span_session_source:
        <<: *mso_info
        template: "{{ mso_test.monitoring_access_template }}"
        span_session_name: "{{ mso_test.span_session }}"
        name: "{{ mso_test.source_2 }}"
        direction: outgoing
        filter_l3out:
          uuid: l3out_uuid
        state: present
      register: nt_incomplete_l3out_1
      ignore_errors: true

    - name: Negative test add filter l3out with incomplete config with only l3out name
      cisco.mso.ndo_fabric_span_session_source:
        <<: *mso_info
        template: "{{ mso_test.monitoring_access_template }}"
        span_session_name: "{{ mso_test.span_session }}"
        name: "{{ mso_test.source_2 }}"
        direction: outgoing
        filter_l3out:
          reference:
            name: l3out
        state: present
      register: nt_incomplete_l3out_2
      ignore_errors: true

    - name: Negative test add filter l3out with incomplete config with only l3out name
      cisco.mso.ndo_fabric_span_session_source:
        <<: *mso_info
        template: "{{ mso_test.monitoring_access_template }}"
        span_session_name: "{{ mso_test.span_session }}"
        name: "{{ mso_test.source_2 }}"
        direction: outgoing
        filter_l3out:
          vlan_id: 10
          reference:
            name: l3out
        state: present
      register: nt_incomplete_l3out_3
      ignore_errors: true

    - name: Set error messages for SPAN Session sources with invalid and incomplete configuration
      ansible.builtin.set_fact:
        error_message_multiple_access_paths: "MSO Error 400:.+SPAN session {{ mso_test.span_session }}: source {{ mso_test.source_6 }}: only 1 Access Path must be present if an L3Out filter is selected.+"
        error_message_empty_pc_config: "Access path 1: when the access_path_type='port_channel', either 'uuid', or both 'name' and 'template', or both 'name' and 'template_id' must be provided."
        error_message_span_drop_packets: "MSO Error 400:.+SPAN session {{ mso_test.span_session }}: source {{ mso_test.source_2 }}: invalid access span source - source {{ mso_test.source_2 }} has Span Drop Packets enabled but also has EPG filter.+"
        error_message_incomplete_port: "Access path 1: when the access_path_type='port', either 'uuid' or both 'node' and 'interface' must be provided."
        error_message_incomplete_pc: "Access path 1: when the access_path_type='port_channel', either 'uuid', or both 'name' and 'template', or both 'name' and 'template_id' must be provided."
        error_message_incomplete_vpc: "Access path 1: when the access_path_type 'virtual_port_channel', either 'uuid', or both 'name' and 'template', or both 'name' and 'template_id' must be provided."
        error_message_incomplete_vpc_pc: "Access path 1: when the access_path_type 'vpc_component_pc', either both 'uuid' and 'node', or all of 'name', 'template', and 'node', or all of 'name', 'template_id', and 'node' must be provided."
        error_message_ansible_test_source_4_vpc_com_pc: "MSO Error 400: .+span: {{ mso_test.span_session }}, source {{ mso_test.source_4 }}: combination of access paths and L3Out is not correct, no common VLAN.+"
        error_message_incomplete_l3out_1: "missing parameter(s) required by 'uuid': vlan_id found in filter_l3out"
        error_message_incomplete_l3out_2: "missing parameter(s) required by 'reference': vlan_id found in filter_l3out"

    - name: Assertion check for negative test for the SPAN Session sources with invalid and incomplete configuration
      ansible.builtin.assert:
        that:
          - nt_l3out_with_multiple_access_paths is not changed
          - nt_l3out_with_multiple_access_paths.current == {}
          - nt_l3out_with_multiple_access_paths.msg is match(error_message_multiple_access_paths)
          - nt_l3out_with_multiple_access_paths.previous == {}
          - nt_access_path_with_invalid_config is not changed
          - 'nt_access_path_with_invalid_config.msg == "parameters are mutually exclusive: template|template_id found in access_paths"'
          - nt_access_path_with_invalid_pc_config is not changed
          - 'nt_access_path_with_invalid_pc_config.msg == "parameters are mutually exclusive: uuid|interface|name found in access_paths"'
          - nt_access_path_with_empty_pc_config is not changed
          - nt_access_path_with_empty_pc_config.current == {}
          - nt_access_path_with_empty_pc_config.msg == error_message_empty_pc_config
          - nt_epg_with_span_drop_packets is not changed
          - nt_epg_with_span_drop_packets.current.accessPaths.0.accessInterfaces.0.dn == "topology/pod-1/paths-101/pathep-[eth1/6]"
          - nt_epg_with_span_drop_packets.current.accessPaths.1.portChannels.0.portChannelName == mso_test.port_channel_1
          - nt_epg_with_span_drop_packets.current.accessPaths.2.virtualPortChannels.0.virtualPortChannelName == mso_test.vpc_1
          - nt_epg_with_span_drop_packets.current.accessPaths.3.vpcComponentPc.0.node == "101"
          - nt_epg_with_span_drop_packets.current.accessPaths.3.vpcComponentPc.0.vpcComponentPcName == mso_test.vpc_1
          - nt_epg_with_span_drop_packets.current.direction == "outgoing"
          - nt_epg_with_span_drop_packets.current.l3out == {}
          - nt_epg_with_span_drop_packets.current.name == mso_test.source_2
          - nt_epg_with_span_drop_packets.current.spanDropPackets == true
          - nt_epg_with_span_drop_packets.current.templateName == mso_test.monitoring_access_template
          - nt_epg_with_span_drop_packets.msg is match(error_message_span_drop_packets)
          - nt_epg_with_span_drop_packets.previous.accessPaths.0.accessInterfaces.0.dn == "topology/pod-1/paths-101/pathep-[eth1/6]"
          - nt_epg_with_span_drop_packets.previous.accessPaths.1.portChannels.0.portChannelName == mso_test.port_channel_1
          - nt_epg_with_span_drop_packets.previous.accessPaths.2.virtualPortChannels.0.virtualPortChannelName == mso_test.vpc_1
          - nt_epg_with_span_drop_packets.previous.accessPaths.3.vpcComponentPc.0.node == "101"
          - nt_epg_with_span_drop_packets.previous.accessPaths.3.vpcComponentPc.0.vpcComponentPcName == mso_test.vpc_1
          - nt_epg_with_span_drop_packets.previous.direction == "outgoing"
          - nt_epg_with_span_drop_packets.previous.l3out == {}
          - nt_epg_with_span_drop_packets.previous.name == mso_test.source_2
          - nt_epg_with_span_drop_packets.previous.spanDropPackets == true
          - nt_epg_with_span_drop_packets.previous.templateName == mso_test.monitoring_access_template
          - nt_add_filter_epg_and_l3out is not changed
          - 'nt_add_filter_epg_and_l3out.msg == "parameters are mutually exclusive: filter_epg|filter_l3out"'
          - nt_duplicate_access_paths is not changed
          - nt_duplicate_access_paths.msg is match("Remove duplicate entries from the access_paths.+")
          - nt_incomplete_port is not changed
          - nt_incomplete_port.current == {}
          - nt_incomplete_port.msg == error_message_incomplete_port
          - nt_incomplete_pc is not changed
          - nt_incomplete_pc.current == {}
          - nt_incomplete_pc.msg == error_message_incomplete_pc
          - nt_incomplete_vpc is not changed
          - nt_incomplete_vpc.current == {}
          - nt_incomplete_vpc.msg == error_message_incomplete_vpc
          - nt_incomplete_vpc_pc is not changed
          - nt_incomplete_vpc_pc.current == {}
          - nt_incomplete_vpc_pc.msg == error_message_incomplete_vpc_pc
          - nt_incomplete_l3out_1 is not changed
          - nt_incomplete_l3out_1.msg == error_message_incomplete_l3out_1
          - nt_incomplete_l3out_2 is not changed
          - nt_incomplete_l3out_2.msg == error_message_incomplete_l3out_2
          - nt_incomplete_l3out_3 is not changed
          - 'nt_incomplete_l3out_3.msg == "one of the following is required: tenant, template, template_id found in filter_l3out -> reference"'
          - nt_ansible_test_source_4_vpc_com_pc is not changed
          - nt_ansible_test_source_4_vpc_com_pc.msg is match(error_message_ansible_test_source_4_vpc_com_pc)

    # DELETE
    - name: Delete SPAN Session source (check mode)
      cisco.mso.ndo_fabric_span_session_source: &cm_rm_ansible_test_source_1
        <<: *mso_info
        template: "{{ mso_test.monitoring_access_template }}"
        span_session_name: "{{ mso_test.span_session }}"
        name: "{{ mso_test.source_1 }}"
        state: absent
        output_level: debug
      check_mode: true
      register: cm_rm_ansible_test_source_1

    - name: Delete SPAN Session source
      cisco.mso.ndo_fabric_span_session_source:
        <<: *cm_rm_ansible_test_source_1
      register: rm_ansible_test_source_1

    - name: Delete SPAN Session source again
      cisco.mso.ndo_fabric_span_session_source:
        <<: *cm_rm_ansible_test_source_1
      register: rm_ansible_test_source_1_again

    - name: Assertion check for delete SPAN Session source
      ansible.builtin.assert:
        that:
          - cm_rm_ansible_test_source_1 is changed
          - cm_rm_ansible_test_source_1.current == {}
          - cm_rm_ansible_test_source_1.previous.direction == "outgoing"
          - cm_rm_ansible_test_source_1.previous.l3out == {}
          - cm_rm_ansible_test_source_1.previous.name == mso_test.source_1
          - cm_rm_ansible_test_source_1.previous.spanDropPackets == false
          - cm_rm_ansible_test_source_1.previous.templateName == mso_test.monitoring_access_template
          - cm_rm_ansible_test_source_1.proposed == {}
          - rm_ansible_test_source_1 is changed
          - rm_ansible_test_source_1.current == {}
          - rm_ansible_test_source_1.previous.direction == "outgoing"
          - rm_ansible_test_source_1.previous.l3out == {}
          - rm_ansible_test_source_1.previous.name == mso_test.source_1
          - rm_ansible_test_source_1.previous.spanDropPackets == false
          - rm_ansible_test_source_1.previous.templateName == mso_test.monitoring_access_template
          - rm_ansible_test_source_1_again is not changed
          - rm_ansible_test_source_1_again.current == {}
          - rm_ansible_test_source_1_again.previous == {}

  always:
    # CLEAN TEST ENVIRONMENT
    - name: Ensure Fabric Monitoring Access Policy template does not exist
      cisco.mso.ndo_template:
        <<: *mso_info
        template: "{{ mso_test.monitoring_access_template }}"
        template_type: monitoring_access
        sites:
          - name: "{{ mso_test.site }}"
        state: absent
      register: rm_monitoring_access_template
      ignore_errors: true

    - name: Ensure L3Out template does not exist
      cisco.mso.ndo_template:
        <<: *mso_info
        template: "{{ mso_test.l3out_template }}"
        template_type: l3out
        state: absent
      register: rm_l3out_template
      ignore_errors: true

    - name: Ensure Fabric Resource Policy template does not exist
      cisco.mso.ndo_template:
        <<: *mso_info
        template: "{{ mso_test.fabric_resource_template }}"
        template_type: fabric_resource
        sites:
          - name: "{{ mso_test.site }}"
        state: absent
      register: rm_fabric_resource_template
      ignore_errors: true

    - name: Ensure Fabric Policy template does not exist
      cisco.mso.ndo_template:
        <<: *mso_info
        template: "{{ mso_test.fabric_policy_template }}"
        template_type: fabric_policy
        state: absent
      register: rm_fabric_policy_template
      ignore_errors: true

    - name: Ensure Schema does not exist
      cisco.mso.mso_schema:
        <<: *mso_info
        schema: "{{ mso_test.schema }}"
        state: absent
      ignore_errors: true

    - name: Ensure Tenant does not exist
      cisco.mso.mso_tenant:
        <<: *mso_info
        tenant: "{{ mso_test.apic_tenant }}"
        orchestrator_only: no # To delete tenant from both MSO and APIC
        state: absent
      ignore_errors: true

    - name: Set ansible_network_os to cisco.aci.aci and ansible_connection to local
      ansible.builtin.set_fact:
        ansible_network_os: cisco.aci.aci

    - name: Reset the ansible_connection to access the APIC
      ansible.builtin.meta: reset_connection

    - name: Ensure L3 domain does not exist
      cisco.aci.aci_domain:
        <<: *aci_info
        domain: "{{ mso_test.apic_l3_domain }}"
        domain_type: l3dom
        state: absent
      ignore_errors: true
