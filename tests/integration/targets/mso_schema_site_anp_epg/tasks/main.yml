- name: Test that required ACI MultiSite variables are defined
  ansible.builtin.fail:
    msg: 'Please define mso_hostname, mso_username and mso_password.'
  when: mso_hostname is not defined or mso_username is not defined or mso_password is not defined

- name: Set test connection and fixture variables
  ansible.builtin.set_fact:
    mso_info: &mso_info
      host: '{{ mso_hostname }}'
      username: '{{ mso_username }}'
      password: '{{ mso_password }}'
      validate_certs: '{{ mso_validate_certs | default(false) }}'
      use_ssl: '{{ mso_use_ssl | default(true) }}'
      use_proxy: '{{ mso_use_proxy | default(true) }}'
      output_level: debug
    mso_test:
      schema: '{{ mso_schema_site_anp_epg | default(mso_schema | default("ansible_test")) }}'
      tenant: '{{ mso_tenant_site_anp_epg | default(mso_tenant | default("ansible_test")) }}'
      site: '{{ mso_site_site_anp_epg | default(mso_site | default("ansible_test")) }}'
      template: Template1
      template_without_site: Template2
      anp: ANP1
      vrf: VRF1
      bd: BD1
      epg:
        name: EPG1
        private_link_label: PrivateLinkLabel1
        domain:
          type: vmmDomain
          profile: VMware-VMM
          deployment_immediacy: lazy
          resolution_immediacy: pre-provision
        subnet:
          subnet: 10.10.3.1/24
          description: Site subnet 3
          scope: public
          shared: true
          no_default_gateway: true
        staticleaf:
          pod: pod-1
          leaf: '101'
          vlan: 126
        staticport:
          type: port
          pod: pod-1
          leaf: '101'
          path: eth1/1
          vlan: 126
          mode: native
          deployment_immediacy: immediate
      epg_2: EPG2
      epg_3: EPG3

- name: Exercise mso_schema_site_anp_epg
  block:

  # CLEAN ENVIRONMENT
  # Due to API changes in ND 4.2, the configured site and tenant are
  # prerequisites for this test and must already exist. They are intentionally
  # not created or queried here; only their tenant-site association is managed.
  - name: Remove test schema before testing
    cisco.mso.mso_schema:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      state: absent

  - name: Ensure schema and template exist
    cisco.mso.mso_schema_template:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      tenant: '{{ mso_test.tenant }}'
      template: '{{ mso_test.template }}'
      state: present

  - name: Ensure unassociated schema template exists for error handling
    cisco.mso.mso_schema_template:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      tenant: '{{ mso_test.tenant }}'
      template: '{{ mso_test.template_without_site }}'
      state: present

  - name: Query EPG before site is associated with schema template
    cisco.mso.mso_schema_site_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      state: query
    check_mode: true
    register: cm_no_site_associated_with_template
    ignore_errors: true

  # TODO: mso_tenant_site is deprecated. Replace this with the supported
  # tenant-site association solution, or require a stable test environment
  # where this association is already present before the test runs.
  - name: Associate the site with the tenant
    cisco.mso.mso_tenant_site:
      <<: *mso_info
      tenant: '{{ mso_test.tenant }}'
      site: '{{ mso_test.site }}'
      state: present

  - name: Associate the site with the schema template
    cisco.mso.mso_schema_site:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      state: present

  - name: Query EPG with template not associated with site
    cisco.mso.mso_schema_site_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_without_site }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      state: query
    check_mode: true
    register: cm_template_without_site
    ignore_errors: true

  - name: Ensure template VRF exists
    cisco.mso.mso_schema_template_vrf:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      vrf: '{{ mso_test.vrf }}'
      state: present

  - name: Ensure template bridge domain exists
    cisco.mso.mso_schema_template_bd:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      bd: '{{ mso_test.bd }}'
      vrf:
        name: '{{ mso_test.vrf }}'
      state: present

  - name: Ensure template ANP exists
    cisco.mso.mso_schema_template_anp:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      state: present

  # Site EPGs are replicated by ND when the template is associated
  # with the site, so no site-level create is needed here.
  - name: Ensure template EPGs exist for site replication
    cisco.mso.mso_schema_template_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ item }}'
      vrf:
        name: '{{ mso_test.vrf }}'
      bd:
        name: '{{ mso_test.bd }}'
      state: present
    loop:
    - '{{ mso_test.epg.name }}'
    - '{{ mso_test.epg_2 }}'
    - '{{ mso_test.epg_3 }}'

  # CREATE
  # Site EPG creation is skipped because ND automatically replicates the
  # template EPGs to the associated site.

  # UPDATE
  # EPG1 is replicated from the template. Add site-local child objects and
  # update the parent with real parent attributes, without child
  # attributes. The domain association retains coverage for the
  # deploymentImmediacy API inconsistency.
  # MSO Error 400: Bad Request: (0)(0)(0)(0)/deploymentImmediacy error.path.missing
  - name: Add VMM domain to site EPG for deployment-immediacy regression
    cisco.mso.mso_schema_site_anp_epg_domain: &site_epg_domain
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      domain_association_type: '{{ mso_test.epg.domain.type }}'
      domain_profile: '{{ mso_test.epg.domain.profile }}'
      deployment_immediacy: '{{ mso_test.epg.domain.deployment_immediacy }}'
      resolution_immediacy: '{{ mso_test.epg.domain.resolution_immediacy }}'
      state: present
    register: nm_add_domain

  - name: Add subnet to site EPG for parent preservation
    cisco.mso.mso_schema_site_anp_epg_subnet: &site_epg_subnet
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      subnet: '{{ mso_test.epg.subnet.subnet }}'
      description: '{{ mso_test.epg.subnet.description }}'
      scope: '{{ mso_test.epg.subnet.scope }}'
      shared: '{{ mso_test.epg.subnet.shared }}'
      no_default_gateway: '{{ mso_test.epg.subnet.no_default_gateway }}'
      state: present
    register: nm_add_subnet

  - name: Add static leaf to site EPG for parent preservation
    cisco.mso.mso_schema_site_anp_epg_staticleaf: &site_epg_staticleaf
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      pod: '{{ mso_test.epg.staticleaf.pod }}'
      leaf: '{{ mso_test.epg.staticleaf.leaf }}'
      vlan: '{{ mso_test.epg.staticleaf.vlan }}'
      state: present
    register: nm_add_staticleaf

  - name: Add static port to site EPG for parent preservation
    cisco.mso.mso_schema_site_anp_epg_staticport: &site_epg_staticport
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      type: '{{ mso_test.epg.staticport.type }}'
      pod: '{{ mso_test.epg.staticport.pod }}'
      leaf: '{{ mso_test.epg.staticport.leaf }}'
      path: '{{ mso_test.epg.staticport.path }}'
      vlan: '{{ mso_test.epg.staticport.vlan }}'
      mode: '{{ mso_test.epg.staticport.mode }}'
      deployment_immediacy: '{{ mso_test.epg.staticport.deployment_immediacy }}'
      state: present
    register: nm_add_staticport

  - name: Verify site EPG child objects were created
    ansible.builtin.assert:
      that:
      - nm_add_domain is changed
      - nm_add_subnet is changed
      - nm_add_staticleaf is changed
      - nm_add_staticport is changed

  - name: Update site EPG in check mode
    cisco.mso.mso_schema_site_anp_epg: &site_epg_present
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      private_link_label: '{{ mso_test.epg.private_link_label }}'
      admin_state: admin_shut
      state: present
    check_mode: true
    register: cm_update_epg

  - name: Update site EPG
    cisco.mso.mso_schema_site_anp_epg:
      <<: *site_epg_present
    register: nm_update_epg

  - name: Update site EPG again
    cisco.mso.mso_schema_site_anp_epg:
      <<: *site_epg_present
    register: nm_update_epg_again

  - name: Query site EPG domain after parent update
    cisco.mso.mso_schema_site_anp_epg_domain:
      <<: *site_epg_domain
      state: query
    register: nm_query_epg_domain

  - name: Query site EPG subnet after parent update
    cisco.mso.mso_schema_site_anp_epg_subnet:
      <<: *site_epg_subnet
      state: query
    register: nm_query_epg_subnet

  - name: Query site EPG static leaf after parent update
    cisco.mso.mso_schema_site_anp_epg_staticleaf:
      <<: *site_epg_staticleaf
      state: query
    register: nm_query_epg_staticleaf

  - name: Query site EPG static port after parent update
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *site_epg_staticport
      state: query
    register: nm_query_epg_staticport

  - name: Verify site EPG update and child preservation
    ansible.builtin.assert:
      that:
      - cm_update_epg is changed
      - nm_update_epg is changed
      - nm_update_epg_again is not changed
      - cm_update_epg.current.epgRef == nm_update_epg.current.epgRef
      - nm_update_epg.current.epgRef.anpName == mso_test.anp
      - nm_update_epg.current.epgRef.epgName == mso_test.epg.name
      - cm_update_epg.current.privateLinkLabel.name == mso_test.epg.private_link_label
      - nm_update_epg.current.privateLinkLabel.name == mso_test.epg.private_link_label
      - cm_update_epg.current.shutdown
      - nm_update_epg.current.shutdown
      - nm_update_epg.current.domainAssociations | length == 1
      - nm_update_epg.current.subnets | length == 1
      - nm_update_epg.current.staticLeafs | length == 1
      - nm_update_epg.current.staticPorts | length == 1
      - nm_update_epg_again.current.domainAssociations == nm_update_epg.current.domainAssociations
      - nm_update_epg_again.current.subnets == nm_update_epg.current.subnets
      - nm_update_epg_again.current.staticLeafs == nm_update_epg.current.staticLeafs
      - nm_update_epg_again.current.staticPorts == nm_update_epg.current.staticPorts
      - nm_update_epg_again.current.privateLinkLabel == nm_update_epg.current.privateLinkLabel
      - nm_update_epg_again.current.shutdown == nm_update_epg.current.shutdown
      - nm_query_epg_domain is not changed
      - nm_query_epg_domain.current.domainType == mso_test.epg.domain.type
      - nm_query_epg_domain.current.deployImmediacy == mso_test.epg.domain.deployment_immediacy
      - nm_query_epg_subnet is not changed
      - nm_query_epg_subnet.current.ip == mso_test.epg.subnet.subnet
      - nm_query_epg_subnet.current.description == mso_test.epg.subnet.description
      - nm_query_epg_subnet.current.scope == mso_test.epg.subnet.scope
      - nm_query_epg_subnet.current.shared == mso_test.epg.subnet.shared
      - nm_query_epg_subnet.current.noDefaultGateway == mso_test.epg.subnet.no_default_gateway
      - nm_query_epg_staticleaf is not changed
      - nm_query_epg_staticleaf.current.path == 'topology/' ~ mso_test.epg.staticleaf.pod ~ '/node-' ~ mso_test.epg.staticleaf.leaf
      - nm_query_epg_staticleaf.current.portEncapVlan == mso_test.epg.staticleaf.vlan
      - nm_query_epg_staticport is not changed
      - nm_query_epg_staticport.current.type == mso_test.epg.staticport.type
      - nm_query_epg_staticport.current.portEncapVlan == mso_test.epg.staticport.vlan
      - nm_query_epg_staticport.current.path == 'topology/' ~ mso_test.epg.staticport.pod ~ '/paths-' ~ mso_test.epg.staticport.leaf ~ '/pathep-[' ~ mso_test.epg.staticport.path ~ ']'

  # Revert the admin state while retaining the private link label.
  - name: Set site EPG admin state to admin up
    cisco.mso.mso_schema_site_anp_epg:
      <<: *site_epg_present
      admin_state: admin_up
    register: nm_admin_up

  - name: Verify site EPG admin state update
    ansible.builtin.assert:
      that:
      - nm_admin_up is changed
      - not nm_admin_up.current.shutdown
      - nm_admin_up.current.privateLinkLabel.name == mso_test.epg.private_link_label

  # QUERY
  - name: Query site EPG in check mode
    cisco.mso.mso_schema_site_anp_epg: &site_epg_query
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      state: query
    check_mode: true
    register: cm_query_epg

  - name: Query site EPG
    cisco.mso.mso_schema_site_anp_epg:
      <<: *site_epg_query
    register: nm_query_epg

  - name: Query all site EPGs in check mode
    cisco.mso.mso_schema_site_anp_epg: &all_site_epgs_query
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      state: query
    check_mode: true
    register: cm_query_all_epgs

  - name: Query all site EPGs
    cisco.mso.mso_schema_site_anp_epg:
      <<: *all_site_epgs_query
    register: nm_query_all_epgs

  - name: Verify specific site EPG query
    ansible.builtin.assert:
      that:
      - cm_query_epg is not changed
      - nm_query_epg is not changed
      - cm_query_epg.current == nm_query_epg.current
      - nm_query_epg.current.epgRef.schemaId is defined
      - nm_query_epg.current.epgRef.templateName == mso_test.template
      - nm_query_epg.current.epgRef.anpName == mso_test.anp
      - nm_query_epg.current.epgRef.epgName == mso_test.epg.name
      - nm_query_epg.current.domainAssociations | length == 1
      - nm_query_epg.current.subnets | length == 1
      - nm_query_epg.current.staticLeafs | length == 1
      - nm_query_epg.current.staticPorts | length == 1

  - name: Verify site EPG collection query
    ansible.builtin.assert:
      that:
      - cm_query_all_epgs is not changed
      - nm_query_all_epgs is not changed
      - cm_query_all_epgs.current == nm_query_all_epgs.current
      - cm_query_all_epgs.current | length == nm_query_all_epgs.current | length == 3
      - cm_query_all_epgs.current | selectattr('epgRef.epgName', 'equalto', mso_test.epg.name) | list | length == 1
      - cm_query_all_epgs.current | selectattr('epgRef.epgName', 'equalto', mso_test.epg_2) | list | length == 1
      - cm_query_all_epgs.current | selectattr('epgRef.epgName', 'equalto', mso_test.epg_3) | list | length == 1
      - cm_query_all_epgs.current | selectattr('epgRef.schemaId', 'defined') | list | length == 3

  # DELETE
  # Delete the child-populated EPG1 to verify that removing the parent EPG
  # also removes its site-local descendants.
  - name: Delete site EPG1 in check mode
    cisco.mso.mso_schema_site_anp_epg: &site_epg_1_absent
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      state: absent
    check_mode: true
    register: cm_delete_epg_1

  - name: Delete site EPG1
    cisco.mso.mso_schema_site_anp_epg:
      <<: *site_epg_1_absent
    register: nm_delete_epg_1

  - name: Delete site EPG1 again
    cisco.mso.mso_schema_site_anp_epg:
      <<: *site_epg_1_absent
    register: nm_delete_epg_1_again

  - name: Verify site EPG1 deletion and idempotency
    ansible.builtin.assert:
      that:
      - cm_delete_epg_1 is changed
      - cm_delete_epg_1.previous.domainAssociations | length == 1
      - cm_delete_epg_1.previous.subnets | length == 1
      - cm_delete_epg_1.previous.staticLeafs | length == 1
      - cm_delete_epg_1.previous.staticPorts | length == 1
      - cm_delete_epg_1.proposed == cm_delete_epg_1.current == {}
      - nm_delete_epg_1 is changed
      - nm_delete_epg_1.previous.domainAssociations | length == 1
      - nm_delete_epg_1.previous.subnets | length == 1
      - nm_delete_epg_1.previous.staticLeafs | length == 1
      - nm_delete_epg_1.previous.staticPorts | length == 1
      - nm_delete_epg_1.proposed == nm_delete_epg_1.current == {}
      - nm_delete_epg_1_again is not changed
      - nm_delete_epg_1_again.proposed == nm_delete_epg_1_again.current == {}

  # ERROR HANDLING
  - name: Query a missing EPG in check mode
    cisco.mso.mso_schema_site_anp_epg:
      <<: *site_epg_query
      epg: MissingEPG
    check_mode: true
    register: cm_missing_epg
    ignore_errors: true

  - name: Query a missing ANP in check mode
    cisco.mso.mso_schema_site_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      anp: MissingANP
      epg: '{{ mso_test.epg.name }}'
      state: query
    check_mode: true
    register: cm_missing_anp
    ignore_errors: true

  - name: Query a missing schema in check mode
    cisco.mso.mso_schema_site_anp_epg:
      <<: *mso_info
      schema: MissingSchema
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      state: query
    check_mode: true
    register: cm_missing_schema
    ignore_errors: true

  - name: Query a missing site in check mode
    cisco.mso.mso_schema_site_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: MissingSite
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      state: query
    check_mode: true
    register: cm_missing_site
    ignore_errors: true

  - name: Query a missing template in check mode
    cisco.mso.mso_schema_site_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: MissingTemplate
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      state: query
    check_mode: true
    register: cm_missing_template
    ignore_errors: true

  - name: Reject a missing EPG in check mode
    cisco.mso.mso_schema_site_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      state: present
    check_mode: true
    register: cm_missing_epg_present
    ignore_errors: true

  - name: Reject an absent site EPG without an EPG in check mode
    cisco.mso.mso_schema_site_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      state: absent
    check_mode: true
    register: cm_missing_epg_absent
    ignore_errors: true

  - name: Verify error-handling scenarios
    ansible.builtin.assert:
      that:
      - cm_no_site_associated_with_template is failed
      - "cm_no_site_associated_with_template.msg is search(\"No site associated with template '\" ~ mso_test.template ~ \"'\")"
      - cm_template_without_site is failed
      - "cm_template_without_site.msg is search(\"Provided site/siteId/template '\" ~ mso_test.site ~ \"/[0-9a-zA-Z]*/\" ~ mso_test.template_without_site ~ \"' does not exist\")"
      - cm_missing_epg is failed
      - cm_missing_epg.msg is search("Provided EPG 'MissingEPG' does not exist")
      - cm_missing_anp is failed
      - cm_missing_anp.msg is search("Provided anp 'MissingANP' does not exist")
      - cm_missing_schema is failed
      - cm_missing_schema.msg is search("Provided schema 'MissingSchema' does not exist")
      - cm_missing_site is failed
      - cm_missing_site.msg is search("Site 'MissingSite' is not a valid site name")
      - cm_missing_template is failed
      - cm_missing_template.msg is search("Provided template 'MissingTemplate' does not exist")
      - cm_missing_epg_present is failed
      - "cm_missing_epg_present.msg == 'state is present but all of the following are missing: epg'"
      - cm_missing_epg_absent is failed
      - "cm_missing_epg_absent.msg == 'state is absent but all of the following are missing: epg'"

  always:
  # CLEANUP
  - name: Remove test schema even when a test fails
    cisco.mso.mso_schema:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      state: absent
