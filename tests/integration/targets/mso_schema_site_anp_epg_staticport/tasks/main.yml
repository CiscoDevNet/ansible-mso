- name: Test that we have an ACI MultiSite host, username and password
  ansible.builtin.fail:
    msg: 'Please define the following variables: mso_hostname, mso_username and mso_password.'
  when: mso_hostname is not defined or mso_username is not defined or mso_password is not defined

- name: Set test connection and fixture variables
  ansible.builtin.set_fact:
    mso_info: &mso_info
      host: '{{ mso_hostname }}'
      username: '{{ mso_username }}'
      password: '{{ mso_password }}'
      validate_certs: '{{ mso_validate_certs | default(false) }}'
      use_ssl: '{{ mso_use_ssl | default(true) }}'
      use_proxy: '{{ mso_use_proxy | default(true) }}'
      output_level: '{{ mso_output_level | default("debug") }}'
    mso_test:
      schema: '{{ mso_schema_site_anp_epg_staticport | default(mso_schema | default("ansible_test")) }}'
      schema_2: '{{ mso_schema_site_anp_epg_staticport | default(mso_schema | default("ansible_test")) }}_2'
      tenant: '{{ mso_tenant_site_anp_epg_staticport | default(mso_tenant | default("ansible_test")) }}'
      site: '{{ mso_site_site_anp_epg_staticport | default(mso_site | default("ansible_test")) }}'
      template_1: 'Template 1'
      template_2: 'Template 2'
      template_3: 'Template 3'
      anp_1: 'AP1'
      anp_2: 'AP2'
      anp_5: 'AP5'
      epg_1: 'EPG1'
      epg_2: 'EPG2'
      epg_3: 'EPG3'
      epg_4: 'EPG4'
      epg_5: 'EPG5'
      epg_6: 'EPG6'
      bd_1: 'BD1'
      vrf_1: 'VRF1'
      bulk_template: 'template_bulk'
      bulk_anp: 'anp_bulk'
      bulk_epg: 'epg_bulk'
      bulk_bd: 'bd_bulk'
      bulk_vrf: 'vrf_bulk'
      pod_1: 'pod-1'
      pod_2: 'pod-2'
      pod_3: 'pod-3'
      pod_4: 'pod-4'
      path_eth1_1: 'eth1/1'
      path_eth1_2: 'eth1/2'
      path_eth1_40: 'eth1/40'
      path_eth1_41: 'eth1/41'
      port_group: 'ansible_polgrp'
      vlan_126: 126
      vlan_100: 100
      vlan_101: 101
      vlan_1309: 1309
      vlan_1200: 1200
      vlan_1100: 1100
      vlan_1101: 1101
      vlan_102: 102
      vlan_103: 103
      vlan_199: 199

- name: Exercise mso_schema_site_anp_epg_staticport
  block:
  - name: Remove schemas
    cisco.mso.mso_schema:
      <<: *mso_info
      schema: '{{ item }}'
      state: absent
    loop:
    - '{{ mso_test.schema_2 }}'
    - '{{ mso_test.schema }}'

  - name: Ensure schema 1 with Template 1 and 2 exists
    cisco.mso.mso_schema_template:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      tenant: '{{ mso_test.tenant }}'
      template: '{{ item }}'
      state: present
    loop:
    - '{{ mso_test.template_1 }}'
    - '{{ mso_test.template_2 }}'

  - name: Ensure schema 2 with Template 3 exists
    cisco.mso.mso_schema_template:
      <<: *mso_info
      schema: '{{ mso_test.schema_2 }}'
      tenant: '{{ mso_test.tenant }}'
      template: '{{ mso_test.template_3 }}'
      state: present

  - name: Add a new site to a schema
    cisco.mso.mso_schema_site:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      state: present

  - name: Ensure VRF1 exists
    cisco.mso.mso_schema_template_vrf:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template_1 }}'
      vrf: '{{ mso_test.vrf_1 }}'
      state: present

  - name: Add BD1
    cisco.mso.mso_schema_template_bd:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template_1 }}'
      bd: '{{ mso_test.bd_1 }}'
      vrf:
        name: '{{ mso_test.vrf_1 }}'
      state: present

  - name: Ensure Template 1 with AP1 exists
    cisco.mso.mso_schema_template_anp:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template_1 }}'
      anp: '{{ mso_test.anp_1 }}'
      state: present

  - name: Ensure Template 1 and AP1 with EPG1 exists
    cisco.mso.mso_schema_template_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template_1 }}'
      anp: '{{ mso_test.anp_1 }}'
      epg: '{{ mso_test.epg_1 }}'
      bd:
        name: '{{ mso_test.bd_1 }}'
      vrf:
        name: '{{ mso_test.vrf_1 }}'
      state: present

  - name: Ensure Template 1 and AP1 with EPG3 exists
    cisco.mso.mso_schema_template_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template_1 }}'
      anp: '{{ mso_test.anp_1 }}'
      epg: '{{ mso_test.epg_3 }}'
      bd:
        name: '{{ mso_test.bd_1 }}'
      vrf:
        name: '{{ mso_test.vrf_1 }}'
      state: present

  - name: Ensure Template 1 with AP2 exists
    cisco.mso.mso_schema_template_anp:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template_1 }}'
      anp: '{{ mso_test.anp_2 }}'
      state: present

  - name: Ensure Template 1 and AP2 with EPG2 exists
    cisco.mso.mso_schema_template_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template_1 }}'
      anp: '{{ mso_test.anp_2 }}'
      epg: '{{ mso_test.epg_2 }}'
      bd:
        name: '{{ mso_test.bd_1 }}'
      vrf:
        name: '{{ mso_test.vrf_1 }}'
      state: present

  - name: Ensure Template 1 and AP2 with EPG4 exists
    cisco.mso.mso_schema_template_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template_1 }}'
      anp: '{{ mso_test.anp_2 }}'
      epg: '{{ mso_test.epg_4 }}'
      bd:
        name: '{{ mso_test.bd_1 }}'
      vrf:
        name: '{{ mso_test.vrf_1 }}'
      state: present

  - name: Ensure Template 1 and AP2 with EPG6 exists
    cisco.mso.mso_schema_template_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template_1 }}'
      anp: '{{ mso_test.anp_2 }}'
      epg: '{{ mso_test.epg_6 }}'
      bd:
        name: '{{ mso_test.bd_1 }}'
      vrf:
        name: '{{ mso_test.vrf_1 }}'
      state: present

  # ADD STATIC PORTS
  - name: Add static port 1 to site EPG1 of AP1 (check mode)
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      anp: '{{ mso_test.anp_1 }}'
      epg: '{{ mso_test.epg_1 }}'
      pod: '{{ mso_test.pod_1 }}'
      leaf: 101
      path: '{{ mso_test.path_eth1_1 }}'
      vlan: '{{ mso_test.vlan_126 }}'
      mode: 'native'
      type: port
      deployment_immediacy: immediate
      state: present
    check_mode: true
    register: cm_add_stat1e1

  - name: Verify cm_add_stat1e1
    ansible.builtin.assert:
      that:
      - cm_add_stat1e1 is changed
      - cm_add_stat1e1.previous == {}
      - cm_add_stat1e1.current.deploymentImmediacy == 'immediate'
      - cm_add_stat1e1.current.portEncapVlan == mso_test.vlan_126
      - cm_add_stat1e1.current.path == 'topology/{{ mso_test.pod_1 }}/paths-101/pathep-[{{ mso_test.path_eth1_1 }}]'
      - cm_add_stat1e1.current.mode == 'native'
      - cm_add_stat1e1.current.type == 'port'

  - name: Add static port 1 to site EPG1 of AP1 (normal mode)
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      anp: '{{ mso_test.anp_1 }}'
      epg: '{{ mso_test.epg_1 }}'
      pod: '{{ mso_test.pod_1 }}'
      leaf: 101
      path: '{{ mso_test.path_eth1_1 }}'
      vlan: '{{ mso_test.vlan_126 }}'
      mode: 'native'
      deployment_immediacy: immediate
      state: present
    register: nm_add_stat1e1

  - name: Verify nm_add_stat1e1
    ansible.builtin.assert:
      that:
      - nm_add_stat1e1 is changed
      - nm_add_stat1e1.previous == {}
      - nm_add_stat1e1.current.deploymentImmediacy == 'immediate'
      - nm_add_stat1e1.current.portEncapVlan == mso_test.vlan_126
      - nm_add_stat1e1.current.path == 'topology/{{ mso_test.pod_1 }}/paths-101/pathep-[{{ mso_test.path_eth1_1 }}]'
      - nm_add_stat1e1.current.mode == 'native'
      - nm_add_stat1e1.current.type == 'port'

  - name: Add static port 2 to site EPG1 of AP1 (normal mode)
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      anp: '{{ mso_test.anp_1 }}'
      epg: '{{ mso_test.epg_1 }}'
      pod: '{{ mso_test.pod_2 }}'
      leaf: 102
      path: '{{ mso_test.path_eth1_2 }}'
      vlan: '{{ mso_test.vlan_100 }}'
      mode: 'regular'
      type: port
      primary_micro_segment_vlan: '{{ mso_test.vlan_199 }}'
      deployment_immediacy: immediate
      state: present
    register: nm_add_stat2e1

  - name: Verify nm_add_stat2e1
    ansible.builtin.assert:
      that:
      - nm_add_stat2e1 is changed
      - nm_add_stat2e1.previous == {}
      - nm_add_stat2e1.current.deploymentImmediacy == 'immediate'
      - nm_add_stat2e1.current.portEncapVlan == mso_test.vlan_100
      - nm_add_stat2e1.current.path ==  'topology/{{ mso_test.pod_2 }}/paths-102/pathep-[{{ mso_test.path_eth1_2 }}]'
      - nm_add_stat2e1.current.mode == 'regular'
      - nm_add_stat2e1.current.type == 'port'


  - name: Add static port 3 (vpc) to site EPG1 of AP1 (normal mode)
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      anp: '{{ mso_test.anp_1 }}'
      epg: '{{ mso_test.epg_1 }}'
      pod: '{{ mso_test.pod_3 }}'
      leaf: 103-104
      path: '{{ mso_test.port_group }}'
      vlan: '{{ mso_test.vlan_101 }}'
      type: vpc
      mode: untagged
      deployment_immediacy: lazy
      state: present
    register: nm_add_stat3e1

  - name: Verify nm_add_stat3e1
    ansible.builtin.assert:
      that:
      - nm_add_stat3e1 is changed
      - nm_add_stat3e1.previous == {}
      - nm_add_stat3e1.current.deploymentImmediacy == 'lazy'
      - nm_add_stat3e1.current.portEncapVlan == mso_test.vlan_101
      - nm_add_stat3e1.current.path == 'topology/{{ mso_test.pod_3 }}/protpaths-103-104/pathep-[{{ mso_test.port_group }}]'
      - nm_add_stat3e1.current.mode == 'untagged'
      - nm_add_stat3e1.current.type == 'vpc'

  - name: Add static port 1 to site EPG3 of AP1 (normal mode)
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      anp: '{{ mso_test.anp_1 }}'
      epg: '{{ mso_test.epg_3 }}'
      pod: '{{ mso_test.pod_1 }}'
      leaf: 101
      path: '{{ mso_test.path_eth1_1 }}'
      vlan: '{{ mso_test.vlan_126 }}'
      mode: 'native'
      type: port
      deployment_immediacy: immediate
      state: present
    register: nm_add_stat1e3

  - name: Verify nm_add_stat1e3
    ansible.builtin.assert:
      that:
      - nm_add_stat1e3 is changed
      - nm_add_stat1e3.previous == {}
      - nm_add_stat1e3.current.deploymentImmediacy == 'immediate'
      - nm_add_stat1e3.current.portEncapVlan == mso_test.vlan_126
      - nm_add_stat1e3.current.path == 'topology/{{ mso_test.pod_1 }}/paths-101/pathep-[{{ mso_test.path_eth1_1 }}]'
      - nm_add_stat1e3.current.mode == 'native'
      - nm_add_stat1e3.current.type == 'port'

  - name: Add static port 2 (dpc) to EPG6 of AP2 (normal mode)
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      anp: '{{ mso_test.anp_2 }}'
      epg: '{{ mso_test.epg_6 }}'
      pod: '{{ mso_test.pod_2 }}'
      leaf: 102
      path: '{{ mso_test.path_eth1_2 }}'
      vlan: '{{ mso_test.vlan_100 }}'
      deployment_immediacy: lazy
      mode: regular
      type: dpc
      primary_micro_segment_vlan: '{{ mso_test.vlan_199 }}'
      state: present
    register: nm_add_stat2e6

  - name: Verify nm_add_stat2e6
    ansible.builtin.assert:
      that:
      - nm_add_stat2e6 is changed
      - nm_add_stat2e6.previous == {}
      - nm_add_stat2e6.current.deploymentImmediacy == 'lazy'
      - nm_add_stat2e6.current.portEncapVlan == mso_test.vlan_100
      - nm_add_stat2e6.current.microSegVlan == mso_test.vlan_199
      - nm_add_stat2e6.current.path == 'topology/{{ mso_test.pod_2 }}/paths-102/pathep-[{{ mso_test.path_eth1_2 }}]'
      - nm_add_stat2e6.current.mode == 'regular'
      - nm_add_stat2e6.current.type == 'dpc'

  # QUERY STATIC PORTS
  - name: Query STATIC PORTS of site EPG1 with AP1 (normal mode)
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      anp: '{{ mso_test.anp_1 }}'
      epg: '{{ mso_test.epg_1 }}'
      state: query
    register: nm_query_statse1

  - name: Verify nm_query_statse1
    ansible.builtin.assert:
      that:
      - nm_query_statse1 is not changed

  # QUERY A STATIC PORT
  - name: Query static port 3 (vpc) of site EPG1 with AP1 (normal mode)
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      anp: '{{ mso_test.anp_1 }}'
      epg: '{{ mso_test.epg_1 }}'
      pod: '{{ mso_test.pod_3 }}'
      leaf: 103-104
      path: '{{ mso_test.port_group }}'
      vlan: '{{ mso_test.vlan_101 }}'
      mode: untagged
      type: vpc
      deployment_immediacy: immediate
      state: query
    register: nm_query_stat3e1

  - name: Verify nm_query_stat3e1
    ansible.builtin.assert:
      that:
      - nm_query_stat3e1 is not changed

  # QUERY REMOVED STATIC PORT
  - name: Add static port 2 to site EPG2 (normal mode)
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      anp: '{{ mso_test.anp_2 }}'
      epg: '{{ mso_test.epg_2 }}'
      pod: '{{ mso_test.pod_2 }}'
      leaf: 102
      path: '{{ mso_test.path_eth1_2 }}'
      vlan: '{{ mso_test.vlan_100 }}'
      mode: regular
      type: port
      deployment_immediacy: immediate
      state: present
    register: nm_add_stat2e2

  - name: Verify nm_add_stat2e2
    ansible.builtin.assert:
      that:
      - nm_add_stat2e2 is changed
      - nm_add_stat2e2.previous == {}
      - nm_add_stat2e2.current.deploymentImmediacy == 'immediate'
      - nm_add_stat2e2.current.portEncapVlan == mso_test.vlan_100
      - nm_add_stat2e2.current.path == 'topology/{{ mso_test.pod_2 }}/paths-102/pathep-[{{ mso_test.path_eth1_2 }}]'
      - nm_add_stat2e2.current.mode == 'regular'
      - nm_add_stat2e2.current.type == 'port'

  - name: Remove static port 2 from EPG2 (normal mode)
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      anp: '{{ mso_test.anp_2 }}'
      epg: '{{ mso_test.epg_2 }}'
      pod: '{{ mso_test.pod_2 }}'
      leaf: 102
      path: '{{ mso_test.path_eth1_2 }}'
      vlan: '{{ mso_test.vlan_100 }}'
      mode: regular
      type: port
      deployment_immediacy: immediate
      state: absent
    register: nm_remove_stat2e2

  - name: Verify nm_remove_stat2e2
    ansible.builtin.assert:
      that:
      - nm_remove_stat2e2 is changed

  - name: Query removed static port 2 from EPG2 (normal mode)
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      anp: '{{ mso_test.anp_2 }}'
      epg: '{{ mso_test.epg_2 }}'
      pod: '{{ mso_test.pod_2 }}'
      leaf: 102
      path: '{{ mso_test.path_eth1_2 }}'
      vlan: '{{ mso_test.vlan_100 }}'
      mode: regular
      type: port
      deployment_immediacy: immediate
      state: query
    ignore_errors: true
    register: nm_non_existent_dom2e2

  - name: Verify non_existing_domain
    ansible.builtin.assert:
      that:
      - nm_non_existent_dom2e2 is not changed
      - nm_non_existent_dom2e2.msg == "Provided Static Port Path 'topology/{{ mso_test.pod_2 }}/paths-102/pathep-[{{ mso_test.path_eth1_2 }}]' not found"

  - name: Remove static port 2 from EPG2 again(normal mode)
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      anp: '{{ mso_test.anp_2 }}'
      epg: '{{ mso_test.epg_2 }}'
      pod: '{{ mso_test.pod_2 }}'
      leaf: 101
      path: '{{ mso_test.path_eth1_2 }}'
      vlan: '{{ mso_test.vlan_100 }}'
      mode: regular
      type: port
      deployment_immediacy: immediate
      state: absent
    ignore_errors: true
    register: nm_remove_again_stat2e2

  - name: Verify nm_remove_again_stat2e2
    ansible.builtin.assert:
      that:
      - nm_remove_again_stat2e2 is not changed

  # ADD EXISTING STATIC PORT
  - name: Add static port 1 to site EPG1 again (normal mode)
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      anp: '{{ mso_test.anp_1 }}'
      epg: '{{ mso_test.epg_1 }}'
      pod: '{{ mso_test.pod_1 }}'
      leaf: 101
      path: '{{ mso_test.path_eth1_1 }}'
      vlan: '{{ mso_test.vlan_126 }}'
      mode: 'native'
      type: port
      deployment_immediacy: immediate
      state: present
    register: nm_add_stat1e1_2

  - name: Verify nm_add_stat1e1_2
    ansible.builtin.assert:
      that:
      - nm_add_stat1e1_2 is not changed

  # ADD STATIC PORT WITH NO STATE
  - name: Add static port 1 to site EPG1 again with no state (normal mode)
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      anp: '{{ mso_test.anp_1 }}'
      epg: '{{ mso_test.epg_1 }}'
      pod: '{{ mso_test.pod_1 }}'
      leaf: 101
      path: '{{ mso_test.path_eth1_1 }}'
      vlan: '{{ mso_test.vlan_126 }}'
      mode: native
      type: port
      deployment_immediacy: immediate
    ignore_errors: true
