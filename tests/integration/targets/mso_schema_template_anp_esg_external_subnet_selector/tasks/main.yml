- name: Test that required ACI MultiSite variables are defined
  ansible.builtin.fail:
    msg: 'Please define mso_hostname, mso_username and mso_password.'
  when: mso_hostname is not defined or mso_username is not defined or mso_password is not defined

- name: Set test connection and fixture variables
  ansible.builtin.set_fact:
    mso_info: &mso_info
      host: '{{ mso_hostname }}'
      username: '{{ mso_username }}'
      password: '{{ mso_password }}'
      validate_certs: '{{ mso_validate_certs | default(false) }}'
      use_ssl: '{{ mso_use_ssl | default(true) }}'
      use_proxy: '{{ mso_use_proxy | default(true) }}'
      output_level: debug
    mso_test:
      schema: '{{ mso_schema_template_anp_esg_external_subnet_selector | default(mso_schema | default("ansible_test")) }}'
      tenant: '{{ mso_tenant_template_anp_esg_external_subnet_selector | default(mso_tenant | default("ansible_test")) }}'
      template: ESG_external_subnet_selector_template
      anp: ESG_external_subnet_selector_ANP
      vrf: ESG_external_subnet_selector_VRF
      esg: ESG_external_subnet_selector_ESG
      external_subnet_selector_1:
        ip: 10.15.37.0
        updated_description: Updated external subnet selector
        updated_shared: false
      external_subnet_selector_2:
        ip: 10.15.38.0
        description: Second external subnet selector
        shared: true
      external_subnet_selector_3:
        ip: 10.15.39.0
        description: Third external subnet selector
        shared: false

- name: Query NDO version
  cisco.mso.mso_version:
    <<: *mso_info
    state: query
  register: version

- name: Exercise mso_schema_template_anp_esg_external_subnet_selector
  when: version.current.version is version('5.1', '>=')
  block:

  # CLEAN ENVIRONMENT
  # The ansible_test tenant is created by the mso_setup_tenant_site setup target.
  - name: Remove test schema before testing
    cisco.mso.mso_schema:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      state: absent

  - name: Ensure schema and template exist
    cisco.mso.mso_schema_template:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      tenant: '{{ mso_test.tenant }}'
      template: '{{ mso_test.template }}'
      state: present

  - name: Ensure the template ANP exists
    cisco.mso.mso_schema_template_anp:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      state: present

  - name: Ensure the ESG VRF exists
    cisco.mso.mso_schema_template_vrf:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      vrf: '{{ mso_test.vrf }}'
      state: present

  - name: Ensure the ESG exists
    cisco.mso.mso_schema_template_anp_esg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      vrf:
        name: '{{ mso_test.vrf }}'
      state: present

  # CREATE
  - name: Create ESG external subnet selector in check mode
    cisco.mso.mso_schema_template_anp_esg_external_subnet_selector: &external_subnet_selector_1_present
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      ip: '{{ mso_test.external_subnet_selector_1.ip }}'
      state: present
    check_mode: true
    register: cm_create_external_subnet_selector

  - name: Create ESG external subnet selector
    cisco.mso.mso_schema_template_anp_esg_external_subnet_selector:
      <<: *external_subnet_selector_1_present
    register: nm_create_external_subnet_selector

  - name: Create ESG external subnet selector again
    cisco.mso.mso_schema_template_anp_esg_external_subnet_selector:
      <<: *external_subnet_selector_1_present
    register: nm_create_external_subnet_selector_again

  - name: Verify ESG external subnet selector creation and idempotency
    ansible.builtin.assert:
      that:
      - cm_create_external_subnet_selector is changed
      - nm_create_external_subnet_selector is changed
      - nm_create_external_subnet_selector_again is not changed
      - cm_create_external_subnet_selector.previous == {}
      - cm_create_external_subnet_selector.proposed.ip == mso_test.external_subnet_selector_1.ip
      - cm_create_external_subnet_selector.current == cm_create_external_subnet_selector.proposed
      - nm_create_external_subnet_selector.previous == cm_create_external_subnet_selector.previous
      - nm_create_external_subnet_selector.proposed == cm_create_external_subnet_selector.proposed
      - nm_create_external_subnet_selector.current == nm_create_external_subnet_selector.proposed
      - nm_create_external_subnet_selector_again.previous == nm_create_external_subnet_selector_again.current
      - nm_create_external_subnet_selector_again.proposed == nm_create_external_subnet_selector_again.current
      - nm_create_external_subnet_selector_again.current.ip == mso_test.external_subnet_selector_1.ip
      - nm_create_external_subnet_selector_again.current.shared == false

  # UPDATE
  - name: Update ESG external subnet selector in check mode
    cisco.mso.mso_schema_template_anp_esg_external_subnet_selector: &external_subnet_selector_1_updated
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      ip: '{{ mso_test.external_subnet_selector_1.ip }}'
      description: '{{ mso_test.external_subnet_selector_1.updated_description }}'
      shared: '{{ mso_test.external_subnet_selector_1.updated_shared }}'
      state: present
    check_mode: true
    register: cm_update_external_subnet_selector

  - name: Update ESG external subnet selector
    cisco.mso.mso_schema_template_anp_esg_external_subnet_selector:
      <<: *external_subnet_selector_1_updated
    register: nm_update_external_subnet_selector

  - name: Update ESG external subnet selector again
    cisco.mso.mso_schema_template_anp_esg_external_subnet_selector:
      <<: *external_subnet_selector_1_updated
    register: nm_update_external_subnet_selector_again

  - name: Verify ESG external subnet selector previous proposed and current state after update
    ansible.builtin.assert:
      that:
      - cm_update_external_subnet_selector is changed
      - nm_update_external_subnet_selector is changed
      - nm_update_external_subnet_selector_again is not changed
      - cm_update_external_subnet_selector.previous == nm_create_external_subnet_selector_again.current
      - cm_update_external_subnet_selector.proposed.ip == mso_test.external_subnet_selector_1.ip
      - cm_update_external_subnet_selector.proposed.description == mso_test.external_subnet_selector_1.updated_description
      - cm_update_external_subnet_selector.proposed.shared == mso_test.external_subnet_selector_1.updated_shared
      - cm_update_external_subnet_selector.current == cm_update_external_subnet_selector.proposed
      - cm_update_external_subnet_selector.current == nm_update_external_subnet_selector.current
      - nm_update_external_subnet_selector.previous == cm_update_external_subnet_selector.previous
      - nm_update_external_subnet_selector.proposed == cm_update_external_subnet_selector.proposed
      - nm_update_external_subnet_selector_again.previous == nm_update_external_subnet_selector_again.current
      - nm_update_external_subnet_selector_again.proposed == nm_update_external_subnet_selector.proposed
      - nm_update_external_subnet_selector_again.current == nm_update_external_subnet_selector.current

  # QUERY
  - name: Create a second ESG external subnet selector
    cisco.mso.mso_schema_template_anp_esg_external_subnet_selector:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      ip: '{{ mso_test.external_subnet_selector_2.ip }}'
      description: '{{ mso_test.external_subnet_selector_2.description }}'
      shared: '{{ mso_test.external_subnet_selector_2.shared }}'
      state: present

  - name: Create a third ESG external subnet selector
    cisco.mso.mso_schema_template_anp_esg_external_subnet_selector:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      ip: '{{ mso_test.external_subnet_selector_3.ip }}'
      description: '{{ mso_test.external_subnet_selector_3.description }}'
      shared: '{{ mso_test.external_subnet_selector_3.shared }}'
      state: present

  - name: Query an ESG external subnet selector
    cisco.mso.mso_schema_template_anp_esg_external_subnet_selector:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      ip: '{{ mso_test.external_subnet_selector_1.ip }}'
      state: query
    register: nm_query_external_subnet_selector

  - name: Query all ESG external subnet selectors
    cisco.mso.mso_schema_template_anp_esg_external_subnet_selector:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      state: query
    register: nm_query_all_external_subnet_selectors

  - name: Verify specific and collection ESG external subnet selector queries
    ansible.builtin.assert:
      that:
      - nm_query_external_subnet_selector is not changed
      - nm_query_external_subnet_selector.current == nm_update_external_subnet_selector.current
      - nm_query_all_external_subnet_selectors is not changed
      - nm_query_all_external_subnet_selectors.current | length == 3
      - nm_query_all_external_subnet_selectors.current | selectattr('ip', 'equalto', mso_test.external_subnet_selector_1.ip) | list | length == 1
      - nm_query_all_external_subnet_selectors.current | selectattr('ip', 'equalto', mso_test.external_subnet_selector_2.ip) | list | length == 1
      - nm_query_all_external_subnet_selectors.current | selectattr('ip', 'equalto', mso_test.external_subnet_selector_3.ip) | list | length == 1
      - (nm_query_all_external_subnet_selectors.current | selectattr('ip', 'equalto', mso_test.external_subnet_selector_1.ip) | first).description == mso_test.external_subnet_selector_1.updated_description
      - (nm_query_all_external_subnet_selectors.current | selectattr('ip', 'equalto', mso_test.external_subnet_selector_1.ip) | first).shared == mso_test.external_subnet_selector_1.updated_shared
      - (nm_query_all_external_subnet_selectors.current | selectattr('ip', 'equalto', mso_test.external_subnet_selector_2.ip) | first).description == mso_test.external_subnet_selector_2.description
      - (nm_query_all_external_subnet_selectors.current | selectattr('ip', 'equalto', mso_test.external_subnet_selector_2.ip) | first).shared == mso_test.external_subnet_selector_2.shared
      - (nm_query_all_external_subnet_selectors.current | selectattr('ip', 'equalto', mso_test.external_subnet_selector_3.ip) | first).description == mso_test.external_subnet_selector_3.description
      - (nm_query_all_external_subnet_selectors.current | selectattr('ip', 'equalto', mso_test.external_subnet_selector_3.ip) | first).shared == mso_test.external_subnet_selector_3.shared

  # ERROR HANDLING
  - name: Query a missing ESG external subnet selector in check mode
    cisco.mso.mso_schema_template_anp_esg_external_subnet_selector:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      ip: 10.15.99.0
      state: query
    check_mode: true
    register: cm_missing_external_subnet_selector
    ignore_errors: true

  - name: Query external subnet selector for a missing ESG in check mode
    cisco.mso.mso_schema_template_anp_esg_external_subnet_selector:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: MissingESG
      ip: '{{ mso_test.external_subnet_selector_1.ip }}'
      state: query
    check_mode: true
    register: cm_missing_esg
    ignore_errors: true

  - name: Query external subnet selector for a missing schema in check mode
    cisco.mso.mso_schema_template_anp_esg_external_subnet_selector:
      <<: *mso_info
      schema: MissingSchema
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      ip: '{{ mso_test.external_subnet_selector_1.ip }}'
      state: query
    check_mode: true
    register: cm_missing_schema
    ignore_errors: true

  - name: Query external subnet selector for a missing template in check mode
    cisco.mso.mso_schema_template_anp_esg_external_subnet_selector:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: MissingTemplate
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      ip: '{{ mso_test.external_subnet_selector_1.ip }}'
      state: query
    check_mode: true
    register: cm_missing_template
    ignore_errors: true

  - name: Query external subnet selector for a missing ANP in check mode
    cisco.mso.mso_schema_template_anp_esg_external_subnet_selector:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: MissingANP
      esg: '{{ mso_test.esg }}'
      ip: '{{ mso_test.external_subnet_selector_1.ip }}'
      state: query
    check_mode: true
    register: cm_missing_anp
    ignore_errors: true

  - name: Reject a present ESG external subnet selector without an IP in check mode
    cisco.mso.mso_schema_template_anp_esg_external_subnet_selector:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      state: present
    check_mode: true
    register: cm_missing_external_subnet_selector_present
    ignore_errors: true

  - name: Reject an absent ESG external subnet selector without an IP in check mode
    cisco.mso.mso_schema_template_anp_esg_external_subnet_selector:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      state: absent
    check_mode: true
    register: cm_missing_external_subnet_selector_absent
    ignore_errors: true

  - name: Reject an invalid ESG external subnet selector state in check mode
    cisco.mso.mso_schema_template_anp_esg_external_subnet_selector:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      ip: '{{ mso_test.external_subnet_selector_1.ip }}'
      state: invalid
    check_mode: true
    register: cm_invalid_state
    ignore_errors: true

  - name: Verify ESG external subnet selector error handling
    ansible.builtin.assert:
      that:
      - cm_missing_external_subnet_selector is failed
      - "cm_missing_external_subnet_selector.msg == \"Provided External Subnet Selector '10.15.99.0' not matching existing External Subnet Selector(s): 10.15.37.0, 10.15.38.0, 10.15.39.0\""
      - cm_missing_esg is failed
      - "cm_missing_esg.msg == \"Provided ESG 'MissingESG' not matching existing ESG(s): ESG_external_subnet_selector_ESG\""
      - cm_missing_schema is failed
      - "cm_missing_schema.msg == \"Provided schema 'MissingSchema' does not exist.\""
      - cm_missing_template is failed
      - "cm_missing_template.msg == \"Provided template 'MissingTemplate' not matching existing template(s): ESG_external_subnet_selector_template\""
      - cm_missing_anp is failed
      - "cm_missing_anp.msg == \"Provided ANP 'MissingANP' not matching existing anp(s): ESG_external_subnet_selector_ANP\""
      - cm_missing_external_subnet_selector_present is failed
      - "cm_missing_external_subnet_selector_present.msg == 'state is present but all of the following are missing: ip'"
      - cm_missing_external_subnet_selector_absent is failed
      - "cm_missing_external_subnet_selector_absent.msg == 'state is absent but all of the following are missing: ip'"

      - cm_invalid_state is failed
      - "cm_invalid_state.msg == 'value of state must be one of: absent, present, query, got: invalid'"

  # DELETE
  - name: Remove ESG external subnet selector in check mode
    cisco.mso.mso_schema_template_anp_esg_external_subnet_selector: &external_subnet_selector_1_absent
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      ip: '{{ mso_test.external_subnet_selector_1.ip }}'
      state: absent
    check_mode: true
    register: cm_remove_external_subnet_selector

  - name: Remove ESG external subnet selector
    cisco.mso.mso_schema_template_anp_esg_external_subnet_selector:
      <<: *external_subnet_selector_1_absent
    register: nm_remove_external_subnet_selector

  - name: Remove ESG external subnet selector again
    cisco.mso.mso_schema_template_anp_esg_external_subnet_selector:
      <<: *external_subnet_selector_1_absent
    register: nm_remove_external_subnet_selector_again

  - name: Verify ESG external subnet selector previous proposed and current state after removal
    ansible.builtin.assert:
      that:
      - cm_remove_external_subnet_selector is changed
      - nm_remove_external_subnet_selector is changed
      - nm_remove_external_subnet_selector_again is not changed
      - cm_remove_external_subnet_selector.previous == nm_update_external_subnet_selector.current
      - cm_remove_external_subnet_selector.proposed == cm_remove_external_subnet_selector.current == {}
      - nm_remove_external_subnet_selector.previous == cm_remove_external_subnet_selector.previous
      - nm_remove_external_subnet_selector.proposed == nm_remove_external_subnet_selector.current == {}
      - nm_remove_external_subnet_selector_again.previous == nm_remove_external_subnet_selector_again.proposed == nm_remove_external_subnet_selector_again.current == {}

  always:
  # CLEANUP
  - name: Remove test schema even when a test fails
    cisco.mso.mso_schema:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      state: absent
