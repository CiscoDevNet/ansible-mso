      - error_1 in err_query_static_ports.msg
      - error_2 in err_query_static_ports.msg

  # FORCE REMOVE ALL STATIC PORTS

  - name: Force remove all static ports
    cisco.mso.mso_schema_site_anp_epg_staticport: &force_remove_all
      <<: *anp_bulk
      epg: '{{ mso_test.bulk_epg }}'
      site: '{{ mso_test.site }}'
      force_replace: true
      state: absent
    register: force_remove_all_static_ports

  - name: Create new static ports without existing static ports
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *force_remove_all
      static_ports:
      - leaf: 101
        pod: '{{ mso_test.pod_1 }}'
        path: '{{ mso_test.path_eth1_40 }}'
        type: port
        vlan: '{{ mso_test.vlan_1100 }}'
      state: present
    register: force_remove_all_new_static

  - name: Force remove all static ports again
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *force_remove_all

  - name: Verify force remove all static ports
    ansible.builtin.assert:
      that:
        - force_remove_all_static_ports is changed
        - force_remove_all_static_ports.previous | length == 10
        - force_remove_all_static_ports.current == []
        - force_remove_all_new_static is changed
        - force_remove_all_new_static.previous == []
        - force_remove_all_new_static.current | length == 1

  # WITHOUT VLAN REMOVAL TEST
  - name: Create static ports for without VLAN removal tests
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.bulk_template }}'
      anp: '{{ mso_test.bulk_anp }}'
      epg: '{{ mso_test.bulk_epg }}'
      static_ports:
        - pod: '{{ mso_test.pod_2 }}'
          leaf: 102
          path: 'eth1/1'
          vlan: '{{ mso_test.vlan_101 }}'
        - pod: '{{ mso_test.pod_2 }}'
          leaf: 102
          path: '{{ mso_test.path_eth1_2 }}'
          vlan: '{{ mso_test.vlan_102 }}'
        - pod: '{{ mso_test.pod_2 }}'
          leaf: 102
          path: 'eth1/3'
          vlan: '{{ mso_test.vlan_103 }}'
      state: present

  - name: Remove a static port without VLAN
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.bulk_template }}'
      anp: '{{ mso_test.bulk_anp }}'
      epg: '{{ mso_test.bulk_epg }}'
      pod: '{{ mso_test.pod_2 }}'
      leaf: 102
      path: 'eth1/1'
      state: absent
    register: rm_stat_without_vlan

  - name: Verify rm_stat_without_vlan
    ansible.builtin.assert:
      that:
      - rm_stat_without_vlan is changed
      - rm_stat_without_vlan.current == {}

  - name: Remove multiple static ports in bulk without VLAN
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.bulk_template }}'
      anp: '{{ mso_test.bulk_anp }}'
      epg: '{{ mso_test.bulk_epg }}'
      static_ports:
        - pod: '{{ mso_test.pod_2 }}'
          leaf: 102
          path: '{{ mso_test.path_eth1_2 }}'
        - pod: '{{ mso_test.pod_2 }}'
          leaf: 102
          path: 'eth1/3'
      state: absent
    register: rm_bulk_stat_without_vlan

  - name: Verify rm_bulk_stat_without_vlan
    ansible.builtin.assert:
      that:
      - rm_bulk_stat_without_vlan is changed
      - rm_bulk_stat_without_vlan.current == []

  # OVERWRITE ARGUMENTS

  - name: Overwrite static port arguments (error)
    cisco.mso.mso_schema_site_anp_epg_staticport: &overwrite_static_ports
      <<: *anp_bulk
      epg: '{{ mso_test.bulk_epg }}'
      site: '{{ mso_test.site }}'
      leaf: 201
      pod: '{{ mso_test.pod_1 }}'
      static_ports:
      - type: port
    register: err_overwrite_static_ports
    ignore_errors: true

  - name: Overwrite static other port arguments (error)
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *anp_bulk
      epg: '{{ mso_test.bulk_epg }}'
      site: '{{ mso_test.site }}'
      path: '{{ mso_test.path_eth1_41 }}'
      vlan: '{{ mso_test.vlan_1101 }}'
      static_ports:
      - type: port
    register: err_overwrite_static_ports_other
    ignore_errors: true

  - name: Overwrite static port arguments
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *overwrite_static_ports
      path: '{{ mso_test.path_eth1_41 }}'
      vlan: '{{ mso_test.vlan_1101 }}'
    register: overwrite_static_ports
    ignore_errors: true

  - name: Verify overwrite static port arguments
    ansible.builtin.assert:
      that:
        - err_overwrite_static_ports is failed
        - 'err_overwrite_static_ports.msg == "state is present but all of the following are missing: path, vlan."'
        - err_overwrite_static_ports_other is failed
        - 'err_overwrite_static_ports_other.msg == "state is present but all of the following are missing: pod, leaf."'
        - overwrite_static_ports is changed
        - overwrite_static_ports.current.0.path == "topology/{{ mso_test.pod_1 }}/paths-201/pathep-[{{ mso_test.path_eth1_41 }}]"
        - overwrite_static_ports.current.0.portEncapVlan == 1101
        - overwrite_static_ports.current.0.type == "port"

  always:
  - name: Remove test schemas even if the test fails
    cisco.mso.mso_schema:
      <<: *mso_info
      schema: '{{ item }}'
      state: absent
    loop:
    - '{{ mso_test.schema_2 }}'
    - '{{ mso_test.schema }}'
    ignore_errors: true
