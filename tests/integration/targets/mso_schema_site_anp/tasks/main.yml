- name: Test that required ACI MultiSite variables are defined
  ansible.builtin.fail:
    msg: 'Please define mso_hostname, mso_username and mso_password.'
  when: mso_hostname is not defined or mso_username is not defined or mso_password is not defined

- name: Set test connection and fixture variables
  ansible.builtin.set_fact:
    mso_info: &mso_info
      host: '{{ mso_hostname }}'
      username: '{{ mso_username }}'
      password: '{{ mso_password }}'
      validate_certs: '{{ mso_validate_certs | default(false) }}'
      use_ssl: '{{ mso_use_ssl | default(true) }}'
      use_proxy: '{{ mso_use_proxy | default(true) }}'
      output_level: debug
    mso_test:
      schema: '{{ mso_schema_site_anp | default(mso_schema | default("ansible_test")) }}'
      tenant: '{{ mso_tenant_site_anp | default(mso_tenant | default("ansible_test")) }}'
      site: '{{ mso_site_site_anp | default(mso_site | default("ansible_test")) }}'
      template: Template1
      anp: ANP1
      anp_2: ANP2
      anp_3: ANP3
      vrf: VRF1
      bd: BD1
      epg:
        name: EPG1
        epg_subnet:
          subnet: 10.10.3.1/24
          description: Site subnet 3
          scope: public
          shared: true
          no_default_gateway: true
        staticleaf:
          pod: pod-1
          leaf: '101'
          vlan: 126
        staticport:
          type: port
          pod: pod-1
          leaf: '101'
          path: eth1/1
          vlan: 126
          mode: native
          deployment_immediacy: immediate
      domain:
        type: vmmDomain
        profile: VMware-VMM
        deployment_immediacy: lazy
        resolution_immediacy: pre-provision

- name: Exercise mso_schema_site_anp
  block:

  # CLEAN ENVIRONMENT
  # The configured site and tenant are prerequisites for this test on ND 4.2+
  # and NDO 5.2+. Only the schema created by this test is removed here.
  - name: Remove test schema before testing
    cisco.mso.mso_schema:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      state: absent

  - name: Ensure schema and template exist
    cisco.mso.mso_schema_template:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      tenant: '{{ mso_test.tenant }}'
      template: '{{ mso_test.template }}'
      state: present

  # TODO: mso_tenant_site is deprecated. Replace this with the supported
  # tenant-site association solution, or require a stable test environment
  # where this association is already present before the test runs.
  - name: Associate the site with the tenant
    cisco.mso.mso_tenant_site:
      <<: *mso_info
      tenant: '{{ mso_test.tenant }}'
      site: '{{ mso_test.site }}'
      state: present

  - name: Associate the site with the schema template
    cisco.mso.mso_schema_site:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      state: present

  - name: Ensure template VRF exists
    cisco.mso.mso_schema_template_vrf:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      vrf: '{{ mso_test.vrf }}'
      state: present

  - name: Ensure template bridge domain exists
    cisco.mso.mso_schema_template_bd:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      bd: '{{ mso_test.bd }}'
      vrf:
        name: '{{ mso_test.vrf }}'
      state: present

  # ND replicates template ANPs to the site when the schema template is
  # associated with the site. The site ANP module is therefore not used to
  # create these initial site ANPs.
  - name: Ensure template ANPs exist for site replication
    cisco.mso.mso_schema_template_anp:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ item }}'
      state: present
    loop:
    - '{{ mso_test.anp }}'
    - '{{ mso_test.anp_2 }}'
    - '{{ mso_test.anp_3 }}'

  - name: Ensure template EPG exists under the replicated ANP
    cisco.mso.mso_schema_template_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      bd:
        name: '{{ mso_test.bd }}'
      vrf:
        name: '{{ mso_test.vrf }}'
      state: present

  # CREATE
  # Site ANP and EPG creation are skipped because ND replicates the template
  # ANP and EPG to the associated site.

  # UPDATE
  # Add child objects to the replicated site ANP before reconciling the
  # parent. This exercises the update path that must preserve descendants.

  # This association is intentionally configured before reconciling the
  # parent ANP. It retains coverage for:
  # MSO Error 400: Bad Request: (0)(0)(0)(0)/deploymentImmediacy error.path.missing
  - name: Add VMM domain to site EPG for deployment-immediacy regression
    cisco.mso.mso_schema_site_anp_epg_domain: &site_anp_domain
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      domain_association_type: '{{ mso_test.domain.type }}'
      domain_profile: '{{ mso_test.domain.profile }}'
      deployment_immediacy: '{{ mso_test.domain.deployment_immediacy }}'
      resolution_immediacy: '{{ mso_test.domain.resolution_immediacy }}'
      state: present
    register: nm_add_site_anp_domain

  - name: Add EPG subnet to the replicated site ANP
    cisco.mso.mso_schema_site_anp_epg_subnet: &site_anp_subnet
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      subnet: '{{ mso_test.epg.epg_subnet.subnet }}'
      description: '{{ mso_test.epg.epg_subnet.description }}'
      scope: '{{ mso_test.epg.epg_subnet.scope }}'
      shared: '{{ mso_test.epg.epg_subnet.shared }}'
      no_default_gateway: '{{ mso_test.epg.epg_subnet.no_default_gateway }}'
      state: present
    register: nm_add_site_anp_subnet

  - name: Add static leaf to the replicated site ANP
    cisco.mso.mso_schema_site_anp_epg_staticleaf: &site_anp_staticleaf
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      pod: '{{ mso_test.epg.staticleaf.pod }}'
      leaf: '{{ mso_test.epg.staticleaf.leaf }}'
      vlan: '{{ mso_test.epg.staticleaf.vlan }}'
      state: present
    register: nm_add_site_anp_staticleaf

  - name: Add static port to the replicated site ANP
    cisco.mso.mso_schema_site_anp_epg_staticport: &site_anp_staticport
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      type: '{{ mso_test.epg.staticport.type }}'
      pod: '{{ mso_test.epg.staticport.pod }}'
      leaf: '{{ mso_test.epg.staticport.leaf }}'
      path: '{{ mso_test.epg.staticport.path }}'
      vlan: '{{ mso_test.epg.staticport.vlan }}'
      mode: '{{ mso_test.epg.staticport.mode }}'
      deployment_immediacy: '{{ mso_test.epg.staticport.deployment_immediacy }}'
      state: present
    register: nm_add_site_anp_staticport

  - name: Verify site ANP child objects were created
    ansible.builtin.assert:
      that:
      - nm_add_site_anp_domain is changed
      - nm_add_site_anp_subnet is changed
      - nm_add_site_anp_staticleaf is changed
      - nm_add_site_anp_staticport is changed

  # The site ANP is replicated from the template. Reconcile the existing
  # parent without specifying child attributes and verify that all children
  # remain present.
  - name: Reconcile replicated site ANP in check mode
    cisco.mso.mso_schema_site_anp: &site_anp_present
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      state: present
    check_mode: true
    register: cm_update_site_anp

  - name: Reconcile replicated site ANP
    cisco.mso.mso_schema_site_anp:
      <<: *site_anp_present
    register: nm_update_site_anp

  - name: Reconcile replicated site ANP again
    cisco.mso.mso_schema_site_anp:
      <<: *site_anp_present
    register: nm_update_site_anp_again

  - name: Verify site ANP reconciliation is idempotent
    ansible.builtin.assert:
      that:
      - cm_update_site_anp is not changed
      - nm_update_site_anp is not changed
      - nm_update_site_anp_again is not changed
      - cm_update_site_anp.current.anpRef == nm_update_site_anp.current.anpRef
      - nm_update_site_anp.current.anpRef.anpName == mso_test.anp
      - nm_update_site_anp_again.current.anpRef == nm_update_site_anp.current.anpRef

  - name: Query site EPG domain after parent reconciliation
    cisco.mso.mso_schema_site_anp_epg_domain:
      <<: *site_anp_domain
      state: query
    register: nm_query_site_anp_domain

  - name: Query site EPG subnet after parent reconciliation
    cisco.mso.mso_schema_site_anp_epg_subnet:
      <<: *site_anp_subnet
      state: query
    register: nm_query_site_anp_subnet

  - name: Query site static leaf after parent reconciliation
    cisco.mso.mso_schema_site_anp_epg_staticleaf:
      <<: *site_anp_staticleaf
      state: query
    register: nm_query_site_anp_staticleaf

  - name: Query site static port after parent reconciliation
    cisco.mso.mso_schema_site_anp_epg_staticport:
      <<: *site_anp_staticport
      state: query
    register: nm_query_site_anp_staticport

  - name: Verify site ANP update and child preservation
    ansible.builtin.assert:
      that:
      - cm_update_site_anp is not changed
      - nm_update_site_anp is not changed
      - nm_update_site_anp_again is not changed
      - cm_update_site_anp.current.anpRef == nm_update_site_anp.current.anpRef
      - nm_update_site_anp.current.anpRef.anpName == mso_test.anp
      - nm_update_site_anp_again.current.anpRef == nm_update_site_anp.current.anpRef
      - nm_query_site_anp_domain is not changed
      - nm_query_site_anp_domain.current.domainType == mso_test.domain.type
      - nm_query_site_anp_domain.current.deployImmediacy == mso_test.domain.deployment_immediacy
      - nm_query_site_anp_subnet is not changed
      - nm_query_site_anp_subnet.current.ip == mso_test.epg.epg_subnet.subnet
      - nm_query_site_anp_subnet.current.description == mso_test.epg.epg_subnet.description
      - nm_query_site_anp_subnet.current.scope == mso_test.epg.epg_subnet.scope
      - nm_query_site_anp_subnet.current.shared == mso_test.epg.epg_subnet.shared
      - nm_query_site_anp_subnet.current.noDefaultGateway == mso_test.epg.epg_subnet.no_default_gateway
      - nm_query_site_anp_staticleaf is not changed
      - nm_query_site_anp_staticleaf.current.path == 'topology/' ~ mso_test.epg.staticleaf.pod ~ '/node-' ~ mso_test.epg.staticleaf.leaf
      - nm_query_site_anp_staticleaf.current.portEncapVlan == mso_test.epg.staticleaf.vlan
      - nm_query_site_anp_staticport is not changed
      - nm_query_site_anp_staticport.current.type == mso_test.epg.staticport.type
      - nm_query_site_anp_staticport.current.portEncapVlan == mso_test.epg.staticport.vlan
      - nm_query_site_anp_staticport.current.path == 'topology/' ~ mso_test.epg.staticport.pod ~ '/paths-' ~ mso_test.epg.staticport.leaf ~ '/pathep-[' ~ mso_test.epg.staticport.path ~ ']'

  # QUERY
  - name: Query site ANP in check mode
    cisco.mso.mso_schema_site_anp: &site_anp_query
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      state: query
    check_mode: true
    register: cm_query_site_anp

  - name: Query site ANP
    cisco.mso.mso_schema_site_anp:
      <<: *site_anp_query
    register: nm_query_site_anp

  - name: Query all site ANPs in check mode
    cisco.mso.mso_schema_site_anp: &all_site_anps_query
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      state: query
    check_mode: true
    register: cm_query_all_site_anps

  - name: Query all site ANPs
    cisco.mso.mso_schema_site_anp:
      <<: *all_site_anps_query
    register: nm_query_all_site_anps

  - name: Verify individual site ANP query
    ansible.builtin.assert:
      that:
      - cm_query_site_anp is not changed
      - nm_query_site_anp is not changed
      - cm_query_site_anp.current.anpRef == nm_query_site_anp.current.anpRef
      - nm_query_site_anp.current.anpRef.templateName == mso_test.template
      - nm_query_site_anp.current.anpRef.anpName == mso_test.anp
      - nm_query_site_anp.current.anpRef.schemaId is defined

  - name: Verify site ANP collection query
    ansible.builtin.assert:
      that:
      - cm_query_all_site_anps is not changed
      - nm_query_all_site_anps is not changed
      - cm_query_all_site_anps.current == nm_query_all_site_anps.current
      - cm_query_all_site_anps.current | length == nm_query_all_site_anps.current | length == 3
      - cm_query_all_site_anps.current | selectattr('anpRef.anpName', 'equalto', mso_test.anp) | list | length == 1
      - cm_query_all_site_anps.current | selectattr('anpRef.anpName', 'equalto', mso_test.anp_2) | list | length == 1
      - cm_query_all_site_anps.current | selectattr('anpRef.anpName', 'equalto', mso_test.anp_3) | list | length == 1
      - cm_query_all_site_anps.current | selectattr('anpRef.schemaId', 'defined') | list | length == 3

  # DELETE
  # The template ANP remains present after the site object is removed, so ND
  # may replicate the site ANP again. This follows the site VRF test model.
  - name: Delete replicated site ANP in check mode
    cisco.mso.mso_schema_site_anp: &site_anp_absent
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      state: absent
    check_mode: true
    register: cm_delete_site_anp

  - name: Delete replicated site ANP
    cisco.mso.mso_schema_site_anp:
      <<: *site_anp_absent
    register: nm_delete_site_anp

  - name: Delete replicated site ANP again
    cisco.mso.mso_schema_site_anp:
      <<: *site_anp_absent
    register: nm_delete_site_anp_again

  - name: Verify site ANP delete and idempotency
    ansible.builtin.assert:
      that:
      - cm_delete_site_anp is changed
      - cm_delete_site_anp.previous.anpRef == nm_update_site_anp.current.anpRef
      - cm_delete_site_anp.previous.anpRef.templateName == mso_test.template
      - cm_delete_site_anp.previous.anpRef.anpName == mso_test.anp
      - cm_delete_site_anp.previous.anpRef.schemaId is defined
      - cm_delete_site_anp.proposed == cm_delete_site_anp.current == {}
      - nm_delete_site_anp is changed
      - nm_delete_site_anp.previous.anpRef == nm_update_site_anp.current.anpRef
      - nm_delete_site_anp.proposed == nm_delete_site_anp.current == {}
      - nm_delete_site_anp_again is not changed
      - nm_delete_site_anp_again.proposed == nm_delete_site_anp_again.current == {}

  # ERROR HANDLING
  - name: Query nonexistent site ANP in check mode
    cisco.mso.mso_schema_site_anp:
      <<: *site_anp_query
      anp: MissingANP
      state: query
    check_mode: true
    register: cm_missing_anp
    ignore_errors: true

  - name: Query a missing schema in check mode
    cisco.mso.mso_schema_site_anp:
      <<: *mso_info
      schema: MissingSchema
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      state: query
    check_mode: true
    register: cm_missing_schema
    ignore_errors: true

  - name: Query a missing site in check mode
    cisco.mso.mso_schema_site_anp:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: MissingSite
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      state: query
    check_mode: true
    register: cm_missing_site
    ignore_errors: true

  - name: Query a missing template in check mode
    cisco.mso.mso_schema_site_anp:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: MissingTemplate
      anp: '{{ mso_test.anp }}'
      state: query
    check_mode: true
    register: cm_missing_template
    ignore_errors: true

  - name: Reject a missing ANP in check mode
    cisco.mso.mso_schema_site_anp:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      state: present
    check_mode: true
    register: cm_missing_anp_present
    ignore_errors: true

  - name: Reject an absent site ANP without an ANP in check mode
    cisco.mso.mso_schema_site_anp:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      state: absent
    check_mode: true
    register: cm_missing_anp_absent
    ignore_errors: true

  - name: Verify error-handling scenarios
    ansible.builtin.assert:
      that:
      - cm_missing_anp is failed
      - cm_missing_anp.msg == "ANP 'MissingANP' not found"
      - cm_missing_schema is failed
      - cm_missing_schema.msg == "Provided schema 'MissingSchema' does not exist."
      - cm_missing_site is failed
      - cm_missing_site.msg == "Site 'MissingSite' is not a valid site name."
      - cm_missing_template is failed
      - cm_missing_template.msg is search("Provided site/siteId/template")
      - cm_missing_template.msg is search("MissingTemplate")
      - cm_missing_anp_present is failed
      - "cm_missing_anp_present.msg == 'state is present but all of the following are missing: anp'"
      - cm_missing_anp_absent is failed
      - "cm_missing_anp_absent.msg == 'state is absent but all of the following are missing: anp'"

  always:
  # CLEANUP
  - name: Remove test schema even when a test fails
    cisco.mso.mso_schema:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      state: absent
