- name: Test that we have an ACI MultiSite host, username and password
  ansible.builtin.fail:
    msg: 'Please define the following variables: mso_hostname, mso_username and mso_password.'
  when: mso_hostname is not defined or mso_username is not defined or mso_password is not defined

- name: Set test connection and fixture variables
  ansible.builtin.set_fact:
    mso_info: &mso_info
      host: '{{ mso_hostname }}'
      username: '{{ mso_username }}'
      password: '{{ mso_password }}'
      validate_certs: '{{ mso_validate_certs | default(false) }}'
      use_ssl: '{{ mso_use_ssl | default(true) }}'
      use_proxy: '{{ mso_use_proxy | default(true) }}'
      output_level: '{{ mso_output_level | default("debug") }}'
    mso_test:
      schema: '{{ mso_schema_template_migrate | default(mso_schema | default("ansible_test")) }}'
      schema_2: '{{ mso_schema_template_migrate_2 | default((mso_schema | default("ansible_test")) ~ "_2") }}'
      tenant: ansible_test
      site: '{{ mso_site | default("ansible_test") }}'
      template: Template 1
      template_2: Template 2
      vrf: VRF
      anp: ANP
      anp_2: ANP2
      bd_1: ansible_test_1
      bd_2: ansible_test_2
      epg_1: ansible_test_1
      epg_2: ansible_test_2
      epg_3: ansible_test_3
      epg_4: ansible_test_4

- name: Query MSO version
  cisco.mso.mso_version:
    <<: *mso_info
    state: query
  register: version

- name: Exercise mso_schema_template_migrate
  block:
    # CLEAN ENVIRONMENT
    # (ansible_test tenant+site handled by the mso_setup_tenant_site setup target)
  - name: Remove schemas
    cisco.mso.mso_schema:
      <<: *mso_info
      schema: '{{ item }}'
      state: absent
    loop:
    - '{{ mso_test.schema_2 }}'
    - '{{ mso_test.schema }}'

  - name: Ensure schemas with Template 1 exist
    cisco.mso.mso_schema_template: &schema_present
      <<: *mso_info
      schema: '{{ item }}'
      tenant: '{{ mso_test.tenant }}'
      template: '{{ mso_test.template }}'
      state: present
    loop:
      - '{{ mso_test.schema }}'
      - '{{ mso_test.schema_2 }}'

  - name: Ensure schema 2 with Template 2 exist
    cisco.mso.mso_schema_template:
      <<: *schema_present
      schema: '{{ mso_test.schema_2 }}'
      tenant: '{{ mso_test.tenant }}'
      template: '{{ mso_test.template_2 }}'
      state: present
    register: schema2_template2

  - name: Add a new site to a schema 1 with Template 1 in normal mode
    cisco.mso.mso_schema_site:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      state: present

  - name: Add a new site to a schema 2 with Template 1 and 2 in normal mode
    cisco.mso.mso_schema_site:
      <<: *mso_info
      schema: '{{ mso_test.schema_2 }}'
      site: '{{ mso_test.site }}'
      template: '{{ item }}'
      state: present
    loop:
      - '{{ mso_test.template }}'
      - '{{ mso_test.template_2 }}'

  - name: Ensure VRF exist
    cisco.mso.mso_schema_template_vrf: &vrf_present
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      vrf: '{{ mso_test.vrf }}'
      layer3_multicast: true
      state: present

  - name: Ensure ANP exist
    cisco.mso.mso_schema_template_anp:
      <<: *mso_info
      schema: '{{ mso_test.schema_2 }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      state: present

  - name: Ensure ANP2 exist
    cisco.mso.mso_schema_template_anp:
      <<: *mso_info
      schema: '{{ mso_test.schema_2 }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp_2 }}'
      state: present

  - name: Ensure ansible_test_1 BD exist
    cisco.mso.mso_schema_template_bd:
      <<: *vrf_present
      schema: '{{ mso_test.schema_2 }}'
      template: '{{ mso_test.template }}'
      bd: '{{ item }}'
      vrf:
        name: '{{ mso_test.vrf }}'
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template }}'
      state: present
    when: version.current.version is version('2.2.4e', '!=')
    loop:
      - '{{ mso_test.bd_1 }}'
      - '{{ mso_test.bd_2 }}'

  - name: Ensure EPG exist
    cisco.mso.mso_schema_template_anp_epg: &epg_present
      <<: *mso_info
      schema: '{{ mso_test.schema_2 }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg_1 }}'
      bd:
        name: '{{ mso_test.bd_1 }}'
      vrf:
        name: '{{ mso_test.vrf }}'
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template }}'
      state: present
    register: cm_add_epg

  - name: Add EPG 2 (normal mode)
    cisco.mso.mso_schema_template_anp_epg:
      <<: *epg_present
      anp: '{{ mso_test.anp_2 }}'
      epg: '{{ item }}'
    loop:
      - '{{ mso_test.epg_2 }}'
      - '{{ mso_test.epg_3 }}'
      - '{{ mso_test.epg_4 }}'

  - name: Migration of objects between templates
    cisco.mso.mso_schema_template_migrate:
      <<: *mso_info
      schema: '{{ mso_test.schema_2 }}'
      template: '{{ mso_test.template }}'
      target_schema: '{{ mso_test.schema }}'
      target_template: '{{ mso_test.template }}'
      bds:
      - '{{ mso_test.bd_1 }}'
      epgs:
      - epg: '{{ mso_test.epg_1 }}'
        anp: '{{ mso_test.anp }}'
      - epg: '{{ mso_test.epg_2 }}'
        anp: '{{ mso_test.anp_2 }}'
      state: present
    when: version.current.version is version('2.2.4e', '!=')
    register: object_migrate

  - name: Deploy a schema 1 template 1 after version 4.0
    cisco.mso.ndo_schema_template_deploy:
      <<: *mso_info
      template: '{{ mso_test.template }}'
      schema: '{{ mso_test.schema }}'
      sites:
        - '{{ mso_test.site }}'
      state: deploy
    when: version.current.version is version('4.0', '>=')

  - name: Migration of BD objects between templates
    cisco.mso.mso_schema_template_migrate:
      <<: *mso_info
      schema: '{{ mso_test.schema_2 }}'
      template: '{{ mso_test.template }}'
      target_schema: '{{ mso_test.schema_2 }}'
      target_template: '{{ mso_test.template_2 }}'
      bds:
      - '{{ mso_test.bd_2 }}'
      state: present
    when: version.current.version is version('2.2.4e', '!=')
    register: bd_migrate

  - name: Migration of EPG objects between templates
    cisco.mso.mso_schema_template_migrate:
      <<: *mso_info
      schema: '{{ mso_test.schema_2 }}'
      template: '{{ mso_test.template }}'
      target_schema: '{{ mso_test.schema_2 }}'
      target_template: '{{ mso_test.template_2 }}'
      epgs:
      - epg: '{{ mso_test.epg_3 }}'
        anp: '{{ mso_test.anp_2 }}'
      - epg: '{{ mso_test.epg_4 }}'
        anp: '{{ mso_test.anp_2 }}'
      state: present
    when: version.current.version is version('2.2.4e', '!=')
    register: epg_migrate

  - name: Deploy a schema 2 template 1 and 2 after version 4.0
    cisco.mso.ndo_schema_template_deploy:
      <<: *mso_info
      template: '{{ item }}'
      schema: '{{ mso_test.schema_2 }}'
      sites:
        - '{{ mso_test.site }}'
      state: deploy
    when: version.current.version is version('4.0', '>=')
    loop:
      - '{{ mso_test.template }}'
      - '{{ mso_test.template_2 }}'

  - name: Query deployment until deployment succeeds
    cisco.mso.ndo_schema_template_deploy:
      <<: *mso_info
      schema: '{{ mso_test.schema_2 }}'
      template: "{{ item }}"
      state: query
    register: query_deploy_status
    loop:
    - '{{ mso_test.template }}'
    - '{{ mso_test.template_2 }}'
    until: query_deploy_status.current.status.0.status.siteStatus == "Succeeded"
    retries: 10
    delay: 10

  - name: Undeploy before 4.0
    when:
      - version.current.version is version('4.0', '<')
    block:
    - name: Undeploy a schema 2 template 2
      cisco.mso.mso_schema_template_deploy:
        <<: *mso_info
        template: '{{ mso_test.template_2 }}'
        schema: '{{ mso_test.schema_2 }}'
        site: '{{ mso_test.site }}'
        state: undeploy
      ignore_errors: true

    - name: Undeploy a schema 1 template 1
      cisco.mso.mso_schema_template_deploy:
        <<: *mso_info
        template: '{{ mso_test.template }}'
        schema: '{{ mso_test.schema }}'
        site: '{{ mso_test.site }}'
        state: undeploy
      ignore_errors: true

  - name: Undeploy after 4.0
    when:
      - version.current.version is version('4.0', '>=')
    block:
    - name: Undeploy a schema 2 template 2
      cisco.mso.ndo_schema_template_deploy:
        <<: *mso_info
        template: '{{ item }}'
        schema: '{{ mso_test.schema_2 }}'
        sites:
          - '{{ mso_test.site }}'
        state: undeploy
      loop:
        - '{{ mso_test.template_2 }}'
        - '{{ mso_test.template }}'

    - name: Undeploy a schema 1 template 1
      cisco.mso.ndo_schema_template_deploy:
        <<: *mso_info
        template: '{{ mso_test.template }}'
        schema: '{{ mso_test.schema }}'
        sites:
          - '{{ mso_test.site }}'
        state: undeploy

    - name: Query undeployment until un-deployment succeeds
      cisco.mso.ndo_schema_template_deploy:
        <<: *mso_info
        schema: '{{ mso_test.schema_2 }}'
        template: "{{ item }}"
        state: query
      register: query_undeploy_status
      loop:
      - '{{ mso_test.template }}'
      - '{{ mso_test.template_2 }}'
      until: query_undeploy_status.current.status == []
      retries: 10
      delay: 10

  always:
  # CLEANUP
  - name: Remove test schemas even when a test fails
    cisco.mso.mso_schema:
      <<: *mso_info
      schema: '{{ item }}'
      state: absent
    loop:
    - '{{ mso_test.schema_2 }}'
    - '{{ mso_test.schema }}'
