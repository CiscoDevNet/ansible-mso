- name: Test that required ACI MultiSite variables are defined
  ansible.builtin.fail:
    msg: 'Please define mso_hostname, mso_username and mso_password.'
  when: mso_hostname is not defined or mso_username is not defined or mso_password is not defined

- name: Set test connection and fixture variables
  ansible.builtin.set_fact:
    mso_info: &mso_info
      host: '{{ mso_hostname }}'
      username: '{{ mso_username }}'
      password: '{{ mso_password }}'
      validate_certs: '{{ mso_validate_certs | default(false) }}'
      use_ssl: '{{ mso_use_ssl | default(true) }}'
      use_proxy: '{{ mso_use_proxy | default(true) }}'
      output_level: debug
    mso_test:
      schema: '{{ mso_schema_template_anp_esg_contract | default(mso_schema | default("ansible_test")) }}'
      tenant: '{{ mso_tenant_template_anp_esg_contract | default(mso_tenant | default("ansible_test")) }}'
      template: ESG_contract_template
      spaced_template: ESG_ contract_ template
      anp: ESG_contract_ANP
      vrf: ESG_contract_VRF
      esg: ESG_contract_ESG
      filter: ESG_contract_filter
      contract_1: ESG_contract_1
      contract_2: ESG_contract_2

- name: Query NDO version
  cisco.mso.mso_version:
    <<: *mso_info
    state: query
  register: version

- name: Exercise mso_schema_template_anp_esg_contract
  when: version.current.version is version('5.1', '>=')
  block:

  # CLEAN ENVIRONMENT
  # The ansible_test tenant is created by the mso_setup_tenant_site setup target.
  - name: Remove test schema before testing
    cisco.mso.mso_schema:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      state: absent

  - name: Ensure schema and template exist
    cisco.mso.mso_schema_template:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      tenant: '{{ mso_test.tenant }}'
      template: '{{ mso_test.template }}'
      state: present

  - name: Ensure the template ANP exists
    cisco.mso.mso_schema_template_anp:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      state: present

  - name: Ensure the ESG VRF exists
    cisco.mso.mso_schema_template_vrf:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      vrf: '{{ mso_test.vrf }}'
      state: present

  - name: Ensure the ESG exists
    cisco.mso.mso_schema_template_anp_esg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      vrf:
        name: '{{ mso_test.vrf }}'
      state: present

  - name: Ensure the contract filter exists
    cisco.mso.mso_schema_template_filter_entry:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      filter: '{{ mso_test.filter }}'
      entry: ESG_contract_filter_entry
      state: present

  - name: Ensure the referenced contracts exist
    cisco.mso.mso_schema_template_contract_filter:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      contract: '{{ item }}'
      filter: '{{ mso_test.filter }}'
      state: present
    loop:
    - '{{ mso_test.contract_1 }}'
    - '{{ mso_test.contract_2 }}'

  # CREATE
  - name: Create ESG consumer contract relationship in check mode
    cisco.mso.mso_schema_template_anp_esg_contract: &contract_1_present
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      contract:
        name: '{{ mso_test.contract_1 }}'
        type: consumer
      state: present
    check_mode: true
    register: cm_create_contract

  - name: Create ESG consumer contract relationship
    cisco.mso.mso_schema_template_anp_esg_contract:
      <<: *contract_1_present
    register: nm_create_contract

  - name: Create ESG consumer contract relationship again
    cisco.mso.mso_schema_template_anp_esg_contract:
      <<: *contract_1_present
    register: nm_create_contract_again

  - name: Verify ESG contract creation and idempotency
    ansible.builtin.assert:
      that:
      - cm_create_contract is changed
      - nm_create_contract is changed
      - nm_create_contract_again is not changed
      - cm_create_contract.previous == {}
      - cm_create_contract.proposed.relationshipType == 'consumer'
      - cm_create_contract.proposed.contractRef.contractName == mso_test.contract_1
      - cm_create_contract.proposed.contractRef.templateName == mso_test.template
      - cm_create_contract.proposed.contractRef.schemaId | length > 0
      - cm_create_contract.current == cm_create_contract.proposed
      - nm_create_contract.previous == cm_create_contract.previous
      - nm_create_contract.proposed == cm_create_contract.proposed
      - nm_create_contract.current == nm_create_contract.proposed
      - nm_create_contract_again.previous == nm_create_contract_again.current
      - nm_create_contract_again.proposed == nm_create_contract.proposed
      - nm_create_contract_again.current == nm_create_contract.current

  # QUERY
  # These relationships have no mutable attributes; their entire payload is their identity.
  - name: Create the same ESG contract as provider with an explicit current reference context
    cisco.mso.mso_schema_template_anp_esg_contract:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      contract:
        name: '{{ mso_test.contract_1 }}'
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template }}'
        type: provider
      state: present
    register: nm_create_provider_contract

  - name: Create a third ESG contract relationship with a spaced reference template
    cisco.mso.mso_schema_template_anp_esg_contract:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      contract:
        name: '{{ mso_test.contract_2 }}'
        template: '{{ mso_test.spaced_template }}'
        type: consumer
      state: present
    register: nm_create_second_contract

  - name: Query an ESG contract relationship with an explicit current reference context
    cisco.mso.mso_schema_template_anp_esg_contract:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      contract:
        name: '{{ mso_test.contract_1 }}'
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.spaced_template }}'
        type: consumer
      state: query
    register: nm_query_contract

  - name: Query all ESG contract relationships
    cisco.mso.mso_schema_template_anp_esg_contract:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      state: query
    register: nm_query_all_contracts

  - name: Verify specific and collection ESG contract queries
    vars:
      expected_provider:
        relationshipType: provider
        contractRef: '{{ nm_create_contract.current.contractRef }}'
      expected_second_contract:
        relationshipType: consumer
        contractRef:
          contractName: '{{ mso_test.contract_2 }}'
          schemaId: '{{ nm_create_contract.current.contractRef.schemaId }}'
          templateName: '{{ mso_test.template }}'
    ansible.builtin.assert:
      that:
      - nm_query_contract is not changed
      - nm_query_contract.current == nm_create_contract_again.current
      - nm_create_provider_contract is changed
      - nm_create_provider_contract.previous == {}
      - nm_create_provider_contract.proposed == nm_create_provider_contract.current == expected_provider
      - nm_create_second_contract is changed
      - nm_create_second_contract.previous == {}
      - nm_create_second_contract.proposed == nm_create_second_contract.current == expected_second_contract
      - nm_query_all_contracts is not changed
      - nm_query_all_contracts.current | length == 3
      - nm_query_all_contracts.current | select('equalto', nm_create_contract.current) | list | length == 1
      - nm_query_all_contracts.current | select('equalto', expected_provider) | list | length == 1
      - nm_query_all_contracts.current | select('equalto', expected_second_contract) | list | length == 1

  # ERROR HANDLING
  - name: Query a missing ESG contract relationship in check mode
    cisco.mso.mso_schema_template_anp_esg_contract:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      contract:
        name: missing_contract
        type: consumer
      state: query
    check_mode: true
    register: cm_missing_contract
    ignore_errors: true

  - name: Query a contract for a missing ESG in check mode
    cisco.mso.mso_schema_template_anp_esg_contract:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: MissingESG
      state: query
    check_mode: true
    register: cm_missing_esg
    ignore_errors: true

  - name: Query contracts for a missing schema in check mode
    cisco.mso.mso_schema_template_anp_esg_contract:
      <<: *mso_info
      schema: MissingSchema
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      state: query
    check_mode: true
    register: cm_missing_schema
    ignore_errors: true

  - name: Query contracts for a missing template in check mode
    cisco.mso.mso_schema_template_anp_esg_contract:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: MissingTemplate
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      state: query
    check_mode: true
    register: cm_missing_template
    ignore_errors: true

  - name: Query contracts for a missing ANP in check mode
    cisco.mso.mso_schema_template_anp_esg_contract:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: MissingANP
      esg: '{{ mso_test.esg }}'
      state: query
    check_mode: true
    register: cm_missing_anp
    ignore_errors: true

  - name: Query an ESG contract with a missing referenced schema in check mode
    cisco.mso.mso_schema_template_anp_esg_contract:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      contract:
        name: '{{ mso_test.contract_1 }}'
        schema: MissingReferenceSchema
        type: consumer
      state: query
    check_mode: true
    register: cm_missing_reference_schema
    ignore_errors: true

  - name: Reject a present relationship without a contract in check mode
    cisco.mso.mso_schema_template_anp_esg_contract:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      state: present
    check_mode: true
    register: cm_missing_contract_present
    ignore_errors: true

  - name: Reject an absent relationship without a contract in check mode
    cisco.mso.mso_schema_template_anp_esg_contract:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      state: absent
    check_mode: true
    register: cm_missing_contract_absent
    ignore_errors: true

  - name: Reject a partial query identity without a relationship type in check mode
    cisco.mso.mso_schema_template_anp_esg_contract:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      contract:
        name: '{{ mso_test.contract_1 }}'
      state: query
    check_mode: true
    register: cm_missing_contract_type
    ignore_errors: true

  - name: Reject a partial query identity without a contract name in check mode
    cisco.mso.mso_schema_template_anp_esg_contract:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      contract:
        type: consumer
      state: query
    check_mode: true
    register: cm_missing_contract_name
    ignore_errors: true

  - name: Reject an invalid ESG contract relationship type in check mode
    cisco.mso.mso_schema_template_anp_esg_contract:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      contract:
        name: '{{ mso_test.contract_1 }}'
        type: invalid
      state: present
    check_mode: true
    register: cm_invalid_contract_type
    ignore_errors: true

  - name: Verify ESG contract error handling
    vars:
      missing_reference_prefix: "Provided Contract Reference '"
      missing_reference_parts: >-
        {{ cm_missing_contract.msg.split("' with type 'consumer' not matching existing contract(s): ", 1) }}
      expected_missing_reference: "{{ nm_create_contract.current.contractRef | combine({'contractName': 'missing_contract'}) }}"
      expected_existing_references:
      - "{{ nm_create_contract.current.contractRef }}"
      - consumer
      - "{{ nm_create_provider_contract.current.contractRef }}"
      - provider
      - "{{ nm_create_second_contract.current.contractRef }}"
      - consumer
    ansible.builtin.assert:
      that:
      - cm_missing_contract is failed
      - missing_reference_parts | length == 2
      - missing_reference_parts[0].startswith(missing_reference_prefix)
      - missing_reference_parts[0] | replace(missing_reference_prefix, '', 1) | from_yaml == expected_missing_reference
      - missing_reference_parts[1] | from_yaml == expected_existing_references
      - cm_missing_esg is failed
      - "cm_missing_esg.msg == \"Provided ESG 'MissingESG' not matching existing ESG(s): ESG_contract_ESG\""
      - cm_missing_schema is failed
      - "cm_missing_schema.msg == \"Provided schema 'MissingSchema' does not exist.\""
      - cm_missing_template is failed
      - "cm_missing_template.msg == \"Provided template 'MissingTemplate' not matching existing template(s): ESG_contract_template\""
      - cm_missing_anp is failed
      - "cm_missing_anp.msg == \"Provided ANP 'MissingANP' not matching existing anp(s): ESG_contract_ANP\""
      - cm_missing_reference_schema is failed
      - "cm_missing_reference_schema.msg == \"Referenced schema 'MissingReferenceSchema' in contractref does not exist\""
      - cm_missing_contract_present is failed
      - "cm_missing_contract_present.msg == 'state is present but all of the following are missing: contract'"
      - cm_missing_contract_absent is failed
      - "cm_missing_contract_absent.msg == 'state is absent but all of the following are missing: contract'"
      - cm_missing_contract_type is failed
      - "cm_missing_contract_type.msg == 'missing required arguments: type found in contract'"
      - cm_missing_contract_name is failed
      - "cm_missing_contract_name.msg == 'missing required arguments: name found in contract'"
      - cm_invalid_contract_type is failed
      - "cm_invalid_contract_type.msg == 'value of type must be one of: consumer, provider, got: invalid found in contract'"

  # DELETE
  - name: Remove ESG consumer contract relationship in check mode
    cisco.mso.mso_schema_template_anp_esg_contract: &contract_1_absent
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      contract:
        name: '{{ mso_test.contract_1 }}'
        type: consumer
      state: absent
    check_mode: true
    register: cm_remove_contract

  - name: Remove ESG consumer contract relationship
    cisco.mso.mso_schema_template_anp_esg_contract:
      <<: *contract_1_absent
    register: nm_remove_contract

  - name: Remove ESG consumer contract relationship again
    cisco.mso.mso_schema_template_anp_esg_contract:
      <<: *contract_1_absent
    register: nm_remove_contract_again

  - name: Query remaining ESG contract relationships after removal
    cisco.mso.mso_schema_template_anp_esg_contract:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      esg: '{{ mso_test.esg }}'
      state: query
    register: nm_query_remaining_contracts

  - name: Verify ESG contract previous proposed and current state after removal
    ansible.builtin.assert:
      that:
      - cm_remove_contract is changed
      - nm_remove_contract is changed
      - nm_remove_contract_again is not changed
      - cm_remove_contract.previous == nm_create_contract.current
      - cm_remove_contract.proposed == cm_remove_contract.current == {}
      - nm_remove_contract.previous == cm_remove_contract.previous
      - nm_remove_contract.proposed == nm_remove_contract.current == {}
      - nm_remove_contract_again.previous == nm_remove_contract_again.proposed == nm_remove_contract_again.current == {}
      - nm_query_remaining_contracts is not changed
      - nm_query_remaining_contracts.current | length == 2
      - nm_create_provider_contract.current in nm_query_remaining_contracts.current
      - nm_create_second_contract.current in nm_query_remaining_contracts.current

  always:
  # CLEANUP
  - name: Remove test schema even when a test fails
    cisco.mso.mso_schema:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      state: absent
