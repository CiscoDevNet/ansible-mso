- name: Test that we have an ACI MultiSite host, username and password
  ansible.builtin.fail:
    msg: 'Please define the following variables: mso_hostname, mso_username and mso_password.'
  when: mso_hostname is not defined or mso_username is not defined or mso_password is not defined

- name: Set test connection and fixture variables
  ansible.builtin.set_fact:
    mso_info: &mso_info
      host: '{{ mso_hostname }}'
      username: '{{ mso_username }}'
      password: '{{ mso_password }}'
      validate_certs: '{{ mso_validate_certs | default(false) }}'
      use_ssl: '{{ mso_use_ssl | default(true) }}'
      use_proxy: '{{ mso_use_proxy | default(true) }}'
      output_level: '{{ mso_output_level | default("debug") }}'
    mso_test:
      template: ansible_fabric_policy_template
      mcp_global_policy:
        name: ansible_mcp_global_policy
        defaults:
          description: ""
          admin_state: disabled
          per_vlan: false
          loop_detection_factor: 3
          port_disable: true
          initial_delay_time: 180
          transmission_frequency_sec: 2
          transmission_frequency_msec: 0
        updated:
          name: ansible_mcp_global_policy_new
          description: A Global MCP Policy
          key: cisco
          admin_state: enabled
          per_vlan: enabled
          loop_detection_factor: 4
          port_disable: disabled
          initial_delay_time: 200
          transmission_frequency_sec: 3
          transmission_frequency_msec: 10
      mcp_global_policy_2:
        name: ansible_mcp_global_policy_again
        description: An MCP Global policy to delete with UUID

- name: Exercise ndo_mcp_global_policy
  block:
    - name: Remove fabric template
      cisco.mso.ndo_template: &template_absent
        <<: *mso_info
        name: '{{ mso_test.template }}'
        type: fabric_policy
        state: absent

    - name: Create a fabric template
      cisco.mso.ndo_template:
        <<: *template_absent
        state: present

    # CREATE
    - name: Create the MCP Global Policy (check mode)
      cisco.mso.ndo_mcp_global_policy: &add_mcp_global_policy
        <<: *mso_info
        template: '{{ mso_test.template }}'
        name: '{{ mso_test.mcp_global_policy.name }}'
        state: present
      check_mode: true
      register: cm_add_mcp_global_policy

    - name: Create the MCP Global Policy
      cisco.mso.ndo_mcp_global_policy:
        <<: *add_mcp_global_policy
      register: nm_add_mcp_global_policy

    - name: Create the MCP Global Policy again
      cisco.mso.ndo_mcp_global_policy:
        <<: *add_mcp_global_policy
      register: nm_add_mcp_global_policy_again

    - name: Assert the MCP Global Policy was created
      ansible.builtin.assert:
        that:
          - cm_add_mcp_global_policy is changed
          - nm_add_mcp_global_policy is changed
          - cm_add_mcp_global_policy.previous == nm_add_mcp_global_policy.previous == {}
          - cm_add_mcp_global_policy.current == cm_add_mcp_global_policy.proposed
          - cm_add_mcp_global_policy.current.name == nm_add_mcp_global_policy.current.name == mso_test.mcp_global_policy.name
          - nm_add_mcp_global_policy.current.description == mso_test.mcp_global_policy.defaults.description
          - nm_add_mcp_global_policy.current.adminState == mso_test.mcp_global_policy.defaults.admin_state
          - nm_add_mcp_global_policy.current.enablePduPerVlan == mso_test.mcp_global_policy.defaults.per_vlan
          - nm_add_mcp_global_policy.current.loopDetectMultFactor == mso_test.mcp_global_policy.defaults.loop_detection_factor
          - nm_add_mcp_global_policy.current.protectPortDisable == mso_test.mcp_global_policy.defaults.port_disable
          - nm_add_mcp_global_policy.current.initialDelayTime == mso_test.mcp_global_policy.defaults.initial_delay_time
          - nm_add_mcp_global_policy.current.txFreq == mso_test.mcp_global_policy.defaults.transmission_frequency_sec
          - nm_add_mcp_global_policy.current.txFreqMsec == mso_test.mcp_global_policy.defaults.transmission_frequency_msec
          - nm_add_mcp_global_policy.current.uuid is defined
          - (nm_add_mcp_global_policy.current.key | default(none)) in [none, "VALUE_SPECIFIED_IN_NO_LOG_PARAMETER"]
          - nm_add_mcp_global_policy_again is not changed
          - nm_add_mcp_global_policy_again.previous.name == nm_add_mcp_global_policy_again.current.name == mso_test.mcp_global_policy.name
          - nm_add_mcp_global_policy_again.previous.description == nm_add_mcp_global_policy.current.description == mso_test.mcp_global_policy.defaults.description
          - nm_add_mcp_global_policy_again.previous.adminState == nm_add_mcp_global_policy.current.adminState == mso_test.mcp_global_policy.defaults.admin_state
          - nm_add_mcp_global_policy_again.previous.enablePduPerVlan == nm_add_mcp_global_policy.current.enablePduPerVlan == mso_test.mcp_global_policy.defaults.per_vlan
          - nm_add_mcp_global_policy_again.previous.loopDetectMultFactor == nm_add_mcp_global_policy.current.loopDetectMultFactor == mso_test.mcp_global_policy.defaults.loop_detection_factor
          - nm_add_mcp_global_policy_again.previous.protectPortDisable == nm_add_mcp_global_policy.current.protectPortDisable == mso_test.mcp_global_policy.defaults.port_disable
          - nm_add_mcp_global_policy_again.previous.initialDelayTime == nm_add_mcp_global_policy.current.initialDelayTime == mso_test.mcp_global_policy.defaults.initial_delay_time
          - nm_add_mcp_global_policy_again.previous.txFreq == nm_add_mcp_global_policy.current.txFreq == mso_test.mcp_global_policy.defaults.transmission_frequency_sec
          - nm_add_mcp_global_policy_again.previous.txFreqMsec == nm_add_mcp_global_policy.current.txFreqMsec == mso_test.mcp_global_policy.defaults.transmission_frequency_msec
          - nm_add_mcp_global_policy_again.previous.uuid is defined
          - nm_add_mcp_global_policy_again.current.uuid is defined

    # Update
    - name: Update the MCP Global Policy (check mode)
      cisco.mso.ndo_mcp_global_policy: &update_mcp_global_policy
        <<: *mso_info
        template: '{{ mso_test.template }}'
        name: '{{ mso_test.mcp_global_policy.updated.name }}'
        description: '{{ mso_test.mcp_global_policy.updated.description }}'
        key: '{{ mso_test.mcp_global_policy.updated.key }}'
        admin_state: '{{ mso_test.mcp_global_policy.updated.admin_state }}'
        per_vlan: '{{ mso_test.mcp_global_policy.updated.per_vlan }}'
        loop_detection_factor: '{{ mso_test.mcp_global_policy.updated.loop_detection_factor }}'
        port_disable: '{{ mso_test.mcp_global_policy.updated.port_disable }}'
        initial_delay_time: '{{ mso_test.mcp_global_policy.updated.initial_delay_time }}'
        transmission_frequency_sec: '{{ mso_test.mcp_global_policy.updated.transmission_frequency_sec }}'
        transmission_frequency_msec: '{{ mso_test.mcp_global_policy.updated.transmission_frequency_msec }}'
        state: present
      check_mode: true
      register: cm_update_mcp_global_policy

    - name: Update the MCP Global Policy
      cisco.mso.ndo_mcp_global_policy:
        <<: *update_mcp_global_policy
      register: nm_update_mcp_global_policy

    - name: Update the MCP Global Policy again
      cisco.mso.ndo_mcp_global_policy:
        <<: *update_mcp_global_policy
      register: update_mcp_global_policy_again

    - name: Update the MCP Global Policy with incorrect UUID
      cisco.mso.ndo_mcp_global_policy:
        <<: *update_mcp_global_policy
        uuid: bad-uuid
      ignore_errors: true
      register: nm_update_mcp_global_policy_no_uuid

    - name: Set error message for bad_uuid
      ansible.builtin.set_fact:
        error_message_bad_uuid: "MCP Global Policy with the UUID: 'bad-uuid' not found"

    - name: Assert the MCP Global Policy updated
      ansible.builtin.assert:
        that:
          - cm_update_mcp_global_policy is changed
          - nm_update_mcp_global_policy is changed
          - cm_update_mcp_global_policy.previous == nm_update_mcp_global_policy.previous
          - cm_update_mcp_global_policy.previous.name == nm_update_mcp_global_policy.previous.name == mso_test.mcp_global_policy.name
          - cm_update_mcp_global_policy.previous.adminState == nm_update_mcp_global_policy.previous.adminState == mso_test.mcp_global_policy.defaults.admin_state
          - cm_update_mcp_global_policy.previous.description == nm_update_mcp_global_policy.previous.description == mso_test.mcp_global_policy.defaults.description
          - cm_update_mcp_global_policy.previous.enablePduPerVlan == nm_update_mcp_global_policy.previous.enablePduPerVlan == mso_test.mcp_global_policy.defaults.per_vlan
          # The initial policy has no configured key. Depending on the NDO version, the API either omits the key or returns a
          # masked placeholder, which the module converts to Ansible's sensitive-value marker.
          - (cm_update_mcp_global_policy.previous.key | default(none)) in [none, "VALUE_SPECIFIED_IN_NO_LOG_PARAMETER"]
          - (nm_update_mcp_global_policy.previous.key | default(none)) in [none, "VALUE_SPECIFIED_IN_NO_LOG_PARAMETER"]
          - cm_update_mcp_global_policy.previous.loopDetectMultFactor == nm_update_mcp_global_policy.previous.loopDetectMultFactor == mso_test.mcp_global_policy.defaults.loop_detection_factor
          - cm_update_mcp_global_policy.previous.protectPortDisable == nm_update_mcp_global_policy.previous.protectPortDisable == mso_test.mcp_global_policy.defaults.port_disable
          - cm_update_mcp_global_policy.previous.txFreq == nm_update_mcp_global_policy.previous.txFreq == mso_test.mcp_global_policy.defaults.transmission_frequency_sec
          - cm_update_mcp_global_policy.previous.txFreqMsec == nm_update_mcp_global_policy.previous.txFreqMsec == mso_test.mcp_global_policy.defaults.transmission_frequency_msec
          - cm_update_mcp_global_policy.current == cm_update_mcp_global_policy.proposed
          - cm_update_mcp_global_policy.current.name == nm_update_mcp_global_policy.current.name == mso_test.mcp_global_policy.updated.name
          - cm_update_mcp_global_policy.current.adminState == nm_update_mcp_global_policy.current.adminState == mso_test.mcp_global_policy.updated.admin_state
          - cm_update_mcp_global_policy.current.description == nm_update_mcp_global_policy.current.description == mso_test.mcp_global_policy.updated.description
          - cm_update_mcp_global_policy.current.enablePduPerVlan == nm_update_mcp_global_policy.current.enablePduPerVlan == true
          - cm_update_mcp_global_policy.current.key == "VALUE_SPECIFIED_IN_NO_LOG_PARAMETER"
          - nm_update_mcp_global_policy.current.key == "VALUE_SPECIFIED_IN_NO_LOG_PARAMETER"
          - cm_update_mcp_global_policy.current.loopDetectMultFactor == nm_update_mcp_global_policy.current.loopDetectMultFactor == mso_test.mcp_global_policy.updated.loop_detection_factor
          - cm_update_mcp_global_policy.current.protectPortDisable == nm_update_mcp_global_policy.current.protectPortDisable == false
          - cm_update_mcp_global_policy.current.txFreq == nm_update_mcp_global_policy.current.txFreq == mso_test.mcp_global_policy.updated.transmission_frequency_sec
          - cm_update_mcp_global_policy.current.txFreqMsec == nm_update_mcp_global_policy.current.txFreqMsec == mso_test.mcp_global_policy.updated.transmission_frequency_msec
          - update_mcp_global_policy_again is not changed
          - update_mcp_global_policy_again.previous == update_mcp_global_policy_again.current
          - nm_update_mcp_global_policy_no_uuid is failed
          - nm_update_mcp_global_policy_no_uuid.msg == error_message_bad_uuid

    # QUERY
    - name: Query the MCP Global Policy with name
      cisco.mso.ndo_mcp_global_policy:
        <<: *mso_info
        template: '{{ mso_test.template }}'
        name: '{{ mso_test.mcp_global_policy.updated.name }}'
        state: query
      register: query_mcp_policy_with_name

    - name: Query the MCP Global Policy with UUID
      cisco.mso.ndo_mcp_global_policy:
        <<: *mso_info
        template: '{{ mso_test.template }}'
        uuid: '{{ update_mcp_global_policy_again.current.uuid }}'
        state: query
      register: query_mcp_policy_with_uuid

    - name: Query the MCP Global Policy without name or UUID
      cisco.mso.ndo_mcp_global_policy: &query_mcp_global_policy
        <<: *mso_info
        template: '{{ mso_test.template }}'
        state: query
      register: query_all_mcp_policy

    - name: Assert MCP Global Policy is queried
      ansible.builtin.assert:
        that:
          - query_mcp_policy_with_name is not changed
          - query_mcp_policy_with_uuid is not changed
          - query_all_mcp_policy is not changed
          - query_mcp_policy_with_uuid.current == query_mcp_policy_with_name.current
          - query_mcp_policy_with_name.current.name == mso_test.mcp_global_policy.updated.name
          - query_mcp_policy_with_name.current.key == "VALUE_SPECIFIED_IN_NO_LOG_PARAMETER"
          - query_all_mcp_policy.current[0].key == "VALUE_SPECIFIED_IN_NO_LOG_PARAMETER"
          - query_mcp_policy_with_name.current.description == mso_test.mcp_global_policy.updated.description
          - query_mcp_policy_with_name.current.adminState == mso_test.mcp_global_policy.updated.admin_state
          - query_mcp_policy_with_name.current.enablePduPerVlan == true
          - query_mcp_policy_with_name.current.protectPortDisable == false
          - query_mcp_policy_with_name.current.loopDetectMultFactor == mso_test.mcp_global_policy.updated.loop_detection_factor
          - query_mcp_policy_with_name.current.txFreq == mso_test.mcp_global_policy.updated.transmission_frequency_sec
          - query_mcp_policy_with_name.current.txFreqMsec == mso_test.mcp_global_policy.updated.transmission_frequency_msec
          - query_mcp_policy_with_name.current.uuid is defined
          - query_all_mcp_policy.current | length == 1 # Can only be one

    # DELETE
    - name: Delete MCP Global Policy with name (check mode)
      cisco.mso.ndo_mcp_global_policy: &delete_mcp_global_policy
        <<: *mso_info
        template: '{{ mso_test.template }}'
        name: '{{ mso_test.mcp_global_policy.updated.name }}'
        state: absent
      check_mode: true
      register: cm_delete_mcp_global_policy

    - name: Delete MCP Global Policy with name
      cisco.mso.ndo_mcp_global_policy:
        <<: *delete_mcp_global_policy
      register: nm_delete_mcp_global_policy

    - name: Delete MCP Global Policy with name again
      cisco.mso.ndo_mcp_global_policy:
        <<: *delete_mcp_global_policy
      register: nm_delete_mcp_global_policy_again

    - name: Assert that the MCP Global Policy was deleted with name
      ansible.builtin.assert:
        that:
          - cm_delete_mcp_global_policy is changed
          - nm_delete_mcp_global_policy is changed
          - cm_delete_mcp_global_policy.current == nm_delete_mcp_global_policy.current == {}
          - cm_delete_mcp_global_policy.previous.name == nm_delete_mcp_global_policy.previous.name == mso_test.mcp_global_policy.updated.name
          - cm_delete_mcp_global_policy.previous.key == "VALUE_SPECIFIED_IN_NO_LOG_PARAMETER"
          - nm_delete_mcp_global_policy.previous.key == "VALUE_SPECIFIED_IN_NO_LOG_PARAMETER"
          - cm_delete_mcp_global_policy.previous.description == nm_delete_mcp_global_policy.previous.description == mso_test.mcp_global_policy.updated.description
          - nm_delete_mcp_global_policy.previous.uuid is defined
          - nm_delete_mcp_global_policy_again is not changed
          - nm_delete_mcp_global_policy_again.previous == nm_delete_mcp_global_policy_again.current == {}

    - name: Create the MCP Global Policy
      cisco.mso.ndo_mcp_global_policy:
        <<: *add_mcp_global_policy
        name: '{{ mso_test.mcp_global_policy_2.name }}'
        description: '{{ mso_test.mcp_global_policy_2.description }}'
      register: new_mcp_global_policy

    - name: Delete the MCP Global Policy with UUID
      cisco.mso.ndo_mcp_global_policy:
        <<: *mso_info
        template: '{{ mso_test.template }}'
        uuid: '{{ new_mcp_global_policy.current.uuid }}'
        state: absent
      register: nm_delete_mcp_global_policy_uuid

    - name: Assert that the MCP Global Policy was deleted with UUID
      ansible.builtin.assert:
        that:
          - nm_delete_mcp_global_policy_uuid is changed
          - nm_delete_mcp_global_policy_uuid.previous.uuid is defined
          - nm_delete_mcp_global_policy_uuid.previous.name == mso_test.mcp_global_policy_2.name
          - nm_delete_mcp_global_policy_uuid.previous.description == mso_test.mcp_global_policy_2.description
          - nm_delete_mcp_global_policy_uuid.current == {}

    # Errors and no policy found
    - name: Query the MCP Global Policy in the template when its deleted
      cisco.mso.ndo_mcp_global_policy:
        <<: *query_mcp_global_policy
      register: query_none

    - name: Create the MCP Global Policy with a UUID
      cisco.mso.ndo_mcp_global_policy:
        <<: *mso_info
        template: '{{ mso_test.template }}'
        uuid: not-possible
        state: present
      ignore_errors: true
      register: create_with_uuid

    - name: Create the MCP Global Policy
      cisco.mso.ndo_mcp_global_policy:
        <<: *add_mcp_global_policy

    - name: Update the MCP Global Policy with incorrect UUID
      cisco.mso.ndo_mcp_global_policy:
        <<: *mso_info
        template: '{{ mso_test.template }}'
        uuid: non-existing-uuid
        state: present
      ignore_errors: true
      register: update_non_existing_uuid

    - name: Delete the MCP Global Policy with incorrect UUID
      cisco.mso.ndo_mcp_global_policy:
        <<: *mso_info
        template: '{{ mso_test.template }}'
        uuid: does-not-exist
        state: absent
      ignore_errors: true
      register: delete_non_existing_uuid

    - name: Delete the MCP Global Policy
      cisco.mso.ndo_mcp_global_policy:
        <<: *add_mcp_global_policy
        state: absent

    - name: Set error message for non_existing_uuid
      ansible.builtin.set_fact:
        error_message_non_existing_uuid: "MCP Global Policy with the UUID: 'non-existing-uuid' not found"
        error_message_non_existing_uuid_delete: "MCP Global Policy with the UUID: 'does-not-exist' not found"

    - name: Assert errors and no MCP Global Policy found
      ansible.builtin.assert:
        that:
          - query_none is not changed
          - query_none.current == {}
          - update_non_existing_uuid is failed
          - update_non_existing_uuid.msg == error_message_non_existing_uuid
          - delete_non_existing_uuid is failed
          - delete_non_existing_uuid.msg == error_message_non_existing_uuid_delete
          - create_with_uuid is failed
          - create_with_uuid.msg == "MCP Global Policy cannot be created with a UUID"

  always:
    # CLEANUP
    - name: Remove test fabric policy template even when a test fails
      cisco.mso.ndo_template:
        <<: *template_absent
      ignore_errors: true
