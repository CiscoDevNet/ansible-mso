- name: Test that we have an ACI MultiSite host, username and password
  ansible.builtin.fail:
    msg: "Please define the following variables: mso_hostname, mso_username and mso_password."
  when: mso_hostname is not defined or mso_username is not defined or mso_password is not defined

- name: Set test connection and fixture variables
  ansible.builtin.set_fact:
    mso_info: &mso_info
      host: "{{ mso_hostname }}"
      username: "{{ mso_username }}"
      password: "{{ mso_password }}"
      validate_certs: "{{ mso_validate_certs | default(false) }}"
      use_ssl: "{{ mso_use_ssl | default(true) }}"
      use_proxy: "{{ mso_use_proxy | default(false) }}"
      output_level: '{{ mso_output_level | default("debug") }}'
    mso_test:
      schema: '{{ mso_schema_template_service_graph | default(mso_schema | default("ansible_test")) }}'
      tenant: '{{ mso_tenant_schema_template_service_graph | default(mso_tenant | default("ansible_test")) }}'
      template: Template1
      template_with_spaces: Template 1
      service_graph:
        name: SG1
        display_name: sg
        service_nodes:
          - type: firewall
          - type: load-balancer
          - type: other
      service_graph_2:
        name: SG2
        display_name: Service_Graph2
        service_nodes:
          - type: firewall
          - type: load-balancer
        updated:
          display_name: Service_Graph_changed
      service_graph_3:
        name: SG3
        service_nodes:
          - type: firewall
        updated:
          service_nodes:
            - type: firewall
            - type: other
        reordered:
          service_nodes:
            - type: other
            - type: firewall
      service_graph_4:
        name: SG4
      filters:
        allow_all:
          input: allow_all
          api: allow-all
        filters_from_contract:
          input: filters_from_contract
          api: filters-from-contract
      node_names:
        - node1
        - node2
        - node3
      expected_service_graph_count: 3
      non_existing:
        schema: non_existing_schema
        template: non_existing_template
        service_graph: non_existent
        lookup_service_graph: SG
        service_node_type: non_existing_type

- name: Exercise mso_schema_template_service_graph
  block:

  # CLEAN ENVIRONMENT
  - name: Remove test schema before testing
    cisco.mso.mso_schema: &schema_absent
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      state: absent

  - name: Ensure test tenant exists
    cisco.mso.mso_tenant:
      <<: *mso_info
      tenant: '{{ mso_test.tenant }}'
      users:
        - '{{ mso_username }}'
      state: present

  - name: Ensure test schema and template exist
    cisco.mso.mso_schema_template:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      tenant: '{{ mso_test.tenant }}'
      template: '{{ mso_test.template }}'
      state: present

  - name: Create a service graph (check mode)
    cisco.mso.mso_schema_template_service_graph:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      service_graph: '{{ mso_test.service_graph.name }}'
      display_name: '{{ mso_test.service_graph.display_name }}'
      service_nodes: '{{ mso_test.service_graph.service_nodes }}'
      filter_after_first_node: '{{ mso_test.filters.allow_all.input }}'
      state: present
    register: sg1_cm
    check_mode: true

  - name: Verify sg1_cm
    ansible.builtin.assert:
      that:
        - sg1_cm is changed
        - sg1_cm.current.name == mso_test.service_graph.name
        - sg1_cm.current.displayName == mso_test.service_graph.display_name
        - sg1_cm.current.nodeFilter == mso_test.filters.allow_all.api
        - sg1_cm.current.serviceGraphRef.templateName == mso_test.template
        - sg1_cm.current.serviceNodes | length == mso_test.service_graph.service_nodes | length
        - sg1_cm.current.serviceNodes.0.name == mso_test.node_names.0
        - sg1_cm.current.serviceNodes.1.name == mso_test.node_names.1
        - sg1_cm.current.serviceNodes.2.name == mso_test.node_names.2

  - name: Create a service graph (normal mode)
    cisco.mso.mso_schema_template_service_graph:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      service_graph: '{{ mso_test.service_graph.name }}'
      display_name: '{{ mso_test.service_graph.display_name }}'
      service_nodes: '{{ mso_test.service_graph.service_nodes }}'
      filter_after_first_node: '{{ mso_test.filters.allow_all.input }}'
      state: present
    register: sg1

  - name: Create service graph again
    cisco.mso.mso_schema_template_service_graph:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      service_graph: '{{ mso_test.service_graph.name }}'
      display_name: '{{ mso_test.service_graph.display_name }}'
      service_nodes: '{{ mso_test.service_graph.service_nodes }}'
      filter_after_first_node: '{{ mso_test.filters.allow_all.input }}'
      state: present
    register: sg1_again

  - name: Verify sg1 and sg1_again
    ansible.builtin.assert:
      that:
        - sg1 is changed
        - sg1_again is not changed
        - sg1.current.name == mso_test.service_graph.name
        - sg1.current.displayName == mso_test.service_graph.display_name
        - sg1.current.nodeFilter == mso_test.filters.allow_all.api
        - sg1.current.serviceGraphRef.templateName == mso_test.template
        - sg1.current.serviceNodes | length == mso_test.service_graph.service_nodes | length
        - sg1.current.serviceNodes.0.name == mso_test.node_names.0
        - sg1.current.serviceNodes.1.name == mso_test.node_names.1
        - sg1.current.serviceNodes.2.name == mso_test.node_names.2
        - sg1_again.current.name == mso_test.service_graph.name
        - sg1_again.current.displayName == mso_test.service_graph.display_name
        - sg1_again.current.nodeFilter == mso_test.filters.allow_all.api
        - sg1_again.current.serviceGraphRef.templateName == mso_test.template
        - sg1_again.current.serviceNodes | length == mso_test.service_graph.service_nodes | length
        - sg1_again.current.serviceNodes.0.name == mso_test.node_names.0
        - sg1_again.current.serviceNodes.1.name == mso_test.node_names.1
        - sg1_again.current.serviceNodes.2.name == mso_test.node_names.2

  - name: Create another service graph SG2
    cisco.mso.mso_schema_template_service_graph:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      service_graph: '{{ mso_test.service_graph_2.name }}'
      display_name: '{{ mso_test.service_graph_2.display_name }}'
      service_nodes: '{{ mso_test.service_graph_2.service_nodes }}'
      filter_after_first_node: '{{ mso_test.filters.filters_from_contract.input }}'
      state: present
    register: sg2

  - name: Verify sg2
    ansible.builtin.assert:
      that:
        - sg2 is changed
        - sg2.current.name == mso_test.service_graph_2.name
        - sg2.current.displayName == mso_test.service_graph_2.display_name
        - sg2.current.nodeFilter == mso_test.filters.filters_from_contract.api
        - sg2.current.serviceGraphRef.templateName == mso_test.template
        - sg2.current.serviceNodes | length == mso_test.service_graph_2.service_nodes | length
        - sg2.current.serviceNodes.0.name == mso_test.node_names.0
        - sg2.current.serviceNodes.1.name == mso_test.node_names.1

  - name: Change Service Graph SG2
    cisco.mso.mso_schema_template_service_graph:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      service_graph: '{{ mso_test.service_graph_2.name }}'
      display_name: '{{ mso_test.service_graph_2.updated.display_name }}'
      service_nodes: '{{ mso_test.service_graph_2.service_nodes }}'
      filter_after_first_node: '{{ mso_test.filters.filters_from_contract.input }}'
      state: present
    register: sg2_change

  - name: Verify sg2_change
    ansible.builtin.assert:
      that:
        - sg2_change is changed
        - sg2_change.current.name == mso_test.service_graph_2.name
        - sg2_change.current.displayName == mso_test.service_graph_2.updated.display_name
        - sg2_change.current.nodeFilter == mso_test.filters.filters_from_contract.api
        - sg2_change.current.serviceGraphRef.templateName == mso_test.template
        - sg2_change.current.serviceNodes | length == mso_test.service_graph_2.service_nodes | length
        - sg2_change.current.serviceNodes.0.name == mso_test.node_names.0
        - sg2_change.current.serviceNodes.1.name == mso_test.node_names.1

  - name: Create another service graph with no display name
    cisco.mso.mso_schema_template_service_graph:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      service_graph: '{{ mso_test.service_graph_3.name }}'
      service_nodes: '{{ mso_test.service_graph_3.service_nodes }}'
      filter_after_first_node: '{{ mso_test.filters.filters_from_contract.input }}'
      state: present
    register: sg3

  - name: Verify sg3
    ansible.builtin.assert:
      that:
        - sg3 is changed
        - sg3.current.name == mso_test.service_graph_3.name
        - sg3.current.displayName == mso_test.service_graph_3.name
        - sg3.current.nodeFilter == mso_test.filters.filters_from_contract.api
        - sg3.current.serviceGraphRef.templateName == mso_test.template
        - sg3.current.serviceNodes.0.name == mso_test.node_names.0
        - sg3.current.serviceNodes | length == mso_test.service_graph_3.service_nodes | length

  - name: Create service graph SG3 with addition of new service node type
    cisco.mso.mso_schema_template_service_graph:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      service_graph: '{{ mso_test.service_graph_3.name }}'
      service_nodes: '{{ mso_test.service_graph_3.updated.service_nodes }}'
      filter_after_first_node: '{{ mso_test.filters.filters_from_contract.input }}'
      state: present
    register: sg3_other

  - name: Verify sg3_other
    ansible.builtin.assert:
      that:
        - sg3_other is changed
        - sg3_other.current.name == mso_test.service_graph_3.name
        - sg3_other.current.displayName == mso_test.service_graph_3.name
        - sg3_other.current.nodeFilter == mso_test.filters.filters_from_contract.api
        - sg3_other.current.serviceGraphRef.templateName == mso_test.template
        - sg3_other.current.serviceNodes.0.name == mso_test.node_names.0
        - sg3_other.current.serviceNodes.1.name == mso_test.node_names.1
        - sg3_other.current.serviceNodes | length == mso_test.service_graph_3.updated.service_nodes | length

  - name: Create service graph SG3 interchanging the index of service node types
    cisco.mso.mso_schema_template_service_graph:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      service_graph: '{{ mso_test.service_graph_3.name }}'
      service_nodes: '{{ mso_test.service_graph_3.reordered.service_nodes }}'
      filter_after_first_node: '{{ mso_test.filters.filters_from_contract.input }}'
      state: present
    register: sg3_interchange

  - name: Verify sg3_interchange
    ansible.builtin.assert:
      that:
        - sg3_interchange is changed
        - sg3_interchange.current.name == mso_test.service_graph_3.name
        - sg3_interchange.current.displayName == mso_test.service_graph_3.name
        - sg3_interchange.current.nodeFilter == mso_test.filters.filters_from_contract.api
        - sg3_interchange.current.serviceGraphRef.templateName == mso_test.template
        - sg3_interchange.current.serviceNodes.1.name == mso_test.node_names.1
        - sg3_interchange.current.serviceNodes.0.name == mso_test.node_names.0
        - sg3_interchange.current.serviceNodes | length == mso_test.service_graph_3.reordered.service_nodes | length

  - name: Create another service graph with non existing node type
    cisco.mso.mso_schema_template_service_graph:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      service_graph: '{{ mso_test.service_graph_4.name }}'
      service_nodes:
        - type: '{{ mso_test.non_existing.service_node_type }}'
      filter_after_first_node: '{{ mso_test.filters.filters_from_contract.input }}'
      state: present
    register: sg4
    ignore_errors: true

  - name: Verify sg4
    ansible.builtin.assert:
      that:
        - sg4.msg is match("Provided service node type '" ~ mso_test.non_existing.service_node_type ~ "' does not exist")

  - name: Query service graph SG
    cisco.mso.mso_schema_template_service_graph:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      service_graph: '{{ mso_test.service_graph.name }}'
      state: query
    register: query_sg

  - name: Verify query_sg
    ansible.builtin.assert:
      that:
        - query_sg is not changed
        - query_sg.current.name == mso_test.service_graph.name
        - query_sg.current.displayName == mso_test.service_graph.display_name
        - query_sg.current.nodeFilter == mso_test.filters.allow_all.api
        - query_sg.current.serviceNodes | length == mso_test.service_graph.service_nodes | length
        - query_sg.current.serviceNodes.0.name == mso_test.node_names.0
        - query_sg.current.serviceNodes.1.name == mso_test.node_names.1
        - query_sg.current.serviceNodes.2.name == mso_test.node_names.2

  - name: Query all service graphs
    cisco.mso.mso_schema_template_service_graph:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      state: query
    register: query_all

  - name: Verify query_all
    ansible.builtin.assert:
      that:
        - query_all is not changed
        - query_all.current | length == mso_test.expected_service_graph_count

  - name: Query non_existing service graph
    cisco.mso.mso_schema_template_service_graph:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template_with_spaces }}'
      service_graph: '{{ mso_test.non_existing.service_graph }}'
      state: query
    ignore_errors: true
    register: query_non_existing_sg

  - name: Verify query_non_existing_sg
    ansible.builtin.assert:
      that:
        - query_non_existing_sg.msg == "Service Graph '" ~ mso_test.non_existing.service_graph ~ "' not found"

  - name: Use non_existing schema
    cisco.mso.mso_schema_template_service_graph:
      <<: *mso_info
      schema: '{{ mso_test.non_existing.schema }}'
      template: '{{ mso_test.template }}'
      service_graph: '{{ mso_test.non_existing.lookup_service_graph }}'
      state: query
    ignore_errors: true
    register: query_non_existing_schema

  - name: Use non_existing template
    cisco.mso.mso_schema_template_service_graph:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.non_existing.template }}'
      service_graph: '{{ mso_test.non_existing.lookup_service_graph }}'
      state: query
    ignore_errors: true
    register: query_non_existing_template

  - name: Verify query_non_existing_schema and query_non_existing_template
    ansible.builtin.assert:
      that:
        - query_non_existing_schema.msg == "Provided schema '" ~ mso_test.non_existing.schema ~ "' does not exist."
        - >-
          query_non_existing_template.msg == "Provided template '" ~ mso_test.non_existing.template ~
          "' does not exist. Existing templates: " ~ mso_test.template

  - name: Remove service graph (check mode)
    cisco.mso.mso_schema_template_service_graph:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      service_graph: '{{ mso_test.service_graph.name }}'
      state: absent
    register: rm_sg_cm
    check_mode: true

  - name: Verify rm_sg_cm
    ansible.builtin.assert:
      that:
        - rm_sg_cm is changed
        - rm_sg_cm.current == {}
        - rm_sg_cm.previous.name == mso_test.service_graph.name

  - name: Remove service graph (normal mode)
    cisco.mso.mso_schema_template_service_graph:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      service_graph: '{{ mso_test.service_graph.name }}'
      state: absent
    register: rm_sg

  - name: Verify rm_sg
    ansible.builtin.assert:
      that:
        - rm_sg is changed
        - rm_sg.current == {}
        - rm_sg.previous.name == mso_test.service_graph.name

  - name: Remove service graph again
    cisco.mso.mso_schema_template_service_graph:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      service_graph: '{{ mso_test.service_graph.name }}'
      state: absent
    register: rm_sg_again

  - name: Verify rm_sg_again
    ansible.builtin.assert:
      that:
        - rm_sg_again is not changed
        - rm_sg_again.current == {}
        - rm_sg_again.previous == {}

  always:
  # CLEANUP
  - name: Remove test schema even when a test fails
    cisco.mso.mso_schema:
      <<: *schema_absent
