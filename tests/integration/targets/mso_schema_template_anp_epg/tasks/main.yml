- name: Test that required ACI MultiSite variables are defined
  ansible.builtin.fail:
    msg: 'Please define mso_hostname, mso_username and mso_password.'
  when: mso_hostname is not defined or mso_username is not defined or mso_password is not defined

- name: Set test connection and fixture variables
  ansible.builtin.set_fact:
    mso_info: &mso_info
      host: '{{ mso_hostname }}'
      username: '{{ mso_username }}'
      password: '{{ mso_password }}'
      validate_certs: '{{ mso_validate_certs | default(false) }}'
      use_ssl: '{{ mso_use_ssl | default(true) }}'
      use_proxy: '{{ mso_use_proxy | default(true) }}'
      output_level: debug
    mso_test:
      schema: '{{ mso_schema_template_anp_epg | default(mso_schema | default("ansible_test")) }}'
      tenant: '{{ mso_tenant_template_anp_epg | default(mso_tenant | default("ansible_test")) }}'
      template: Template1
      anp: ANP1
      vrf: VRF1
      vrf_2: VRF2
      bd: BD1
      bd_2: BD2
      layer3_multicast: true
      preferred_group: true
      filter: Filter1
      filter_2: Filter2
      contract: Contract1
      contract_2: Contract2
      epg:
        name: EPG1
        display_name: EPG1 Display Name
        description: Template EPG parent update
        qos_level: level2
        epg_type: application
        subnet:
          subnet: 10.20.30.1/24
          description: Child preservation subnet
          scope: public
          shared: true
          no_default_gateway: true
        useg_attribute:
          name: child_preservation_ip
          type: ip
          value: 10.20.30.0/24
        annotation:
          key: child_preservation
          value: preserved
      epg_2:
        name: EPG2
        initial_subnets:
        - subnet: 10.1.0.128/24
        - subnet: 10.1.1.254/24
          description: '1234567890'
        - subnet: 172.17.0.1/24
          description: Initial public subnet
          scope: public
          shared: true
          no_default_gateway: false
        - ip: 192.168.1.254/24
          description: Initial private subnet
          scope: private
          shared: false
          no_default_gateway: true
        updated_subnets:
        - subnet: 10.1.0.127/24
        - subnet: 172.17.0.1/24
          description: Updated private subnet
          scope: private
          shared: false
          no_default_gateway: false
        - ip: 192.168.1.254/24
          description: Initial private subnet
          scope: private
          shared: false
          no_default_gateway: false
      epg_3: EPG3
      service:
        type: Azure-Storage

- name: Query MSO version
  cisco.mso.mso_version:
    <<: *mso_info
    state: query
  register: version

- name: Exercise mso_schema_template_anp_epg
  block:

  # CLEAN ENVIRONMENT
  - name: Remove test schema before testing
    cisco.mso.mso_schema:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      state: absent

  - name: Ensure tenant exists
    cisco.mso.mso_tenant:
      <<: *mso_info
      tenant: '{{ mso_test.tenant }}'
      users:
      - '{{ mso_username }}'
      state: present

  - name: Ensure schema and template exist
    cisco.mso.mso_schema_template:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      tenant: '{{ mso_test.tenant }}'
      template: '{{ mso_test.template }}'
      state: present

  # VRF2 and BD2 enable Layer 3 multicast and preferred group so the
  # corresponding EPG attributes can be exercised during the update.
  - name: Ensure template VRFs exist
    cisco.mso.mso_schema_template_vrf:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      vrf: '{{ item.vrf }}'
      layer3_multicast: '{{ item.layer3_multicast }}'
      preferred_group: '{{ item.preferred_group }}'
      state: present
    loop:
    - vrf: '{{ mso_test.vrf }}'
      layer3_multicast: false
      preferred_group: false
    - vrf: '{{ mso_test.vrf_2 }}'
      layer3_multicast: '{{ mso_test.layer3_multicast }}'
      preferred_group: '{{ mso_test.preferred_group }}'

  - name: Ensure template bridge domains exist
    cisco.mso.mso_schema_template_bd:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      bd: '{{ item.bd }}'
      vrf:
        name: '{{ item.vrf }}'
      layer3_multicast: '{{ item.layer3_multicast }}'
      state: present
    loop:
    - bd: '{{ mso_test.bd }}'
      vrf: '{{ mso_test.vrf }}'
      layer3_multicast: false
    - bd: '{{ mso_test.bd_2 }}'
      vrf: '{{ mso_test.vrf_2 }}'
      layer3_multicast: '{{ mso_test.layer3_multicast }}'

  - name: Ensure template ANP exists
    cisco.mso.mso_schema_template_anp:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      state: present

  - name: Ensure template filters exist
    cisco.mso.mso_schema_template_filter_entry:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      filter: '{{ item.filter }}'
      entry: '{{ item.entry }}'
      state: present
    loop:
    - filter: '{{ mso_test.filter }}'
      entry: Filter1Entry
    - filter: '{{ mso_test.filter_2 }}'
      entry: Filter2Entry

  - name: Ensure template contracts exist
    cisco.mso.mso_schema_template_contract_filter:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      contract: '{{ item.contract }}'
      filter: '{{ item.filter }}'
      state: present
    loop:
    - contract: '{{ mso_test.contract }}'
      filter: '{{ mso_test.filter }}'
    - contract: '{{ mso_test.contract_2 }}'
      filter: '{{ mso_test.filter_2 }}'

  # CREATE
  - name: Create template EPG1 in check mode
    cisco.mso.mso_schema_template_anp_epg: &epg_1_present
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      bd:
        name: '{{ mso_test.bd }}'
      vrf:
        name: '{{ mso_test.vrf }}'
      state: present
    check_mode: true
    register: cm_create_epg_1

  - name: Create template EPG1
    cisco.mso.mso_schema_template_anp_epg:
      <<: *epg_1_present
    register: nm_create_epg_1

  - name: Create template EPG1 again
    cisco.mso.mso_schema_template_anp_epg:
      <<: *epg_1_present
    register: nm_create_epg_1_again

  - name: Create template EPG2
    cisco.mso.mso_schema_template_anp_epg: &epg_2_present
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg_2.name }}'
      bd:
        name: '{{ mso_test.bd }}'
      vrf:
        name: '{{ mso_test.vrf }}'
      state: present
    register: nm_create_epg_2

  - name: Create template EPG3 without an explicit VRF
    cisco.mso.mso_schema_template_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg_3 }}'
      bd:
        name: '{{ mso_test.bd }}'
      state: present
    register: nm_create_epg_3

  - name: Verify template EPG creation and idempotency
    ansible.builtin.assert:
      that:
      - cm_create_epg_1 is changed
      - cm_create_epg_1.previous == {}
      - nm_create_epg_1 is changed
      - nm_create_epg_1.previous == {}
      - cm_create_epg_1.current.name == nm_create_epg_1.current.name == mso_test.epg.name
      - cm_create_epg_1.current.bdRef.bdName == nm_create_epg_1.current.bdRef.bdName == mso_test.bd
      - cm_create_epg_1.current.vrfRef.vrfName == nm_create_epg_1.current.vrfRef.vrfName == mso_test.vrf
      - cm_create_epg_1.current.bdRef.schemaId == nm_create_epg_1.current.bdRef.schemaId
      - cm_create_epg_1.current.vrfRef.schemaId == nm_create_epg_1.current.vrfRef.schemaId
      - nm_create_epg_1_again is not changed
      - nm_create_epg_1_again.previous == nm_create_epg_1_again.current
      - nm_create_epg_1_again.current.name == mso_test.epg.name
      - nm_create_epg_1_again.current.displayName == mso_test.epg.name
      - nm_create_epg_1_again.current.description == ''
      - nm_create_epg_1_again.current.bdRef.bdName == mso_test.bd
      - nm_create_epg_1_again.current.vrfRef.vrfName == mso_test.vrf
      - nm_create_epg_1_again.current.epgType == 'application'
      - nm_create_epg_1_again.current.intraEpg == 'unenforced'
      - not nm_create_epg_1_again.current.mCastSource
      - not nm_create_epg_1_again.current.preferredGroup
      - nm_create_epg_1_again.current.prio == 'unspecified'
      - not nm_create_epg_1_again.current.proxyArp
      - not nm_create_epg_1_again.current.uSegEpg
      - nm_create_epg_1_again.current.contractRelationships | length == 0
      - nm_create_epg_1_again.current.intraEpgContracts | length == 0
      - nm_create_epg_1_again.current.subnets | length == 0
      - nm_create_epg_1_again.current.tagAnnotations | length == 0
      - nm_create_epg_1_again.current.uSegAttrs | length == 0
      - nm_create_epg_1_again.current.epgRef.schemaId is defined
      - nm_create_epg_1_again.current.epgRef.templateName == mso_test.template
      - nm_create_epg_1_again.current.epgRef.anpName == mso_test.anp
      - nm_create_epg_1_again.current.epgRef.epgName == mso_test.epg.name
      - nm_create_epg_1_again.current.uuid is defined
      - nm_create_epg_2 is changed
      - nm_create_epg_2.current.name == mso_test.epg_2.name
      - nm_create_epg_2.current.bdRef.bdName == mso_test.bd
      - nm_create_epg_2.current.vrfRef.vrfName == mso_test.vrf
      - nm_create_epg_3 is changed
      - nm_create_epg_3.current.name == mso_test.epg_3
      - nm_create_epg_3.current.bdRef.bdName == mso_test.bd

  # UPDATE
  # EPG1 is created above. Add template-level child objects and update the
  # parent with real parent attributes, without child attributes. This
  # exercises the original child-preservation failure path.
  # Enable uSeg before adding the uSeg attribute child.
  - name: Enable uSeg on template EPG1
    cisco.mso.mso_schema_template_anp_epg:
      <<: *epg_1_present
      useg_epg: true
    register: nm_enable_useg

  - name: Add contract relationships to template EPG1
    cisco.mso.mso_schema_template_anp_epg_contract:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      contract:
        name: '{{ item.name }}'
        type: '{{ item.type }}'
      state: present
    loop:
    - name: '{{ mso_test.contract }}'
      type: consumer
    - name: '{{ mso_test.contract }}'
      type: provider
    - name: '{{ mso_test.contract_2 }}'
      type: consumer
    - name: '{{ mso_test.contract_2 }}'
      type: provider
    register: nm_add_contract_relationships

  - name: Add subnet child to template EPG1
    cisco.mso.mso_schema_template_anp_epg_subnet: &epg_1_subnet
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      subnet: '{{ mso_test.epg.subnet.subnet }}'
      description: '{{ mso_test.epg.subnet.description }}'
      scope: '{{ mso_test.epg.subnet.scope }}'
      shared: '{{ mso_test.epg.subnet.shared }}'
      no_default_gateway: '{{ mso_test.epg.subnet.no_default_gateway }}'
      state: present
    register: nm_add_subnet

  - name: Add intra-EPG contract child to template EPG1
    cisco.mso.mso_schema_template_anp_epg_intra_epg_contract: &epg_1_intra_contract
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      contract:
        name: '{{ mso_test.contract }}'
      state: present
    register: nm_add_intra_contract

  - name: Add uSeg attribute child to template EPG1
    cisco.mso.mso_schema_template_anp_epg_useg_attribute: &epg_1_useg_attribute
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      name: '{{ mso_test.epg.useg_attribute.name }}'
      type: '{{ mso_test.epg.useg_attribute.type }}'
      value: '{{ mso_test.epg.useg_attribute.value }}'
      useg_subnet: false
      state: present
    register: nm_add_useg_attribute

  - name: Add annotation child to template EPG1
    cisco.mso.mso_schema_template_anp_epg_annotation: &epg_1_annotation
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      annotation_key: '{{ mso_test.epg.annotation.key }}'
      annotation_value: '{{ mso_test.epg.annotation.value }}'
      state: present
    register: nm_add_annotation

  - name: Verify template EPG child objects were created
    ansible.builtin.assert:
      that:
      - nm_enable_useg is changed
      - nm_add_contract_relationships.results | selectattr('changed', 'equalto', true) | list | length == 4
      - nm_add_subnet is changed
      - nm_add_intra_contract is changed
      - nm_add_useg_attribute is changed
      - nm_add_annotation is changed

  - name: Update template EPG1 in check mode
    cisco.mso.mso_schema_template_anp_epg: &epg_1_update
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      display_name: '{{ mso_test.epg.display_name }}'
      description: '{{ mso_test.epg.description }}'
      bd:
        name: '{{ mso_test.bd_2 }}'
      vrf:
        name: '{{ mso_test.vrf_2 }}'
      useg_epg: true
      intra_epg_isolation: enforced
      intersite_multicast_source: true
      proxy_arp: true
      preferred_group: '{{ mso_test.preferred_group }}'
      qos_level: '{{ mso_test.epg.qos_level }}'
      epg_type: '{{ mso_test.epg.epg_type }}'
      state: present
    check_mode: true
    register: cm_update_epg_1

  - name: Update template EPG1
    cisco.mso.mso_schema_template_anp_epg:
      <<: *epg_1_update
    register: nm_update_epg_1

  - name: Update template EPG1 again
    cisco.mso.mso_schema_template_anp_epg:
      <<: *epg_1_update
    register: nm_update_epg_1_again

  - name: Query preserved contract relationships
    cisco.mso.mso_schema_template_anp_epg_contract:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      state: query
    register: nm_query_epg_contracts

  - name: Query preserved subnet child
    cisco.mso.mso_schema_template_anp_epg_subnet:
      <<: *epg_1_subnet
      state: query
    register: nm_query_epg_subnet

  - name: Query preserved intra-EPG contract child
    cisco.mso.mso_schema_template_anp_epg_intra_epg_contract:
      <<: *epg_1_intra_contract
      state: query
    register: nm_query_epg_intra_contract

  - name: Query preserved uSeg attribute child
    cisco.mso.mso_schema_template_anp_epg_useg_attribute:
      <<: *epg_1_useg_attribute
      state: query
    register: nm_query_epg_useg_attribute

  - name: Query preserved annotation child
    cisco.mso.mso_schema_template_anp_epg_annotation:
      <<: *epg_1_annotation
      state: query
    register: nm_query_epg_annotation

  - name: Verify template EPG update and child preservation
    ansible.builtin.assert:
      that:
      - cm_update_epg_1 is changed
      - nm_update_epg_1 is changed
      - nm_update_epg_1_again is not changed
      - cm_update_epg_1.current == nm_update_epg_1.current
      - nm_update_epg_1_again.previous == nm_update_epg_1_again.current
      - nm_update_epg_1_again.current == nm_update_epg_1.current
      - cm_update_epg_1.current.name == nm_update_epg_1.current.name == mso_test.epg.name
      - cm_update_epg_1.current.displayName == nm_update_epg_1.current.displayName == mso_test.epg.display_name
      - cm_update_epg_1.current.description == nm_update_epg_1.current.description == mso_test.epg.description
      - cm_update_epg_1.current.bdRef.bdName == nm_update_epg_1.current.bdRef.bdName == mso_test.bd_2
      - cm_update_epg_1.current.vrfRef.vrfName == nm_update_epg_1.current.vrfRef.vrfName == mso_test.vrf_2
      - cm_update_epg_1.current.bdRef.schemaId == nm_update_epg_1.current.bdRef.schemaId
      - cm_update_epg_1.current.vrfRef.schemaId == nm_update_epg_1.current.vrfRef.schemaId
      - nm_update_epg_1.current.uSegEpg
      - nm_update_epg_1.current.intraEpg == 'enforced'
      - nm_update_epg_1.current.mCastSource
      - nm_update_epg_1.current.proxyArp
      - nm_update_epg_1.current.preferredGroup == mso_test.preferred_group
      - nm_update_epg_1.current.prio == mso_test.epg.qos_level
      - nm_update_epg_1.current.epgType == mso_test.epg.epg_type
      - nm_update_epg_1.current.contractRelationships | length == 4
      - nm_update_epg_1.current.subnets | length == 1
      - nm_update_epg_1.current.intraEpgContracts | length == 1
      - nm_update_epg_1.current.uSegAttrs | length == 1
      - nm_update_epg_1_again.current.contractRelationships == nm_update_epg_1.current.contractRelationships
      - nm_update_epg_1_again.current.subnets == nm_update_epg_1.current.subnets
      - nm_update_epg_1_again.current.intraEpgContracts == nm_update_epg_1.current.intraEpgContracts
      - nm_update_epg_1_again.current.uSegAttrs == nm_update_epg_1.current.uSegAttrs
      - nm_query_epg_contracts is not changed
      - nm_query_epg_contracts.current | length == 4
      - nm_query_epg_contracts.current | selectattr('contractRef.contractName', 'equalto', mso_test.contract) | selectattr('relationshipType', 'equalto', 'consumer') | list | length == 1
      - nm_query_epg_contracts.current | selectattr('contractRef.contractName', 'equalto', mso_test.contract) | selectattr('relationshipType', 'equalto', 'provider') | list | length == 1
      - nm_query_epg_contracts.current | selectattr('contractRef.contractName', 'equalto', mso_test.contract_2) | selectattr('relationshipType', 'equalto', 'consumer') | list | length == 1
      - nm_query_epg_contracts.current | selectattr('contractRef.contractName', 'equalto', mso_test.contract_2) | selectattr('relationshipType', 'equalto', 'provider') | list | length == 1
      - nm_query_epg_subnet is not changed
      - nm_query_epg_subnet.current.ip == mso_test.epg.subnet.subnet
      - nm_query_epg_subnet.current.description == mso_test.epg.subnet.description
      - nm_query_epg_subnet.current.scope == mso_test.epg.subnet.scope
      - nm_query_epg_subnet.current.shared == mso_test.epg.subnet.shared
      - nm_query_epg_subnet.current.noDefaultGateway == mso_test.epg.subnet.no_default_gateway
      - nm_query_epg_intra_contract is not changed
      - nm_query_epg_intra_contract.current | length == 1
      - nm_query_epg_intra_contract.current[0].contractRef is search('/templates/' ~ mso_test.template ~ '/contracts/' ~ mso_test.contract)
      - nm_query_epg_useg_attribute is not changed
      - nm_query_epg_useg_attribute.current.name == mso_test.epg.useg_attribute.name
      - nm_query_epg_useg_attribute.current.type == mso_test.epg.useg_attribute.type
      - nm_query_epg_useg_attribute.current.value == mso_test.epg.useg_attribute.value

  - name: Verify template EPG annotation preservation
    ansible.builtin.assert:
      that:
      - nm_update_epg_1.current.tagAnnotations | length == 1
      - nm_update_epg_1_again.current.tagAnnotations == nm_update_epg_1.current.tagAnnotations
      - nm_query_epg_annotation is not changed
      - nm_query_epg_annotation.current.tagKey == mso_test.epg.annotation.key
      - nm_query_epg_annotation.current.tagValue == mso_test.epg.annotation.value

  - name: Add inline subnets to template EPG2 in check mode
    cisco.mso.mso_schema_template_anp_epg: &epg_2_initial_subnets
      <<: *epg_2_present
      subnets: '{{ mso_test.epg_2.initial_subnets }}'
    check_mode: true
    register: cm_update_epg_2_subnets

  - name: Add inline subnets to template EPG2
    cisco.mso.mso_schema_template_anp_epg:
      <<: *epg_2_initial_subnets
    register: nm_update_epg_2_subnets

  - name: Change inline subnets on template EPG2
    cisco.mso.mso_schema_template_anp_epg: &epg_2_updated_subnets
      <<: *epg_2_present
      subnets: '{{ mso_test.epg_2.updated_subnets }}'
    register: nm_change_epg_2_subnets

  - name: Change inline subnets on template EPG2 again
    cisco.mso.mso_schema_template_anp_epg:
      <<: *epg_2_updated_subnets
    register: nm_change_epg_2_subnets_again

  - name: Verify template EPG inline subnet updates
    ansible.builtin.assert:
      that:
      - cm_update_epg_2_subnets is changed
      - nm_update_epg_2_subnets is changed
      - cm_update_epg_2_subnets.current.subnets == nm_update_epg_2_subnets.current.subnets
      - nm_update_epg_2_subnets.current.subnets | length == 4
      - nm_update_epg_2_subnets.current.subnets[0].ip == mso_test.epg_2.initial_subnets[0].subnet
      - nm_update_epg_2_subnets.current.subnets[0].description == mso_test.epg_2.initial_subnets[0].subnet
      - nm_update_epg_2_subnets.current.subnets[0].scope == 'private'
      - not nm_update_epg_2_subnets.current.subnets[0].shared
      - not nm_update_epg_2_subnets.current.subnets[0].noDefaultGateway
      - nm_update_epg_2_subnets.current.subnets[1].ip == mso_test.epg_2.initial_subnets[1].subnet
      - nm_update_epg_2_subnets.current.subnets[1].description == mso_test.epg_2.initial_subnets[1].description
      - nm_update_epg_2_subnets.current.subnets[1].scope == 'private'
      - not nm_update_epg_2_subnets.current.subnets[1].shared
      - not nm_update_epg_2_subnets.current.subnets[1].noDefaultGateway
      - nm_update_epg_2_subnets.current.subnets[2].ip == mso_test.epg_2.initial_subnets[2].subnet
      - nm_update_epg_2_subnets.current.subnets[2].description == mso_test.epg_2.initial_subnets[2].description
      - nm_update_epg_2_subnets.current.subnets[2].scope == mso_test.epg_2.initial_subnets[2].scope
      - nm_update_epg_2_subnets.current.subnets[2].shared == mso_test.epg_2.initial_subnets[2].shared
      - nm_update_epg_2_subnets.current.subnets[2].noDefaultGateway == mso_test.epg_2.initial_subnets[2].no_default_gateway
      - nm_update_epg_2_subnets.current.subnets[3].ip == mso_test.epg_2.initial_subnets[3].ip
      - nm_update_epg_2_subnets.current.subnets[3].description == mso_test.epg_2.initial_subnets[3].description
      - nm_update_epg_2_subnets.current.subnets[3].scope == mso_test.epg_2.initial_subnets[3].scope
      - nm_update_epg_2_subnets.current.subnets[3].shared == mso_test.epg_2.initial_subnets[3].shared
      - nm_update_epg_2_subnets.current.subnets[3].noDefaultGateway == mso_test.epg_2.initial_subnets[3].no_default_gateway
      - nm_change_epg_2_subnets is changed
      - nm_change_epg_2_subnets.current.subnets | length == 3
      - nm_change_epg_2_subnets.current.subnets[0].ip == mso_test.epg_2.updated_subnets[0].subnet
      - nm_change_epg_2_subnets.current.subnets[0].description == mso_test.epg_2.updated_subnets[0].subnet
      - nm_change_epg_2_subnets.current.subnets[0].scope == 'private'
      - not nm_change_epg_2_subnets.current.subnets[0].shared
      - not nm_change_epg_2_subnets.current.subnets[0].noDefaultGateway
      - nm_change_epg_2_subnets.current.subnets[1].ip == mso_test.epg_2.updated_subnets[1].subnet
      - nm_change_epg_2_subnets.current.subnets[1].description == mso_test.epg_2.updated_subnets[1].description
      - nm_change_epg_2_subnets.current.subnets[1].scope == mso_test.epg_2.updated_subnets[1].scope
      - nm_change_epg_2_subnets.current.subnets[1].shared == mso_test.epg_2.updated_subnets[1].shared
      - nm_change_epg_2_subnets.current.subnets[1].noDefaultGateway == mso_test.epg_2.updated_subnets[1].no_default_gateway
      - nm_change_epg_2_subnets.current.subnets[2].ip == mso_test.epg_2.updated_subnets[2].ip
      - nm_change_epg_2_subnets.current.subnets[2].description == mso_test.epg_2.updated_subnets[2].description
      - nm_change_epg_2_subnets.current.subnets[2].scope == mso_test.epg_2.updated_subnets[2].scope
      - nm_change_epg_2_subnets.current.subnets[2].shared == mso_test.epg_2.updated_subnets[2].shared
      - nm_change_epg_2_subnets.current.subnets[2].noDefaultGateway == mso_test.epg_2.updated_subnets[2].no_default_gateway
      - nm_change_epg_2_subnets_again is not changed
      - nm_change_epg_2_subnets_again.current.subnets == nm_change_epg_2_subnets.current.subnets

  # Update an existing EPG so deployment_type, service_type, and access_type
  # exercise the update path instead of creating another EPG.
  - name: Update template EPG2 with valid service attributes
    cisco.mso.mso_schema_template_anp_epg: &epg_2_service_private
      <<: *epg_2_present
      epg_type: service
      deployment_type: third_party
      service_type: '{{ mso_test.service.type }}'
      access_type: private
    register: nm_update_epg_2_service

  - name: Update template EPG2 with valid service attributes again
    cisco.mso.mso_schema_template_anp_epg:
      <<: *epg_2_service_private
    register: nm_update_epg_2_service_again

  - name: Validate template EPG2 service attributes
    cisco.mso.mso_schema_validate:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      state: query
    register: nm_validate_epg_2_service

  - name: Query template EPG2 after valid service update
    cisco.mso.mso_schema_template_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg_2.name }}'
      state: query
    register: nm_query_epg_2_service

  - name: Verify template EPG service attribute update
    ansible.builtin.assert:
      that:
      - nm_update_epg_2_service is changed
      - nm_update_epg_2_service.current.cloudServiceEpgConfig.deploymentType == 'Third-party'
      - nm_update_epg_2_service.current.cloudServiceEpgConfig.serviceType == mso_test.service.type
      - nm_update_epg_2_service.current.cloudServiceEpgConfig.accessType == 'Private'
      - nm_update_epg_2_service_again is not changed
      - nm_update_epg_2_service_again.previous == nm_update_epg_2_service_again.current
      - nm_update_epg_2_service_again.current.cloudServiceEpgConfig.deploymentType == 'Third-party'
      - nm_update_epg_2_service_again.current.cloudServiceEpgConfig.serviceType == mso_test.service.type
      - nm_update_epg_2_service_again.current.cloudServiceEpgConfig.accessType == 'Private'
      - nm_query_epg_2_service is not changed
      - nm_query_epg_2_service.current.epgType == 'service'
      - nm_query_epg_2_service.current.cloudServiceEpgConfig.deploymentType == 'Third-party'
      - nm_query_epg_2_service.current.cloudServiceEpgConfig.serviceType == mso_test.service.type
      - nm_query_epg_2_service.current.cloudServiceEpgConfig.accessType == 'Private'
      - nm_validate_epg_2_service is not changed
      - nm_validate_epg_2_service.current.result

  - name: Update template EPG2 with public and private service access
    cisco.mso.mso_schema_template_anp_epg:
      <<: *epg_2_service_private
      access_type: public_and_private
    register: nm_update_epg_2_public_and_private_service
    ignore_errors: true

  - name: Query template EPG2 after public and private service update
    cisco.mso.mso_schema_template_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg_2.name }}'
      state: query
    register: nm_query_epg_2_public_and_private_service

  - name: Validate template EPG2 public and private service access
    cisco.mso.mso_schema_validate:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      state: query
    register: nm_validate_epg_2_public_and_private_service
    ignore_errors: true

  - name: Restore valid template EPG2 service attributes
    cisco.mso.mso_schema_template_anp_epg:
      <<: *epg_2_service_private
    register: nm_restore_epg_2_service

  - name: Query template EPG2 after restoring valid service attributes
    cisco.mso.mso_schema_template_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg_2.name }}'
      state: query
    register: nm_query_restored_epg_2_service

  - name: Verify shared template EPG service update behavior
    ansible.builtin.assert:
      that:
      - nm_validate_epg_2_public_and_private_service is not changed
      - nm_validate_epg_2_public_and_private_service.current.result
      - nm_query_restored_epg_2_service is not changed
      - nm_query_restored_epg_2_service.current.cloudServiceEpgConfig.accessType == 'Private'

  # NDO 4.4 rejects PublicAndPrivate during the update and retains the existing Private access type.
  - name: Verify NDO 4.4 service update rejection
    ansible.builtin.assert:
      that:
      - nm_update_epg_2_public_and_private_service is failed
      - >-
        nm_update_epg_2_public_and_private_service.msg is match('MSO Error 400: EPG: ' ~ mso_test.epg_2.name ~ ' in Schema: ' ~
        mso_test.schema ~ '\\s*,?\\s*Template: ' ~ mso_test.template ~ '\\s*,?\\s*DeploymentType: saas, AccessType :publicAndPrivateType,
        Combination is not supported')
      - nm_query_epg_2_public_and_private_service is not changed
      - nm_query_epg_2_public_and_private_service.current.cloudServiceEpgConfig.accessType == 'Private'
      - nm_restore_epg_2_service is not changed
    when: version.current.version is version('5.1', '<')

  # NDO 5.1 and later persist PublicAndPrivate, so restoring Private must change the EPG.
  - name: Verify NDO 5.1 and later service update
    ansible.builtin.assert:
      that:
      - nm_update_epg_2_public_and_private_service is changed
      - nm_query_epg_2_public_and_private_service is not changed
      - nm_query_epg_2_public_and_private_service.current.cloudServiceEpgConfig.accessType == 'PublicAndPrivate'
      - nm_restore_epg_2_service is changed
    when: version.current.version is version('5.1', '>=')

  # QUERY
  - name: Query template EPG1 in check mode
    cisco.mso.mso_schema_template_anp_epg: &epg_1_query
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      state: query
    check_mode: true
    register: cm_query_epg_1

  - name: Query template EPG1
    cisco.mso.mso_schema_template_anp_epg:
      <<: *epg_1_query
    register: nm_query_epg_1

  - name: Query template EPG3 without an explicit VRF
    cisco.mso.mso_schema_template_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg_3 }}'
      state: query
    register: nm_query_epg_3

  - name: Query all template EPGs in check mode
    cisco.mso.mso_schema_template_anp_epg: &all_epgs_query
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      state: query
    check_mode: true
    register: cm_query_all_epgs

  - name: Query all template EPGs
    cisco.mso.mso_schema_template_anp_epg:
      <<: *all_epgs_query
    register: nm_query_all_epgs

  - name: Verify specific template EPG query
    ansible.builtin.assert:
      that:
      - cm_query_epg_1 is not changed
      - nm_query_epg_1 is not changed
      - cm_query_epg_1.current == nm_query_epg_1.current
      - nm_query_epg_1.current.name == mso_test.epg.name
      - nm_query_epg_1.current.displayName == mso_test.epg.display_name
      - nm_query_epg_1.current.description == mso_test.epg.description
      - nm_query_epg_1.current.bdRef is mapping
      - nm_query_epg_1.current.bdRef.templateName == mso_test.template
      - nm_query_epg_1.current.bdRef.bdName == mso_test.bd_2
      - nm_query_epg_1.current.vrfRef is mapping
      - nm_query_epg_1.current.vrfRef.templateName == mso_test.template
      - nm_query_epg_1.current.vrfRef.vrfName == mso_test.vrf_2
      - nm_query_epg_1.current.uSegEpg
      - nm_query_epg_1.current.intraEpg == 'enforced'
      - nm_query_epg_1.current.mCastSource
      - nm_query_epg_1.current.proxyArp
      - nm_query_epg_1.current.preferredGroup == mso_test.preferred_group
      - nm_query_epg_1.current.prio == mso_test.epg.qos_level
      - nm_query_epg_1.current.epgType == mso_test.epg.epg_type
      - nm_query_epg_1.current.contractRelationships | length == 4
      - nm_query_epg_1.current.subnets | length == 1
      - nm_query_epg_1.current.intraEpgContracts | length == 1
      - nm_query_epg_1.current.uSegAttrs | length == 1
      - nm_query_epg_3 is not changed
      - nm_query_epg_3.current.name == mso_test.epg_3
      - nm_query_epg_3.current.bdRef is mapping
      - nm_query_epg_3.current.bdRef.bdName == mso_test.bd

  - name: Verify template EPG collection query
    ansible.builtin.assert:
      that:
      - cm_query_all_epgs is not changed
      - nm_query_all_epgs is not changed
      - cm_query_all_epgs.current == nm_query_all_epgs.current
      - cm_query_all_epgs.current | length == nm_query_all_epgs.current | length == 3
      - nm_query_all_epgs.current | selectattr('name', 'equalto', mso_test.epg.name) | list | length == 1
      - nm_query_all_epgs.current | selectattr('name', 'equalto', mso_test.epg_2.name) | list | length == 1
      - nm_query_all_epgs.current | selectattr('name', 'equalto', mso_test.epg_3) | list | length == 1
      - (nm_query_all_epgs.current | selectattr('name', 'equalto', mso_test.epg.name) | first).bdRef is mapping
      - (nm_query_all_epgs.current | selectattr('name', 'equalto', mso_test.epg.name) | first).bdRef.bdName == mso_test.bd_2
      - (nm_query_all_epgs.current | selectattr('name', 'equalto', mso_test.epg.name) | first).vrfRef is mapping
      - (nm_query_all_epgs.current | selectattr('name', 'equalto', mso_test.epg.name) | first).vrfRef.vrfName == mso_test.vrf_2
      - (nm_query_all_epgs.current | selectattr('name', 'equalto', mso_test.epg_2.name) | first).bdRef is mapping
      - (nm_query_all_epgs.current | selectattr('name', 'equalto', mso_test.epg_2.name) | first).vrfRef is mapping
      - (nm_query_all_epgs.current | selectattr('name', 'equalto', mso_test.epg_3) | first).bdRef is mapping

  # DELETE
  # Delete the child-populated EPG1 to verify that removing the parent EPG
  # also removes its template-level descendants.
  - name: Delete template EPG1 in check mode
    cisco.mso.mso_schema_template_anp_epg: &epg_1_absent
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg.name }}'
      state: absent
    check_mode: true
    register: cm_delete_epg_1

  - name: Delete template EPG1
    cisco.mso.mso_schema_template_anp_epg:
      <<: *epg_1_absent
    register: nm_delete_epg_1

  - name: Delete template EPG1 again
    cisco.mso.mso_schema_template_anp_epg:
      <<: *epg_1_absent
    register: nm_delete_epg_1_again

  - name: Verify template EPG deletion and idempotency
    ansible.builtin.assert:
      that:
      - cm_delete_epg_1 is changed
      - cm_delete_epg_1.previous.contractRelationships | length == 4
      - cm_delete_epg_1.previous.subnets | length == 1
      - cm_delete_epg_1.previous.intraEpgContracts | length == 1
      - cm_delete_epg_1.previous.uSegAttrs | length == 1
      - cm_delete_epg_1.previous.tagAnnotations | length == 1
      - cm_delete_epg_1.previous == nm_delete_epg_1.previous
      - cm_delete_epg_1.proposed == cm_delete_epg_1.current == {}
      - nm_delete_epg_1 is changed
      - nm_delete_epg_1.previous.contractRelationships | length == 4
      - nm_delete_epg_1.previous.subnets | length == 1
      - nm_delete_epg_1.previous.intraEpgContracts | length == 1
      - nm_delete_epg_1.previous.uSegAttrs | length == 1
      - nm_delete_epg_1.previous.tagAnnotations | length == 1
      - nm_delete_epg_1.proposed == nm_delete_epg_1.current == {}
      - nm_delete_epg_1_again is not changed
      - nm_delete_epg_1_again.previous == nm_delete_epg_1_again.current == {}
      - nm_delete_epg_1_again.proposed == nm_delete_epg_1_again.current == {}

  # ERROR HANDLING
  - name: Query a missing EPG in check mode
    cisco.mso.mso_schema_template_anp_epg:
      <<: *all_epgs_query
      epg: MissingEPG
    check_mode: true
    register: cm_missing_epg
    ignore_errors: true

  - name: Query a missing ANP in check mode
    cisco.mso.mso_schema_template_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: MissingANP
      epg: '{{ mso_test.epg_2.name }}'
      state: query
    check_mode: true
    register: cm_missing_anp
    ignore_errors: true

  - name: Query a missing schema in check mode
    cisco.mso.mso_schema_template_anp_epg:
      <<: *mso_info
      schema: MissingSchema
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg_2.name }}'
      state: query
    check_mode: true
    register: cm_missing_schema
    ignore_errors: true

  - name: Query a missing template in check mode
    cisco.mso.mso_schema_template_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: MissingTemplate
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg_2.name }}'
      state: query
    check_mode: true
    register: cm_missing_template
    ignore_errors: true

  - name: Reject an invalid state in check mode
    cisco.mso.mso_schema_template_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      epg: '{{ mso_test.epg_2.name }}'
      state: invalid
    check_mode: true
    register: cm_invalid_state
    ignore_errors: true

  - name: Reject a missing EPG for state present in check mode
    cisco.mso.mso_schema_template_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      state: present
    check_mode: true
    register: cm_missing_epg_present
    ignore_errors: true

  - name: Reject a missing EPG for state absent in check mode
    cisco.mso.mso_schema_template_anp_epg:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      anp: '{{ mso_test.anp }}'
      state: absent
    check_mode: true
    register: cm_missing_epg_absent
    ignore_errors: true

  - name: Reject a missing BD schema in check mode
    cisco.mso.mso_schema_template_anp_epg:
      <<: *epg_2_present
      bd:
        name: '{{ mso_test.bd }}'
        schema: MissingSchema
        template: '{{ mso_test.template }}'
    check_mode: true
    register: cm_missing_bd_schema
    ignore_errors: true

  - name: Reject a missing VRF schema in check mode
    cisco.mso.mso_schema_template_anp_epg:
      <<: *epg_2_present
      vrf:
        name: '{{ mso_test.vrf }}'
        schema: MissingSchema
        template: '{{ mso_test.template }}'
    check_mode: true
    register: cm_missing_vrf_schema
    ignore_errors: true

  - name: Verify error-handling scenarios
    ansible.builtin.assert:
      that:
      - cm_missing_epg is failed
      - cm_missing_epg.msg == "EPG 'MissingEPG' not found"
      - cm_missing_anp is failed
      - "cm_missing_anp.msg == \"Provided anp 'MissingANP' does not exist. Existing anps: \" ~ mso_test.anp"
      - cm_missing_schema is failed
      - cm_missing_schema.msg == "Provided schema 'MissingSchema' does not exist."
      - cm_missing_template is failed
      - "cm_missing_template.msg == \"Provided template 'MissingTemplate' does not exist. Existing templates: \" ~ mso_test.template"
      - cm_invalid_state is failed
      - 'cm_invalid_state.msg == "value of state must be one of: absent, present, query, got: invalid"'
      - cm_missing_epg_present is failed
      - "cm_missing_epg_present.msg == 'state is present but all of the following are missing: epg'"
      - cm_missing_epg_absent is failed
      - "cm_missing_epg_absent.msg == 'state is absent but all of the following are missing: epg'"
      - cm_missing_bd_schema is failed
      - cm_missing_bd_schema.msg == "Referenced schema 'MissingSchema' in bdref does not exist"
      - cm_missing_vrf_schema is failed
      - cm_missing_vrf_schema.msg == "Referenced schema 'MissingSchema' in vrfref does not exist"

  always:
  # CLEANUP
  - name: Remove test schema even when a test fails
    cisco.mso.mso_schema:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      state: absent
