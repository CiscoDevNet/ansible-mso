- name: Test that we have an ACI MultiSite host, username and password
  ansible.builtin.fail:
    msg: 'Please define the following variables: mso_hostname, mso_username and mso_password.'
  when: mso_hostname is not defined or mso_username is not defined or mso_password is not defined

- name: Set test connection and fixture variables
  ansible.builtin.set_fact:
    mso_info: &mso_info
      host: '{{ mso_hostname }}'
      username: '{{ mso_username }}'
      password: '{{ mso_password }}'
      validate_certs: '{{ mso_validate_certs | default(false) }}'
      use_ssl: '{{ mso_use_ssl | default(true) }}'
      use_proxy: '{{ mso_use_proxy | default(true) }}'
      output_level: '{{ mso_output_level | default("debug") }}'
    aci_info: &aci_info
      host: '{{ apic_hostname }}'
      username: '{{ apic_username }}'
      password: '{{ apic_password }}'
      validate_certs: '{{ apic_validate_certs | default(false) }}'
      use_ssl: '{{ apic_use_ssl | default(true) }}'
      use_proxy: '{{ apic_use_proxy | default(true) }}'
      output_level: '{{ mso_output_level | default("debug") }}'
    mso_test:
      schema: '{{ mso_schema_site_bd_l3out | default(mso_schema | default("ansible_test")) }}'
      schema_2: '{{ mso_schema_site_bd_l3out | default(mso_schema | default("ansible_test")) }}_2'
      tenant: '{{ mso_tenant_site_bd_l3out | default(mso_tenant | default("ansible_test")) }}'
      site: '{{ mso_site_site_bd_l3out | default(mso_site | default("ansible_test")) }}'
      template_1: 'Template1'
      template_2: 'Template2'
      template_3: 'Template3'
      l3out_template: 'TemplateL3out'
      bd_1: 'ansible_test_1'
      bd_2: 'BD1'
      bd_3: 'ansible_bd'
      l3out_bd: 'l3out_bd'
      vrf_1: 'VRF1'
      vrf_2: 'VRF2'
      vrf_3: 'VRF3'
      apic_vrf: 'l3out_vrf'
      l3out_1: 'L3out1'
      l3out_2: 'L3out2'
      l3out_3: 'L3out3'
      apic_l3out: 'ansible_test_l3out'
      apic_l3out_domain: 'L3out_Dom'

- name: Query MSO version
  cisco.mso.mso_version:
    <<: *mso_info
    state: query
  register: version

- name: Execute tasks
  block:
  - name: Remove schemas
    cisco.mso.mso_schema:
      <<: *mso_info
      schema: '{{ item }}'
      state: absent
    loop:
    - '{{ mso_test.schema_2 }}'
    - '{{ mso_test.schema }}'

  - name: Ensure schema with Template1, Template2, and TemplateL3out exist
    cisco.mso.mso_schema_template:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      tenant: '{{ mso_test.tenant }}'
      template: '{{item.template}}'
      state: present
    loop:
    - { template: '{{ mso_test.template_1 }}'}
    - { template: '{{ mso_test.template_2 }}'}
    - { template: '{{ mso_test.l3out_template }}'}

  - name: Ensure schema 2 with Template3 exist
    cisco.mso.mso_schema_template:
      <<: *mso_info
      schema: '{{ mso_test.schema_2 }}'
      tenant: '{{ mso_test.tenant }}'
      template: '{{ mso_test.template_3 }}'
      state: present

  - name: Add physical site to a schema
    cisco.mso.mso_schema_site:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      state: present

  - name: Add physical site to a schema2
    cisco.mso.mso_schema_site:
      <<: *mso_info
      schema: '{{ mso_test.schema_2 }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_3 }}'
      state: present

  - name: Ensure VRF1 exists
    cisco.mso.mso_schema_template_vrf:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template_1 }}'
      vrf: '{{ mso_test.vrf_1 }}'
      state: present

  - name: Ensure VRF2 exists
    cisco.mso.mso_schema_template_vrf:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template_2 }}'
      vrf: '{{ mso_test.vrf_2 }}'
      state: present

  - name: Ensure VRF3 exists
    cisco.mso.mso_schema_template_vrf:
      <<: *mso_info
      schema: '{{ mso_test.schema_2 }}'
      template: '{{ mso_test.template_3 }}'
      vrf: '{{ mso_test.vrf_3 }}'
      state: present

  - name: Add template BD
    cisco.mso.mso_schema_template_bd:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template_1 }}'
      bd: '{{ mso_test.bd_1 }}'
      vrf:
        name: '{{ mso_test.vrf_1 }}'
      state: present
    register: nm_add_bd

  - name: Verify nm_add_bd
    ansible.builtin.assert:
      that:
      - nm_add_bd is changed
      - nm_add_bd.previous == {}
      - nm_add_bd.current.name == "{{ mso_test.bd_1 }}"
      - nm_add_bd.current.vrfRef.templateName == "{{ mso_test.template_1 }}"
      - nm_add_bd.current.vrfRef.vrfName == "{{ mso_test.vrf_1 }}"

  - name: Add a new L3out
    cisco.mso.mso_schema_template_l3out:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template_1 }}'
      l3out: '{{ mso_test.l3out_1 }}'
      vrf:
          name: '{{ mso_test.vrf_1 }}'
      state: present
    register: nm_add_l3out

  - name: Add a new L3out2 in different template
    cisco.mso.mso_schema_template_l3out:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template_2 }}'
      l3out: '{{ mso_test.l3out_2 }}'
      vrf:
          name: '{{ mso_test.vrf_2 }}'
      state: present
    register: nm_add_l3out

  - name: Add a new L3out3 in different schema
    cisco.mso.mso_schema_template_l3out:
      <<: *mso_info
      schema: '{{ mso_test.schema_2 }}'
      template: '{{ mso_test.template_3 }}'
      l3out: '{{ mso_test.l3out_3 }}'
      vrf:
          name: '{{ mso_test.vrf_3 }}'
      state: present
    register: nm_add_l3out

  - name: Verify nm_add_l3out
    ansible.builtin.assert:
      that:
      - nm_add_l3out is changed
      - nm_add_l3out.previous == {}

  - name: Add BD to site
    cisco.mso.mso_schema_site_bd:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      bd: '{{ mso_test.bd_1 }}'
      state: present
    register: nm_add_site_bd

  - name: Verify nm_add_site_bd
    ansible.builtin.assert:
      that:
      - nm_add_site_bd.current.bdRef.bdName == "{{ mso_test.bd_1 }}"
      - nm_add_site_bd.current.bdRef.templateName == "{{ mso_test.template_1 }}"
      - nm_add_site_bd.current.hostBasedRouting == false

  - name: Verify nm_add_site_bd
    ansible.builtin.assert:
      that:
      - nm_add_site_bd is changed
      - nm_add_site_bd.previous == {}
    when: version.current.version is version('4.0', '<') # no change in NDO4.0 because site will already be present when template is defined

  - name: Add l3out to BD Site
    cisco.mso.mso_schema_site_bd_l3out:  &site_bd_l3out_again
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      bd: '{{ mso_test.bd_1 }}'
      l3out:
        name: '{{ mso_test.l3out_1 }}'
      state: present
    register: nm_bd_site_l3out

  - name: Add l3out to BD Site again
    cisco.mso.mso_schema_site_bd_l3out:
      <<: *site_bd_l3out_again
    register: nm_bd_site_l3out_again

  - name: Verify nm_bd_site_l3out
    ansible.builtin.assert:
      that:
      - nm_bd_site_l3out is changed
      - nm_bd_site_l3out.previous == {}
      - nm_bd_site_l3out.current.l3outName == "{{ mso_test.l3out_1 }}"
      - nm_bd_site_l3out_again is not changed

  - name: Query a specific BD site l3out
    cisco.mso.mso_schema_site_bd_l3out:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      bd: '{{ mso_test.bd_1 }}'
      l3out:
        name: '{{ mso_test.l3out_1 }}'
      state: query
    register: query_result

  - name: Verify query_result
    ansible.builtin.assert:
      that:
      - query_result is not changed
      - nm_bd_site_l3out.current.l3outName == "{{ mso_test.l3out_1 }}"

  - name: Add l3out2 from different template to BD Site
    cisco.mso.mso_schema_site_bd_l3out:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      bd: '{{ mso_test.bd_1 }}'
      l3out:
        name: '{{ mso_test.l3out_2 }}'
        template: '{{ mso_test.template_2 }}'
      state: present
    register: nm_bd_site_l3out2

  - name: Add l3out3 from different schema to BD Site
    cisco.mso.mso_schema_site_bd_l3out:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      bd: '{{ mso_test.bd_1 }}'
      l3out:
        name: '{{ mso_test.l3out_3 }}'
        schema: '{{ mso_test.schema_2 }}'
        template: '{{ mso_test.template_3 }}'
      state: present
    register: nm_bd_site_l3out3

  - name: Verify nm_bd_site_l3out2 and nm_bd_site_l3out3
    ansible.builtin.assert:
      that:
      - nm_bd_site_l3out2 is changed
      - nm_bd_site_l3out2.previous == {}
      - nm_bd_site_l3out2.current.l3outName == "{{ mso_test.l3out_2 }}"
      - nm_bd_site_l3out3 is changed
      - nm_bd_site_l3out3.previous == {}
      - nm_bd_site_l3out3.current.l3outName == "{{ mso_test.l3out_3 }}"

  - name: Query all BD site l3outs
    cisco.mso.mso_schema_site_bd_l3out:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      bd: '{{ mso_test.bd_1 }}'
      state: query
    register: query_all

  - name: Verify query_all
    ansible.builtin.assert:
      that:
      - query_all is not changed
      - query_all.current.0.l3outName == "{{ mso_test.l3out_1 }}"
      - query_all.current.1.l3outName == "{{ mso_test.l3out_2 }}"
      - query_all.current.2.l3outName == "{{ mso_test.l3out_3 }}"

  # Checking error conditions
  - name: Use non_existing template
    cisco.mso.mso_schema_site_bd_l3out:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: non_existing_template
      bd: '{{ mso_test.bd_1 }}'
      l3out:
        name: '{{ mso_test.l3out_1 }}'
      state: query
    ignore_errors: true
    register: non_existing_template

  - name: Use non_existing BD
    cisco.mso.mso_schema_site_bd_l3out:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      bd: '{{ mso_test.bd_2 }}'
      state: query
    ignore_errors: true
    register: non_existing_bd

  - name: Query non_existing BD site L3out
    cisco.mso.mso_schema_site_bd_l3out:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      bd: '{{ mso_test.bd_1 }}'
      l3out:
        name: non_existing_L3out
      state: query
    ignore_errors: true
    register: non_existing_l3out

  - name: Set error messages for queries
    ansible.builtin.set_fact:
      error_message_non_existing_template: "Provided template 'non_existing_template' not matching existing template(s): {{ mso_test.template_1 }}, {{ mso_test.template_2 }}, {{ mso_test.l3out_template }}"
      error_message_non_existing_bd: "Provided BD '{{ mso_test.bd_2 }}' not matching existing bd(s): {{ mso_test.bd_1 }}"

  - name: Verify error query
    ansible.builtin.assert:
      that:
      - non_existing_template is not changed
      - non_existing_template.msg == error_message_non_existing_template
      - non_existing_bd is not changed
      - non_existing_bd.msg == error_message_non_existing_bd
      - non_existing_l3out is not changed
      - non_existing_l3out.msg == "L3out 'non_existing_L3out' not found"

  # Check addition of l3out to Site BD without adding BD to site
  - name: Remove l3out from BD Site
    cisco.mso.mso_schema_site_bd_l3out:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      bd: '{{ mso_test.bd_1 }}'
      l3out:
        name: '{{ mso_test.l3out_1 }}'
      state: absent
    register: remove_bd_site_l3out

  - name: Verify remove_bd_site_l3out
    ansible.builtin.assert:
      that:
      - remove_bd_site_l3out is changed
      - remove_bd_site_l3out.previous.l3outName == "{{ mso_test.l3out_1 }}"
      - remove_bd_site_l3out.current == {}

  - name: Remove BD from site
    cisco.mso.mso_schema_site_bd:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      bd: '{{ mso_test.bd_1 }}'
      state: absent
    register: nm_remove_site_bd

  - name: Verify nm_remove_site_bd
    ansible.builtin.assert:
      that:
      - nm_remove_site_bd is changed
      - nm_remove_site_bd.previous.bdRef.bdName == "{{ mso_test.bd_1 }}"
      - nm_remove_site_bd.previous.bdRef.templateName == "{{ mso_test.template_1 }}"
      - nm_remove_site_bd.current == {}

  - name: Remove template BD
    cisco.mso.mso_schema_template_bd:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template_1 }}'
      bd: '{{ mso_test.bd_1 }}'
      state: absent
    register: nm_remove_bd

  - name: Verify nm_remove_bd
    ansible.builtin.assert:
      that:
      - nm_remove_bd is changed
      - nm_remove_bd.current == {}

  - name: Add new template BD
    cisco.mso.mso_schema_template_bd:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template_1 }}'
      bd: '{{ mso_test.bd_3 }}'
      vrf:
        name: '{{ mso_test.vrf_1 }}'
      state: present
    register: nm_add_bd_template

  - name: Verify nm_add_bd_template
    ansible.builtin.assert:
      that:
      - nm_add_bd_template is changed
      - nm_add_bd_template.previous == {}

  - name: Add a new l3 out to BD (BD not associated to Site)
    cisco.mso.mso_schema_site_bd_l3out:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_1 }}'
      bd: '{{ mso_test.bd_3 }}'
      l3out:
        name: '{{ mso_test.l3out_1 }}'
      state: present
    register: add_bd_site_l3out

  - name: Verify add_bd_site_l3out
    ansible.builtin.assert:
      that:
      - add_bd_site_l3out is changed
      - add_bd_site_l3out.previous == {}
      - add_bd_site_l3out.current.l3outName == "{{ mso_test.l3out_1 }}"

  - name: Create VRF for L3out on APIC Testing Exists
    cisco.mso.mso_schema_template_vrf:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.l3out_template }}'
      vrf: '{{ mso_test.apic_vrf }}'
      state: present

  - name: Create BD for L3out on APIC Testing Exists
    cisco.mso.mso_schema_template_bd:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.l3out_template }}'
      bd: '{{ mso_test.l3out_bd }}'
      vrf:
        name: '{{ mso_test.apic_vrf }}'
      state: present

  - name: Attach site to schema
    cisco.mso.mso_schema_site:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.l3out_template }}'
      state: present

  - name: Deploy template for L3out on APIC Testing
    cisco.mso.ndo_schema_template_deploy:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.l3out_template }}'
      sites:
        - '{{ mso_test.site }}'
      state: deploy

  - name: Set ansible_network_os to cisco.aci.aci and ansible_connection to ansible.netcommon.httpapi
    ansible.builtin.set_fact:
      ansible_connection: ansible.netcommon.httpapi
      ansible_network_os: cisco.aci.aci

  - name: Reset the ansible_connection to access the APIC
    ansible.builtin.meta: reset_connection

  - name: Ensure l3out exists in ACI
    cisco.aci.aci_l3out:
      <<: *aci_info
      tenant: '{{ mso_test.tenant }}'
      l3out: '{{ mso_test.apic_l3out }}'
      vrf: '{{ mso_test.apic_vrf }}'
      domain: '{{ mso_test.apic_l3out_domain }}'
      state: present

  - name: Set ansible_network_os to cisco.nd.nd and ansible_connection to ansible.netcommon.httpapi
    ansible.builtin.set_fact:
      ansible_connection: ansible.netcommon.httpapi
      ansible_network_os: cisco.nd.nd

  - name: Reset the ansible_connection to access the MSO/NDO
    ansible.builtin.meta: reset_connection

  - name: Create apic L3out to site bd
    cisco.mso.mso_schema_site_bd_l3out: &l3out_on_apic
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.l3out_template }}'
      site: '{{ mso_test.site }}'
      bd: '{{ mso_test.l3out_bd }}'
      l3out:
        name: '{{ mso_test.apic_vrf }}'
        tenant: '{{ mso_test.tenant }}'
      state: present
    register: nm_create_l3out_on_apic

  - name: Create apic L3out to site bd again
    cisco.mso.mso_schema_site_bd_l3out:
      <<: *l3out_on_apic
      state: present
    register: nm_create_l3out_on_apic_again

  - name: Query apic L3out site bd
    cisco.mso.mso_schema_site_bd_l3out:
      <<: *l3out_on_apic
      state: query
    register: query_l3out_on_apic

  - name: Remove apic L3out from site bd
    cisco.mso.mso_schema_site_bd_l3out:
      <<: *l3out_on_apic
      state: absent
    register: nm_remove_l3out_on_apic

  - name: Create apic L3out to site bd again with schema (error)
    cisco.mso.mso_schema_site_bd_l3out:
      <<: *l3out_on_apic
      l3out:
        name: '{{ mso_test.apic_vrf }}'
        tenant: '{{ mso_test.tenant }}'
        schema: '{{ mso_test.schema }}'
    register: nm_create_l3out_schema_error
    ignore_errors: true

  - name: Create apic L3out to site bd again with template (error)
    cisco.mso.mso_schema_site_bd_l3out:
      <<: *l3out_on_apic
      l3out:
        name: '{{ mso_test.apic_vrf }}'
        tenant: '{{ mso_test.tenant }}'
        template: '{{ mso_test.l3out_template }}'
    register: nm_create_l3out_template_error
    ignore_errors: true

  - name: Create apic L3out to site bd again with schema and template (error)
    cisco.mso.mso_schema_site_bd_l3out:
      <<: *l3out_on_apic
      l3out:
        name: '{{ mso_test.apic_vrf }}'
        tenant: '{{ mso_test.tenant }}'
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.l3out_template }}'
    register: nm_create_l3out_both_error
    ignore_errors: true

  - name: Assert apic L3out on site bd
    ansible.builtin.assert:
      that:
      - nm_create_l3out_on_apic is changed
      - nm_create_l3out_on_apic.previous == {}
      - nm_create_l3out_on_apic.current.l3outName == "{{ mso_test.apic_vrf }}"
      - nm_create_l3out_on_apic.current.tenant == mso_test.tenant
      - nm_create_l3out_on_apic_again is not changed
      - nm_create_l3out_on_apic_again.previous.l3outName == "{{ mso_test.apic_vrf }}"
      - nm_create_l3out_on_apic_again.previous.tenant == mso_test.tenant
      - nm_create_l3out_on_apic_again.current.l3outName == "{{ mso_test.apic_vrf }}"
      - nm_create_l3out_on_apic_again.current.tenant == mso_test.tenant
      - query_l3out_on_apic is not changed
      - nm_remove_l3out_on_apic is changed
      - nm_remove_l3out_on_apic.previous.l3outName == "{{ mso_test.apic_vrf }}"
      - nm_remove_l3out_on_apic.previous.tenant == mso_test.tenant
      - nm_remove_l3out_on_apic.current == {}
      - nm_create_l3out_schema_error is failed
      - 'nm_create_l3out_schema_error.msg == "parameters are mutually exclusive: tenant|schema found in l3out"'
      - 'nm_create_l3out_template_error.msg == "parameters are mutually exclusive: tenant|template found in l3out"'
      - 'nm_create_l3out_both_error.msg == "parameters are mutually exclusive: tenant|schema, tenant|template found in l3out"'

  always:
  - name: Restore NDO connection for cleanup
    ansible.builtin.set_fact:
      ansible_connection: ansible.netcommon.httpapi
      ansible_network_os: cisco.nd.nd

  - name: Reset the connection to access NDO for cleanup
    ansible.builtin.meta: reset_connection

  - name: Undeploy template for L3out on APIC Testing
    cisco.mso.ndo_schema_template_deploy:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.l3out_template }}'
      sites:
        - '{{ mso_test.site }}'
      state: undeploy
    ignore_errors: true

  - name: Ensure templates detached from site
    cisco.mso.mso_schema_site:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{item.template}}'
      state: absent
    ignore_errors: true
    loop:
      - { template: '{{ mso_test.template_1 }}'}
      - { template: '{{ mso_test.template_2 }}'}
      - { template: '{{ mso_test.l3out_template }}'}

  - name: Remove schemas
    cisco.mso.mso_schema:
      <<: *mso_info
      schema: '{{ item }}'
      state: absent
    ignore_errors: true
    loop:
      - '{{ mso_test.schema_2 }}'
      - '{{ mso_test.schema }}'

  - name: Set connection to APIC for L3Out cleanup
    ansible.builtin.set_fact:
      ansible_connection: ansible.netcommon.httpapi
      ansible_network_os: cisco.aci.aci

  - name: Reset the connection to access APIC for cleanup
    ansible.builtin.meta: reset_connection

  - name: Remove test L3Out from APIC
    cisco.aci.aci_l3out:
      <<: *aci_info
      tenant: '{{ mso_test.tenant }}'
      l3out: '{{ mso_test.apic_l3out }}'
      state: absent
    ignore_errors: true

  - name: Restore NDO connection after cleanup
    ansible.builtin.set_fact:
      ansible_connection: ansible.netcommon.httpapi
      ansible_network_os: cisco.nd.nd

  - name: Reset the connection after cleanup
    ansible.builtin.meta: reset_connection
