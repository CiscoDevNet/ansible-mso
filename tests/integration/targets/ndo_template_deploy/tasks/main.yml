- name: Test that we have an ACI MultiSite host, username and password
  ansible.builtin.fail:
    msg: 'Please define the following variables: mso_hostname, mso_username and mso_password.'
  when: mso_hostname is not defined or mso_username is not defined or mso_password is not defined


# CLEAN ENVIRONMENT
- name: Set test connection and fixture variables
  ansible.builtin.set_fact:
    mso_info: &mso_info
      host: '{{ mso_hostname }}'
      username: '{{ mso_username }}'
      password: '{{ mso_password }}'
      validate_certs: '{{ mso_validate_certs | default(false) }}'
      use_ssl: '{{ mso_use_ssl | default(true) }}'
      use_proxy: '{{ mso_use_proxy | default(true) }}'
      output_level: '{{ mso_output_level | default("debug") }}'
    mso_test:
      tenant: '{{ mso_tenant | default("ansible_test") }}'
      schema: '{{ mso_schema | default("ansible_test") }}'
      schema_2: '{{ mso_schema | default("ansible_test") }}_2'
      site: '{{ mso_site | default("ansible_test") }}'
      fabric_template: ansible_fabric_policy_template
      template_1: Template 1
      template_2: Template 2

- name: Query MSO version
  cisco.mso.mso_version:
    <<: *mso_info
    state: query
  register: version

# (ansible_test tenant+site handled by the mso_setup_tenant_site setup target)

- name: Exercise ndo_template_deploy
  block:
    - name: Undeploy template
      cisco.mso.ndo_schema_template_deploy:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: "{{ item }}"
        sites:
          - '{{ mso_test.site }}'
        state: undeploy
      ignore_errors: true
      loop:
        - '{{ mso_test.template_1 }}'
        - '{{ mso_test.template_2 }}'

    - name: Remove schemas
      cisco.mso.mso_schema:
        <<: *mso_info
        schema: '{{ item }}'
        state: absent
      loop:
        - '{{ mso_test.schema_2 }}'
        - '{{ mso_test.schema }}'

    - name: Undeploy fabric template
      cisco.mso.ndo_template_deploy:
        <<: *mso_info
        template: '{{ mso_test.fabric_template }}'
        type: fabric_policy
        state: undeploy_all
      ignore_errors: true

    - name: Remove fabric template
      cisco.mso.ndo_template: &fabric_template_absent
        <<: *mso_info
        template: '{{ mso_test.fabric_template }}'
        type: fabric_policy
        state: absent
      ignore_errors: true

    - name: Ensure schema 1 with Template 1, and Template 2 exist
      cisco.mso.mso_schema_template:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        tenant: '{{ mso_test.tenant }}'
        template: '{{ item }}'
        state: present
      loop:
      - '{{ mso_test.template_1 }}'
      - '{{ mso_test.template_2 }}'

    - name: Query schema template
      cisco.mso.mso_schema_template:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        state: query
      register: query_schema_template

    - name: Add physical site to a schema
      cisco.mso.mso_schema_site:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        site: '{{ mso_test.site }}'
        template: '{{ item }}'
        state: present
      loop:
      - '{{ mso_test.template_1 }}'
      - '{{ mso_test.template_2 }}'

    - name: Ensure fabric policy template exists
      cisco.mso.ndo_template:
        <<: *fabric_template_absent
        sites: 
          - name: '{{ mso_test.site }}'
        state: present
      register: create_fabric_template

    - name: Deploy templates (check_mode)
      cisco.mso.ndo_schema_template_deploy:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: "{{ item }}"
        sites:
          - '{{ mso_test.site }}'
        state: deploy
      check_mode: true
      register: cm_deploy_template
      loop:
      - '{{ mso_test.template_1 }}'
      - '{{ mso_test.template_2 }}'

    - name: Verify cm_deploy_template
      ansible.builtin.assert:
        that:
        - item is not changed
      loop: "{{ cm_deploy_template.results }}"

    - name: Deploy templates (normal_mode)
      cisco.mso.ndo_schema_template_deploy:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: "{{ item }}"
        sites:
          - '{{ mso_test.site }}'
        state: deploy
      register: nm_deploy_template
      loop:
      - '{{ mso_test.template_1 }}'
      - '{{ mso_test.template_2 }}'

    - name: Verify nm_deploy_template 
      ansible.builtin.assert:
        that:
        - item is not changed
        - '"isRedeploy" not in item.current.reqDetails'
      loop: "{{ nm_deploy_template.results }}"

    - name: Verify nm_deploy_template 4.0 specific
      ansible.builtin.assert:
        that:
        - '"deploy" in item.current.reqDetails'
      loop: "{{ nm_deploy_template.results }}"
      when: version.current.version is version('4.0', '>=')

    - name: Deploy fabric policy template (check_mode)
      cisco.mso.ndo_template_deploy:
        <<: *fabric_template_absent
        state: deploy
      check_mode: true
      register: cm_fabric_template_deploy

    - name: Verify cm_fabric_template_deploy
      ansible.builtin.assert:
        that:
        - cm_fabric_template_deploy is not changed

    - name: Deploy fabric policy template (normal_mode)
      cisco.mso.ndo_template_deploy:
        <<: *fabric_template_absent
        state: deploy
      register: nm_fabric_template_deploy

    - name: Verify nm_fabric_template_deploy 
      ansible.builtin.assert:
        that:
        - nm_fabric_template_deploy is not changed
        - '"isRedeploy" not in nm_fabric_template_deploy.current.reqDetails'
        - '"deploy" in nm_fabric_template_deploy.current.reqDetails'
        - nm_fabric_template_deploy.current.reqDetails.templateType == "fabricPolicy"
        - nm_fabric_template_deploy.current.reqDetails.templateName == mso_test.fabric_template
        - nm_fabric_template_deploy.current.reqDetails.templateId == create_fabric_template.current.templateId
      when: version.current.version is version('4.0', '>=')

    - name: Query deployment
      cisco.mso.ndo_schema_template_deploy: 
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: "{{ item }}"
        state: query
      register: query_deploy_status
      loop:
      - '{{ mso_test.template_1 }}'
      - '{{ mso_test.template_2 }}'

    - name: Verify query_deploy_status
      ansible.builtin.assert:
        that:
        - item is not changed
        - item.current.status.0.status.siteStatus == "Succeeded"
      loop: "{{ query_deploy_status.results }}"

    - name: Query fabric policy template deployment using template id
      cisco.mso.ndo_schema_template_deploy: 
        <<: *mso_info
        template_id: '{{ create_fabric_template.current.templateId }}'
        type: l3out # This is expected to be ignored while using template_id
        state: query
      register: query_fabric_template_deploy

    - name: Verify query_fabric_template_deploy
      ansible.builtin.assert:
        that:
        - query_fabric_template_deploy is not changed
        - query_fabric_template_deploy.current.operDetails.detailedStatus.0.succeeded is true
        - query_fabric_template_deploy.current.operDetails.taskStatus == "Complete"
        - query_fabric_template_deploy.current.reqDetails.templateType == "fabricPolicy"
        - query_fabric_template_deploy.current.reqDetails.templateName == mso_test.fabric_template

    - name: Redeploy templates
      cisco.mso.ndo_schema_template_deploy:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ item }}'
        sites:
          - '{{ mso_test.site }}'
        state: redeploy
      register: redeploy_template
      loop:
        - '{{ mso_test.template_1 }}'
        - '{{ mso_test.template_2 }}'

    - name: Verify redeploy_template
      ansible.builtin.assert:
        that:
        - item is not changed
        - item.current.reqDetails.isRedeploy == true
      loop: "{{ redeploy_template.results }}"

    - name: Verify redeploy_template 4.0 specific
      ansible.builtin.assert:
        that:
        - '"deploy" in item.current.reqDetails'
      loop: "{{ redeploy_template.results }}"
      when: version.current.version is version('4.0', '>=')

    - name: Redeploy fabric policy template
      cisco.mso.ndo_template_deploy:
        <<: *fabric_template_absent
        state: redeploy
      register: redeploy_fabric_template

    - name: Verify redeploy_fabric_template
      ansible.builtin.assert:
        that:
        - redeploy_fabric_template is not changed
        - redeploy_fabric_template.current.reqDetails.isRedeploy == true

    - name: Undeploy templates
      cisco.mso.ndo_schema_template_deploy:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ item }}'
        sites:
          - '{{ mso_test.site }}'
        state: undeploy
      register: undeploy_template
      loop:
        - '{{ mso_test.template_1 }}'
        - '{{ mso_test.template_2 }}'

    - name: Verify undeploy_template
      ansible.builtin.assert:
        that:
        - item is not changed
        - '"undeploy" in item.current.reqDetails'
      loop: "{{ undeploy_template.results }}"

    - name: Undeploy fabric policy template
      cisco.mso.ndo_template_deploy:
        <<: *fabric_template_absent
        state: undeploy
        sites:
          - '{{ mso_test.site }}'
      register: undeploy_fabric_template

    - name: Redeploy fabric policy template again
      cisco.mso.ndo_template_deploy:
        <<: *fabric_template_absent
        state: redeploy
      register: redeploy_fabric_template

    - name: Undeploy fabric policy template from all sites
      cisco.mso.ndo_template_deploy:
        <<: *fabric_template_absent
        state: undeploy_all
      register: undeploy_all_fabric_template

    - name: Verify undeploy_fabric_template
      ansible.builtin.assert:
        that:
        - undeploy_fabric_template is not changed
        - '"undeploy" in undeploy_fabric_template.current.reqDetails'
        - undeploy_all_fabric_template is not changed
        - '"undeploy" in undeploy_all_fabric_template.current.reqDetails'

    - name: Add VRF1 with validation error
      cisco.mso.mso_schema_template_vrf: &fail_validation
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_2 }}'
        vrf: VRF1
        layer3_multicast: true
        vzany: true
        state: present

    - name: Deploy template with validation error
      cisco.mso.ndo_schema_template_deploy:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_2 }}'
        sites:
          - '{{ mso_test.site }}'
        state: deploy
      register: failed_validaton_deploy
      ignore_errors: true

    - name: Redeploy template with validation error
      cisco.mso.ndo_schema_template_deploy:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_2 }}'
        sites:
          - '{{ mso_test.site }}'
        state: redeploy
      register: failed_validaton_redeploy
      ignore_errors: true

    - name: Set error message for validation errors
      ansible.builtin.set_fact:
        error_message_failed_validaton_deploy: 'MSO Error 400: Bad Request: Patch Failed, Received: vzAny contract must be configured if vzAny flag is set. VRF(s) : VRF1 exception while trying to update schema'
        error_message_failed_validaton_redeploy: 'MSO Error 400: VRF: VRF1 in Schema: {{ mso_test.schema }}\s*,?\s*Template: Template2\s*,?\s*has VzAnyEnabled flag enabled but is not consuming or providing contracts'

    - name: Verify validation errors before deploy
      ansible.builtin.assert:
        that:
        - failed_validaton_deploy.msg == error_message_failed_validaton_deploy
        - failed_validaton_redeploy.msg == error_message_failed_validaton_deploy
      when: version.current.version is version('4.0', '<')

    - name: Verify validation errors before deploy and redploy
      ansible.builtin.assert:
        that:
        - failed_validaton_deploy.msg is match(error_message_failed_validaton_redeploy)
        - failed_validaton_redeploy.msg is match(error_message_failed_validaton_redeploy)
      when: version.current.version is version('4.0', '>=')

    - name: Remove VRF1 with validation error
      cisco.mso.mso_schema_template_vrf:
        <<: *fail_validation
        state: absent

    - name: Deploy schema template with template_id
      cisco.mso.ndo_schema_template_deploy:
        <<: *mso_info
        template_id: "{{ query_schema_template.current.templateID }}"
        state: deploy
      register: deploy_template_all

    - name: Query deployment
      cisco.mso.ndo_schema_template_deploy: 
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        state: query
      register: query_deploy_status_all

    - name: Check deployment status of Template 1
      cisco.mso.mso_schema_template_deploy_status:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        state: query
      register: deployment_status

    - name: Redeploy templates
      cisco.mso.ndo_schema_template_deploy:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        sites: 
          - '{{ mso_test.site }}'
        state: redeploy
      register: redeploy_template_all

    - name: Query redeployment
      cisco.mso.ndo_schema_template_deploy: 
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        state: query
      register: query_redeploy_status_all

    - name: Undeploy template from all sites
      cisco.mso.ndo_schema_template_deploy:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        state: undeploy_all
      register: undeploy_template_all

    - name: Query undeployment
      cisco.mso.ndo_schema_template_deploy: 
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: '{{ mso_test.template_1 }}'
        state: query
      register: query_undeploy_status_all

    - name: Verify multiple sites
      ansible.builtin.assert:
        that:
        - deploy_template_all is not changed
        - redeploy_template_all is not changed
        - '"isRedeploy" in redeploy_template_all.current.reqDetails'
        - undeploy_template_all is not changed
        - '"undeploy" in undeploy_template_all.current.reqDetails'
        - undeploy_template_all.current.reqDetails.undeploy | length == 1
        - deployment_status.current | length == 1
        - query_deploy_status_all.current.status | length == 1
        - query_deploy_status_all.current.status.0.status.siteStatus == "Succeeded"
        - query_redeploy_status_all.current.status | length == 1
        - query_redeploy_status_all.current.status.0.status.siteStatus == "Succeeded"
        - query_undeploy_status_all.current.status == []

    - name: Verify multiple sites 4.0 specific
      ansible.builtin.assert:
        that:
        - '"deploy" in deploy_template_all.current.reqDetails'
        - '"deploy" in redeploy_template_all.current.reqDetails'
      when: version.current.version is version('4.0', '>=')

  always:
    # CLEANUP SCHEMAS AND FABRIC TEMPLATE
    - name: Undeploy template even when a test fails
      cisco.mso.ndo_schema_template_deploy:
        <<: *mso_info
        schema: '{{ mso_test.schema }}'
        template: "{{ item }}"
        sites:
          - '{{ mso_test.site }}'
        state: undeploy
      ignore_errors: true
      loop:
        - '{{ mso_test.template_1 }}'
        - '{{ mso_test.template_2 }}'

    - name: Remove schemas even when a test fails
      cisco.mso.mso_schema:
        <<: *mso_info
        schema: '{{ item }}'
        state: absent
      ignore_errors: true
      loop:
      - '{{ mso_test.schema_2 }}'
      - '{{ mso_test.schema }}'

    - name: Undeploy fabric template even when a test fails
      cisco.mso.ndo_template_deploy:
        <<: *mso_info
        template: '{{ mso_test.fabric_template }}'
        type: fabric_policy
        state: undeploy_all
      ignore_errors: true

    - name: Remove fabric template even when a test fails
      cisco.mso.ndo_template:
        <<: *mso_info
        template: '{{ mso_test.fabric_template }}'
        type: fabric_policy
        state: absent
      ignore_errors: true
