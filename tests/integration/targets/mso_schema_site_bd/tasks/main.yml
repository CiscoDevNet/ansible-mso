- name: Test that we have an ACI MultiSite host, username and password
  ansible.builtin.fail:
    msg: 'Please define the following variables: mso_hostname, mso_username and mso_password.'
  when: mso_hostname is not defined or mso_username is not defined or mso_password is not defined

- name: Set test connection and fixture variables
  ansible.builtin.set_fact:
    mso_info: &mso_info
      host: '{{ mso_hostname }}'
      username: '{{ mso_username }}'
      password: '{{ mso_password }}'
      validate_certs: '{{ mso_validate_certs | default(false) }}'
      use_ssl: '{{ mso_use_ssl | default(true) }}'
      use_proxy: '{{ mso_use_proxy | default(true) }}'
      output_level: debug
    mso_test:
      schema: '{{ mso_schema_site_bd | default(mso_schema | default("ansible_test")) }}'
      tenant: '{{ mso_tenant_site_bd | default(mso_tenant | default("ansible_test")) }}'
      site: '{{ mso_site_site_bd | default(mso_site | default("ansible_test")) }}'
      template: Template1
      template_without_site: Template2
      vrf: VRF1
      bd:
        name: ansible_test_1
        host_route_default: false
        host_route: true
        svi_mac: 00:22:23:F1:21:F9
        subnet:
          ip: 10.20.30.1/24
          description: site BD child subnet
          scope: public
          shared: true
          no_default_gateway: true
          querier: true
      bd_2:
        name: ansible_test_2
      bd_3:
        name: ansible_test_3

- name: Exercise mso_schema_site_bd
  block:

  # CLEAN ENVIRONMENT
  # Due to API changes in ND 4.2, the configured site and tenant are
  # prerequisites for this test and must already exist. They are intentionally
  # not created or queried here; only their tenant-site association is managed.
  - name: Remove test schema before testing
    cisco.mso.mso_schema:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      state: absent

  - name: Ensure schema and template exist
    cisco.mso.mso_schema_template:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      tenant: '{{ mso_test.tenant }}'
      template: '{{ mso_test.template }}'

  - name: Ensure unassociated schema template exists for error handling
    cisco.mso.mso_schema_template:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      tenant: '{{ mso_test.tenant }}'
      template: '{{ mso_test.template_without_site }}'

  # Exercise the no-site-associated validation before the site is associated.
  - name: Query site BD without a site association in check mode
    cisco.mso.mso_schema_site_bd:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      state: query
    check_mode: true
    ignore_errors: true
    register: cm_no_site_associated

  # TODO: mso_tenant_site is deprecated. Replace this with the supported
  # tenant-site association solution, or require a stable test environment
  # where this association is already present before the test runs.
  - name: Associate the site with the tenant
    cisco.mso.mso_tenant_site:
      <<: *mso_info
      tenant: '{{ mso_test.tenant }}'
      site: '{{ mso_test.site }}'

  - name: Associate the site with the schema template
    cisco.mso.mso_schema_site:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
    register: nm_schema_site

  - name: Query site BD with template not associated with site
    cisco.mso.mso_schema_site_bd:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template_without_site }}'
      state: query
    check_mode: true
    ignore_errors: true
    register: cm_template_without_site

  - name: Ensure template VRF exists
    cisco.mso.mso_schema_template_vrf:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      vrf: '{{ mso_test.vrf }}'

  # Template BDs are replicated automatically to the associated site.
  - name: Ensure template BDs exist
    cisco.mso.mso_schema_template_bd:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      template: '{{ mso_test.template }}'
      bd: '{{ item }}'
      layer2_stretch: false
      vrf:
        name: '{{ mso_test.vrf }}'
    loop:
    - '{{ mso_test.bd.name }}'
    - '{{ mso_test.bd_2.name }}'
    - '{{ mso_test.bd_3.name }}'

  # CREATE
  # Site BDs are not explicitly created because NDO replicates the template
  # BDs to the associated site.

  # UPDATE
  # Reconcile the parent after adding a site-local subnet. The child is
  # intentionally omitted from the parent module input.
  # CHILD PRESERVATION
  - name: Add site BD subnet for parent update preservation
    cisco.mso.mso_schema_site_bd_subnet:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      bd: '{{ mso_test.bd.name }}'
      subnet: '{{ mso_test.bd.subnet.ip }}'
      description: '{{ mso_test.bd.subnet.description }}'
      scope: '{{ mso_test.bd.subnet.scope }}'
      shared: '{{ mso_test.bd.subnet.shared }}'
      no_default_gateway: '{{ mso_test.bd.subnet.no_default_gateway }}'
      querier: '{{ mso_test.bd.subnet.querier }}'
    register: nm_add_site_bd_subnet

  - name: Verify site BD subnet fixture
    ansible.builtin.assert:
      that:
      - nm_add_site_bd_subnet is changed
      - nm_add_site_bd_subnet.current.ip == mso_test.bd.subnet.ip
      - nm_add_site_bd_subnet.current.description == mso_test.bd.subnet.description
      - nm_add_site_bd_subnet.current.scope == mso_test.bd.subnet.scope
      - nm_add_site_bd_subnet.current.shared == mso_test.bd.subnet.shared
      - nm_add_site_bd_subnet.current.noDefaultGateway == mso_test.bd.subnet.no_default_gateway
      - nm_add_site_bd_subnet.current.querier == mso_test.bd.subnet.querier

  - name: Update site BD in check mode
    cisco.mso.mso_schema_site_bd: &site_bd_update
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      bd: '{{ mso_test.bd.name }}'
      host_route: '{{ mso_test.bd.host_route }}'
      svi_mac: '{{ mso_test.bd.svi_mac }}'
    check_mode: true
    register: cm_update_site_bd

  - name: Update site BD
    cisco.mso.mso_schema_site_bd:
      <<: *site_bd_update
    register: nm_update_site_bd

  - name: Update site BD again
    cisco.mso.mso_schema_site_bd:
      <<: *site_bd_update
    register: nm_update_site_bd_again

  - name: Verify site BD update and idempotency
    ansible.builtin.assert:
      that:
      - cm_update_site_bd is changed
      - nm_update_site_bd is changed
      - nm_update_site_bd_again is not changed
      - cm_update_site_bd.current.bdRef == nm_update_site_bd.current.bdRef
      - nm_update_site_bd.current.bdRef.bdName == mso_test.bd.name
      - nm_update_site_bd.current.bdRef.templateName == mso_test.template
      - cm_update_site_bd.current.mac == nm_update_site_bd.current.mac == mso_test.bd.svi_mac
      - cm_update_site_bd.previous.hostBasedRouting == mso_test.bd.host_route_default
      - cm_update_site_bd.current.hostBasedRouting == mso_test.bd.host_route
      - nm_update_site_bd.previous.hostBasedRouting == mso_test.bd.host_route_default
      - nm_update_site_bd.current.hostBasedRouting == mso_test.bd.host_route

  - name: Verify site BD child preservation
    ansible.builtin.assert:
      that:
      - nm_update_site_bd.current.subnets | length == 1
      - nm_update_site_bd.current.subnets[0].ip == mso_test.bd.subnet.ip
      - nm_update_site_bd.current.subnets[0].description == mso_test.bd.subnet.description
      - nm_update_site_bd.current.subnets[0].scope == mso_test.bd.subnet.scope
      - nm_update_site_bd.current.subnets[0].shared == mso_test.bd.subnet.shared
      - nm_update_site_bd.current.subnets[0].noDefaultGateway == mso_test.bd.subnet.no_default_gateway
      - nm_update_site_bd.current.subnets[0].querier == mso_test.bd.subnet.querier
      - nm_update_site_bd_again.current.subnets == nm_update_site_bd.current.subnets

  # QUERY
  - name: Query site BD 1 in check mode
    cisco.mso.mso_schema_site_bd: &site_bd_1_query
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      bd: '{{ mso_test.bd.name }}'
      state: query
    check_mode: true
    register: cm_query_site_bd_1

  - name: Query site BD 1
    cisco.mso.mso_schema_site_bd:
      <<: *site_bd_1_query
    register: nm_query_site_bd_1

  - name: Query all BDs in check mode
    cisco.mso.mso_schema_site_bd: &all_site_bds_query
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      state: query
    check_mode: true
    register: cm_query_all_bd

  - name: Query all BDs
    cisco.mso.mso_schema_site_bd:
      <<: *all_site_bds_query
    register: nm_query_all_bd

  - name: Verify individual site BD query
    ansible.builtin.assert:
      that:
      - cm_query_site_bd_1 is not changed
      - nm_query_site_bd_1 is not changed
      - cm_query_site_bd_1.current.bdRef == nm_query_site_bd_1.current.bdRef
      - cm_query_site_bd_1.current.bdRef.bdName == mso_test.bd.name
      - cm_query_site_bd_1.current.bdRef.templateName == mso_test.template
      - cm_query_site_bd_1.current.bdRef.schemaId is defined
      - cm_query_site_bd_1.current.hostBasedRouting == nm_query_site_bd_1.current.hostBasedRouting == mso_test.bd.host_route
      - nm_query_site_bd_1.current.subnets == nm_update_site_bd.current.subnets

  - name: Verify site BD collection query
    ansible.builtin.assert:
      that:
      - cm_query_all_bd is not changed
      - nm_query_all_bd is not changed
      - cm_query_all_bd.current == nm_query_all_bd.current
      - cm_query_all_bd.current | length == nm_query_all_bd.current | length == 3
      - cm_query_all_bd.current | selectattr('bdRef.bdName', 'equalto', mso_test.bd.name) | list | length == 1
      - cm_query_all_bd.current | selectattr('bdRef.bdName', 'equalto', mso_test.bd_2.name) | list | length == 1
      - cm_query_all_bd.current | selectattr('bdRef.bdName', 'equalto', mso_test.bd_3.name) | list | length == 1
      - cm_query_all_bd.current | selectattr('bdRef.schemaId', 'defined') | list | length == 3
      - (cm_query_all_bd.current | selectattr('bdRef.bdName', 'equalto', mso_test.bd.name) | list | first).subnets[0].ip == mso_test.bd.subnet.ip
      - (nm_query_all_bd.current | selectattr('bdRef.bdName', 'equalto', mso_test.bd.name) | list | first).subnets[0].ip == mso_test.bd.subnet.ip

  # DELETE
  # Delete the child-populated BD1 to verify that removing the parent BD
  # also removes its site-local descendants
  - name: Delete site BD 1 with child subnet in check mode
    cisco.mso.mso_schema_site_bd: &site_bd_with_child_absent
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      bd: '{{ mso_test.bd.name }}'
      state: absent
    check_mode: true
    register: cm_remove_site_bd_with_child

  - name: Delete site BD 1 with child subnet
    cisco.mso.mso_schema_site_bd:
      <<: *site_bd_with_child_absent
    register: nm_remove_site_bd_with_child

  - name: Delete site BD 1 with child subnet again
    cisco.mso.mso_schema_site_bd:
      <<: *site_bd_with_child_absent
    register: nm_delete_site_bd_again

  - name: Verify site BD 1 delete, child removal, and idempotency
    ansible.builtin.assert:
      that:
      - cm_remove_site_bd_with_child is changed
      - cm_remove_site_bd_with_child.previous.bdRef == nm_update_site_bd.current.bdRef
      - cm_remove_site_bd_with_child.previous.bdRef.bdName == mso_test.bd.name
      - cm_remove_site_bd_with_child.previous.bdRef.schemaId is defined
      - cm_remove_site_bd_with_child.previous.subnets | length == 1
      - cm_remove_site_bd_with_child.current == cm_remove_site_bd_with_child.proposed == {}
      - nm_remove_site_bd_with_child is changed
      - nm_remove_site_bd_with_child.previous.bdRef == nm_update_site_bd.current.bdRef
      - nm_remove_site_bd_with_child.previous.bdRef.bdName == mso_test.bd.name
      - nm_remove_site_bd_with_child.previous.bdRef.schemaId is defined
      - nm_remove_site_bd_with_child.previous.subnets | length == 1
      - nm_remove_site_bd_with_child.current == nm_remove_site_bd_with_child.proposed == {}
      - nm_delete_site_bd_again is not changed
      - nm_delete_site_bd_again.proposed == nm_delete_site_bd_again.current == {}

  # ERROR HANDLING
  # Site-association errors are exercised during setup, before and after the
  # primary template is associated with the site.
  - name: Query non-existing BD in check mode
    cisco.mso.mso_schema_site_bd:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      bd: non_existing_bd
      state: query
    check_mode: true
    ignore_errors: true
    register: cm_query_non_bd

  - name: Test invalid state in check mode
    cisco.mso.mso_schema_site_bd:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      bd: '{{ mso_test.bd.name }}'
      state: non_existing_state
    check_mode: true
    ignore_errors: true
    register: cm_non_existing_state

  - name: Query non-existing template in check mode
    cisco.mso.mso_schema_site_bd:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: '{{ mso_test.site }}'
      template: non_existing_template
      bd: '{{ mso_test.bd.name }}'
      state: query
    check_mode: true
    ignore_errors: true
    register: cm_non_existing_template

  - name: Query non-existing schema in check mode
    cisco.mso.mso_schema_site_bd:
      <<: *mso_info
      schema: non_existing_schema
      site: '{{ mso_test.site }}'
      template: '{{ mso_test.template }}'
      bd: '{{ mso_test.bd.name }}'
      state: query
    check_mode: true
    ignore_errors: true
    register: cm_non_existing_schema

  - name: Query non-existing site in check mode
    cisco.mso.mso_schema_site_bd:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      site: non_existing_site
      template: '{{ mso_test.template }}'
      bd: '{{ mso_test.bd.name }}'
      state: query
    check_mode: true
    ignore_errors: true
    register: cm_non_existing_site

  - name: Verify error-handling scenarios
    ansible.builtin.assert:
      that:
      - cm_no_site_associated is not changed
      - "cm_no_site_associated.msg == \"No site associated with template '\" ~ mso_test.template ~ \"'. Associate the site with the template using mso_schema_site.\""
      - cm_template_without_site is not changed
      - "cm_template_without_site.msg == \"Provided site-template association '\" ~ mso_test.site ~ \"-\" ~ mso_test.template_without_site ~ \"' does not exist.\""
      - cm_query_non_bd is not changed
      - cm_query_non_bd.msg == "BD 'non_existing_bd' not found"
      - cm_non_existing_state is not changed
      - 'cm_non_existing_state.msg == "value of state must be one of: absent, present, query, got: non_existing_state"'
      - cm_non_existing_template is not changed
      - "cm_non_existing_template.msg == \"Provided template 'non_existing_template' does not exist. Existing templates: \" ~ mso_test.template ~ \", \" ~ mso_test.template_without_site"
      - cm_non_existing_schema is not changed
      - cm_non_existing_schema.msg == "Provided schema 'non_existing_schema' does not exist."
      - cm_non_existing_site is not changed
      - cm_non_existing_site.msg == "Site 'non_existing_site' is not a valid site name."

  always:
  # CLEANUP
  - name: Remove test schema even when a test fails
    cisco.mso.mso_schema:
      <<: *mso_info
      schema: '{{ mso_test.schema }}'
      state: absent
